format = "zeno-fcis/package-set/1"
version = "1.0.0-rc.1"
rust_toolchain = "1.97.1"

# Dependency-first order for crates.io publication. The checker rejects a
# missing, duplicated, extra, or dependency-after-dependent package.
publish_order = [
    "zeno-fcis-value",
    "zeno-fcis-core",
    "zeno-fcis-codec",
    "zeno-fcis-project",
    "zeno-fcis-schema",
    "zeno-fcis-patch",
    "zeno-fcis-plan",
    "zeno-fcis-crypto",
    "zeno-fcis-compose",
    "zeno-fcis-receipt",
    "zeno-fcis-catalog",
    "zeno-fcis-refine",
    "zeno-fcis-evidence",
    "zeno-fcis-transition",
    "zeno-fcis-laws",
    "zeno-fcis-shell",
    "zeno-fcis-security",
    "zeno-fcis-secret",
    "zeno-fcis-domain",
    "zeno-fcis-synthesis",
    "zeno-fcis-collections",
    "zeno-fcis-profile-zenodex",
    "zeno-fcis-codegen",
    "zeno-fcis-bootstrap",
    "zeno-fcis-authority",
    "zeno-fcis-composed-program",
    "zeno-fcis-authenticated",
    "zeno-fcis-backend",
    "zeno-fcis-adapter",
    "zeno-fcis-shell-sqlite",
    "zeno-fcis-adapter-zenodex",
    "zeno-fcis",
]

private_packages = ["zeno-fcis-codegen-fixture"]

[[binaries]]
package = "zeno-fcis-adapter-zenodex"
target = "mount-zenodex-zusd"
purpose = "bounded diagnostic parity runner for the pinned ZenoDEX zUSD mount"
