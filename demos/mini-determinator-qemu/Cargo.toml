[package]
name = "zeno-fcis-mini-determinator-qemu"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]
members = ["kernel"]
resolver = "3"

[build-dependencies]
bootloader = { version = "=0.11.17", default-features = false, features = ["uefi"] }
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
