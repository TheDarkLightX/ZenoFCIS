[package]
name = "zeno-fcis-formal-tools"
description = "Deterministic CVC5, Z3, and Lean exporters and fail-closed process adapters for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeno-fcis-backend = { version = "=1.0.0-rc.3", path = "../zeno-fcis-backend" }
zeno-fcis-codec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-codec" }
zeno-fcis-crypto = { version = "=1.0.0-rc.3", path = "../zeno-fcis-crypto", features = ["rustcrypto"] }
zeno-fcis-spec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-spec" }

[lints]
workspace = true
