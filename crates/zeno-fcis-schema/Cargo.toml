[package]
name = "zeno-fcis-schema"
description = "Closed, canonical protocol schemas for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
# Explicit schema2/Value2 namespace; legacy/default routes remain closed.
schema-profile-2 = ["zeno-fcis-codec/value-profile-2", "zeno-fcis-value/value-profile-2"]
std = ["zeno-fcis-codec/std", "zeno-fcis-value/std"]

[dependencies]
zeno-fcis-codec = { version = "=2.7.0-rc.1", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-value = { version = "=2.7.0-rc.1", path = "../zeno-fcis-value", default-features = false }

[lints]
workspace = true
