[package]
name = "zeno-fcis-backend"
description = "Project-neutral checked backend protocol for synthesis, proof, refinement, and transformation engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-codec/std",
    "zeno-fcis-crypto/std",
    "zeno-fcis-project/std",
]

[dependencies]
zeno-fcis-codec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-crypto = { version = "=1.0.0-rc.3", path = "../zeno-fcis-crypto", default-features = false, features = ["rustcrypto"] }
zeno-fcis-project = { version = "=1.0.0-rc.3", path = "../zeno-fcis-project", default-features = false }
zeno-fcis-synthesis = { version = "=1.0.0-rc.3", path = "../zeno-fcis-synthesis" }
zeno-fcis-value = { version = "=1.0.0-rc.3", path = "../zeno-fcis-value", default-features = false }

[lints]
workspace = true
