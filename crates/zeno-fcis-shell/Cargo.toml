[package]
name = "zeno-fcis-shell"
description = "Pure atomic-commit and outbox reference semantics for ZenoFCIS shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-codec/std",
    "zeno-fcis-patch/std",
    "zeno-fcis-plan/std",
    "zeno-fcis-receipt/std",
    "zeno-fcis-value/std",
]

[dependencies]
zeno-fcis-codec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-patch = { version = "=1.0.0-rc.3", path = "../zeno-fcis-patch", default-features = false }
zeno-fcis-plan = { version = "=1.0.0-rc.3", path = "../zeno-fcis-plan", default-features = false }
zeno-fcis-receipt = { version = "=1.0.0-rc.3", path = "../zeno-fcis-receipt", default-features = false }
zeno-fcis-value = { version = "=1.0.0-rc.3", path = "../zeno-fcis-value", default-features = false }

[dev-dependencies]
zeno-fcis-core = { version = "=1.0.0-rc.3", path = "../zeno-fcis-core" }

[lints]
workspace = true
