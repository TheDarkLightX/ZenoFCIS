[package]
name = "zeno-fcis-collections"
description = "Persistent collection adapters for ZenoFCIS with logical-entry-defined equality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = []
# Enable the rpds persistent hash map.
rpds-backend = ["dep:rpds"]
# Enable the ordered map with thread-safe, shared snapshots.
ordered-map = ["dep:rpds"]
# Compatibility feature; the implementation now uses the pinned rpds crate.
imbl-backend = ["ordered-map"]

[dependencies]
zeno-fcis-codec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-codec" }
zeno-fcis-value = { version = "=1.0.0-rc.3", path = "../zeno-fcis-value" }

# Optional persistent collection backends.
# Pinned exactly per ZenoFCIS dependency policy.
# rpds 1.1.0: MIT/Apache-2.0; used for both optional map implementations.
rpds = { version = "=1.1.0", optional = true }

[dev-dependencies]
criterion = "=0.5.1"

[[bench]]
name = "persistent_map"
harness = false

[lints]
workspace = true
