[package]
name = "zeno-fcis-adapter-zenodex"
description = "Mounted ZenoDEX profiles built on the project-neutral ZenoFCIS runtime adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
zeno-fcis-adapter = { version = "=2.2.0-rc.1", path = "../zeno-fcis-adapter" }
zeno-fcis-codec = { version = "=2.2.0-rc.1", path = "../zeno-fcis-codec" }
zeno-fcis-core = { version = "=2.2.0-rc.1", path = "../zeno-fcis-core" }
zeno-fcis-crypto = { version = "=2.2.0-rc.1", path = "../zeno-fcis-crypto", default-features = false, features = ["rustcrypto"] }
zeno-fcis-patch = { version = "=2.2.0-rc.1", path = "../zeno-fcis-patch" }
zeno-fcis-plan = { version = "=2.2.0-rc.1", path = "../zeno-fcis-plan" }
zeno-fcis-profile-zenodex = { version = "=2.2.0-rc.1", path = "../zeno-fcis-profile-zenodex" }
zeno-fcis-receipt = { version = "=2.2.0-rc.1", path = "../zeno-fcis-receipt" }
zeno-fcis-refine = { version = "=2.2.0-rc.1", path = "../zeno-fcis-refine" }
zeno-fcis-value = { version = "=2.2.0-rc.1", path = "../zeno-fcis-value" }

[lints]
workspace = true
