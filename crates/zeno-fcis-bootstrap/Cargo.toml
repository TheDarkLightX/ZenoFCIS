[package]
name = "zeno-fcis-bootstrap"
description = "Deterministic project starter generation from ZenoFCIS catalogs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
zeno-fcis-catalog = { version = "=2.2.0-rc.1", path = "../zeno-fcis-catalog" }
zeno-fcis-codec = { version = "=2.2.0-rc.1", path = "../zeno-fcis-codec" }
zeno-fcis-codegen = { version = "=2.2.0-rc.1", path = "../zeno-fcis-codegen" }
zeno-fcis-project = { version = "=2.2.0-rc.1", path = "../zeno-fcis-project" }
zeno-fcis-schema = { version = "=2.2.0-rc.1", path = "../zeno-fcis-schema" }
zeno-fcis-spec = { version = "=2.2.0-rc.1", path = "../zeno-fcis-spec" }

[dev-dependencies]
zeno-fcis-codec = { version = "=2.2.0-rc.1", path = "../zeno-fcis-codec", features = ["libcrux"] }

[lints]
workspace = true
