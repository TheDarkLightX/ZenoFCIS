[package]
name = "zeno-fcis-refine"
description = "Exact runtime-to-model refinement and proof-assisted promotion evidence for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std", "rustcrypto"]
std = [
    "zeno-fcis-codec/std",
    "zeno-fcis-core/std",
    "zeno-fcis-crypto/std",
    "zeno-fcis-patch/std",
    "zeno-fcis-receipt/std",
    "zeno-fcis-value/std",
]
rustcrypto = ["zeno-fcis-crypto/rustcrypto"]
libcrux = ["zeno-fcis-crypto/libcrux"]

[dependencies]
zeno-fcis-codec = { version = "=1.0.0-rc.1", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-core = { version = "=1.0.0-rc.1", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-crypto = { version = "=1.0.0-rc.1", path = "../zeno-fcis-crypto", default-features = false }
zeno-fcis-patch = { version = "=1.0.0-rc.1", path = "../zeno-fcis-patch", default-features = false }
zeno-fcis-receipt = { version = "=1.0.0-rc.1", path = "../zeno-fcis-receipt", default-features = false }
zeno-fcis-value = { version = "=1.0.0-rc.1", path = "../zeno-fcis-value", default-features = false }

[dev-dependencies]
zeno-fcis-plan = { version = "=1.0.0-rc.1", path = "../zeno-fcis-plan", default-features = false }

[lints]
workspace = true
