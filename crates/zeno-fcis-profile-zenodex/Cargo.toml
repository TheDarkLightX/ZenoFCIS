[package]
name = "zeno-fcis-profile-zenodex"
description = "ZenoDEX FCIS profile descriptors, zUSD state schema, and stable reason registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-codec/std",
    "zeno-fcis-core/std",
    "zeno-fcis-refine/std",
    "zeno-fcis-value/std",
]

[dependencies]
zeno-fcis-codec = { version = "=1.0.0-rc.2", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-core = { version = "=1.0.0-rc.2", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-refine = { version = "=1.0.0-rc.2", path = "../zeno-fcis-refine", default-features = false }
zeno-fcis-value = { version = "=1.0.0-rc.2", path = "../zeno-fcis-value", default-features = false }

[lints]
workspace = true
