[package]
name = "zeno-fcis-crypto"
description = "Vetted cryptographic commitment providers for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["rustcrypto"]
std = []
rustcrypto = ["zeno-fcis-codec/rustcrypto"]
libcrux = ["zeno-fcis-codec/libcrux"]
parity = ["rustcrypto", "libcrux"]

[dependencies]
zeno-fcis-codec = { version = "=2.2.0-rc.1", path = "../zeno-fcis-codec", default-features = false }

[dev-dependencies]
criterion = "=0.5.1"

[[bench]]
name = "commitment"
harness = false
required-features = ["parity"]

[lints]
workspace = true
