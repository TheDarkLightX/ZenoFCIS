[package]
name = "zeno-fcis-catalog"
description = "Schema-bound reason, effect, and channel catalogs for ZenoFCIS project profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-codec/std",
    "zeno-fcis-core/std",
    "zeno-fcis-plan/std",
    "zeno-fcis-project/std",
    "zeno-fcis-schema/std",
    "zeno-fcis-value/std",
]

[dependencies]
zeno-fcis-codec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-core = { version = "=1.0.0-rc.3", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-plan = { version = "=1.0.0-rc.3", path = "../zeno-fcis-plan", default-features = false }
zeno-fcis-project = { version = "=1.0.0-rc.3", path = "../zeno-fcis-project", default-features = false }
zeno-fcis-schema = { version = "=1.0.0-rc.3", path = "../zeno-fcis-schema", default-features = false }
zeno-fcis-value = { version = "=1.0.0-rc.3", path = "../zeno-fcis-value", default-features = false }

[lints]
workspace = true
