[package]
name = "zeno-fcis-authenticated-authority"
description = "Candidate-bound projector qualification and authenticated-state publication for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["rustcrypto"]
rustcrypto = ["zeno-fcis-authority/rustcrypto", "zeno-fcis-crypto/rustcrypto"]
libcrux = ["zeno-fcis-authority/libcrux", "zeno-fcis-crypto/libcrux"]

[dependencies]
zeno-fcis-authenticated = { version = "=1.0.0-rc.2", path = "../zeno-fcis-authenticated" }
zeno-fcis-authority = { version = "=1.0.0-rc.2", path = "../zeno-fcis-authority", default-features = false, features = ["std"] }
zeno-fcis-codec = { version = "=1.0.0-rc.2", path = "../zeno-fcis-codec" }
zeno-fcis-crypto = { version = "=1.0.0-rc.2", path = "../zeno-fcis-crypto", default-features = false }
zeno-fcis-laws = { version = "=1.0.0-rc.2", path = "../zeno-fcis-laws" }
zeno-fcis-patch = { version = "=1.0.0-rc.2", path = "../zeno-fcis-patch" }
zeno-fcis-receipt = { version = "=1.0.0-rc.2", path = "../zeno-fcis-receipt" }
zeno-fcis-value = { version = "=1.0.0-rc.2", path = "../zeno-fcis-value" }

[lints]
workspace = true
