[package]
name = "zeno-fcis-cli"
description = "Deterministic zeno-fcis authoring and formal-tool command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "zeno-fcis"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "=4.6.1", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json = "=1.0.151"
zeno-fcis-codec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-codec" }
zeno-fcis-crypto = { version = "=1.0.0-rc.3", path = "../zeno-fcis-crypto", features = ["rustcrypto"] }
zeno-fcis-formal-tools = { version = "=1.0.0-rc.3", path = "../zeno-fcis-formal-tools" }
zeno-fcis-spec = { version = "=1.0.0-rc.3", path = "../zeno-fcis-spec" }

[lints]
workspace = true
