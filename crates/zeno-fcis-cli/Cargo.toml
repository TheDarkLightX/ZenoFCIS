[package]
name = "zeno-fcis-cli"
description = "Deterministic zeno-fcis authoring and formal-tool command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "zeno-fcis"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "=4.6.1", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
zeno-fcis-synthesis = { version = "=2.4.0", path = "../zeno-fcis-synthesis" }
zeno-fcis-codec = { version = "=2.4.0", path = "../zeno-fcis-codec" }
zeno-fcis-contract = { version = "=2.4.0", path = "../zeno-fcis-contract" }
zeno-fcis-crypto = { version = "=2.4.0", path = "../zeno-fcis-crypto", features = ["rustcrypto"] }
zeno-fcis-formal-tools = { version = "=2.4.0", path = "../zeno-fcis-formal-tools" }
zeno-fcis-spec = { version = "=2.4.0", path = "../zeno-fcis-spec" }
zeno-fcis-shell-sqlite = { version = "=2.4.0", path = "../zeno-fcis-shell-sqlite" }
zeno-fcis-loop-doors = { version = "=2.4.0", path = "../zeno-fcis-loop-doors" }
zeno-fcis-program-search = { version = "=2.4.0", path = "../zeno-fcis-program-search" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["process", "signal", "resource", "user"] }

[lints]
workspace = true
