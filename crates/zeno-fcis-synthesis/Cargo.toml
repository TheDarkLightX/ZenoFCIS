[package]
name = "zeno-fcis-synthesis"
description = "Deterministic verifier-gated bounded synthesis for ZenoFCIS schemas and contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-core/std",
    "zeno-fcis-codec/std",
    "zeno-fcis-crypto/std",
    "zeno-fcis-value/std",
]

[dependencies]
zeno-fcis-core = { version = "=2.2.0-rc.1", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-codec = { version = "=2.2.0-rc.1", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-crypto = { version = "=2.2.0-rc.1", path = "../zeno-fcis-crypto", default-features = false, features = ["rustcrypto"] }
zeno-fcis-value = { version = "=2.2.0-rc.1", path = "../zeno-fcis-value", default-features = false }

[lints]
workspace = true
