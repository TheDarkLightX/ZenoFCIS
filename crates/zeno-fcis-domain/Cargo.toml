[package]
name = "zeno-fcis-domain"
description = "Fixed-size executable domain machines and explicit global composition for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-codec/std",
    "zeno-fcis-compose/std",
    "zeno-fcis-core/std",
    "zeno-fcis-project/std",
    "zeno-fcis-schema/std",
]

[dependencies]
zeno-fcis-codec = { version = "=0.1.0", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-compose = { version = "=0.1.0", path = "../zeno-fcis-compose", default-features = false }
zeno-fcis-core = { version = "=0.1.0", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-project = { version = "=0.1.0", path = "../zeno-fcis-project", default-features = false }
zeno-fcis-schema = { version = "=0.1.0", path = "../zeno-fcis-schema", default-features = false }

[dev-dependencies]
zeno-fcis-value = { version = "=0.1.0", path = "../zeno-fcis-value" }

[lints]
workspace = true
