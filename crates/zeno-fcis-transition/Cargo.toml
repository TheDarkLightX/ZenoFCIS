[package]
name = "zeno-fcis-transition"
description = "Catalog-aware pure transition construction and candidate sealing for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-catalog/std",
    "zeno-fcis-codec/std",
    "zeno-fcis-compose/std",
    "zeno-fcis-core/std",
    "zeno-fcis-patch/std",
    "zeno-fcis-plan/std",
    "zeno-fcis-project/std",
    "zeno-fcis-receipt/std",
    "zeno-fcis-schema/std",
    "zeno-fcis-value/std",
]

[dependencies]
zeno-fcis-catalog = { version = "=0.1.0", path = "../zeno-fcis-catalog", default-features = false }
zeno-fcis-codec = { version = "=0.1.0", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-compose = { version = "=0.1.0", path = "../zeno-fcis-compose", default-features = false }
zeno-fcis-core = { version = "=0.1.0", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-patch = { version = "=0.1.0", path = "../zeno-fcis-patch", default-features = false }
zeno-fcis-plan = { version = "=0.1.0", path = "../zeno-fcis-plan", default-features = false }
zeno-fcis-project = { version = "=0.1.0", path = "../zeno-fcis-project", default-features = false }
zeno-fcis-receipt = { version = "=0.1.0", path = "../zeno-fcis-receipt", default-features = false }
zeno-fcis-schema = { version = "=0.1.0", path = "../zeno-fcis-schema", default-features = false }
zeno-fcis-value = { version = "=0.1.0", path = "../zeno-fcis-value", default-features = false }

[lints]
workspace = true
