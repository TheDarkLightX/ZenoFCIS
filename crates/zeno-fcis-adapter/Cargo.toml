[package]
name = "zeno-fcis-adapter"
description = "Project-neutral strict mounted-runtime adapter and replay boundary for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
zeno-fcis-codec = { version = "=0.1.0", path = "../zeno-fcis-codec" }
zeno-fcis-core = { version = "=0.1.0", path = "../zeno-fcis-core" }
zeno-fcis-crypto = { version = "=0.1.0", path = "../zeno-fcis-crypto", default-features = false, features = ["rustcrypto"] }
zeno-fcis-refine = { version = "=0.1.0", path = "../zeno-fcis-refine" }

[lints]
workspace = true
