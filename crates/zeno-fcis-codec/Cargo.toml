[package]
name = "zeno-fcis-codec"
description = "Canonical encoding and commitment-provider interfaces for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = ["zeno-fcis-value/std"]
rustcrypto = []
libcrux = ["dep:libcrux-sha2"]

[dependencies]
zeno-fcis-value = { version = "=2.3.0-rc.1", path = "../zeno-fcis-value", default-features = false }

sha2 = { version = "=0.11.0", default-features = false }
libcrux-sha2 = { version = "=0.0.8", default-features = false, optional = true }

[lints]
workspace = true
