[package]
name = "zeno-fcis"
description = "High-assurance functional-core / imperative-shell primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-core/std",
    "zeno-fcis-value/std",
    "zeno-fcis-codec/std",
]

[dependencies]
zeno-fcis-core = { path = "../zeno-fcis-core", default-features = false }
zeno-fcis-value = { path = "../zeno-fcis-value", default-features = false }
zeno-fcis-codec = { path = "../zeno-fcis-codec", default-features = false }

[lints]
workspace = true
