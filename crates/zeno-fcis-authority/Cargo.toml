[package]
name = "zeno-fcis-authority"
description = "Nominal catalog, invocation, provider, interpreter, and deployment authorization for ZenoFCIS commits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std", "rustcrypto"]
std = [
    "zeno-fcis-catalog/std",
    "zeno-fcis-codec/std",
    "zeno-fcis-core/std",
    "zeno-fcis-crypto/std",
    "zeno-fcis-patch/std",
    "zeno-fcis-project/std",
    "zeno-fcis-receipt/std",
    "zeno-fcis-schema/std",
    "zeno-fcis-shell/std",
    "zeno-fcis-transition/std",
]
rustcrypto = ["zeno-fcis-crypto/rustcrypto"]
libcrux = ["zeno-fcis-crypto/libcrux"]

[dependencies]
zeno-fcis-catalog = { version = "=0.1.0", path = "../zeno-fcis-catalog", default-features = false }
zeno-fcis-codec = { version = "=0.1.0", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-core = { version = "=0.1.0", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-crypto = { version = "=0.1.0", path = "../zeno-fcis-crypto", default-features = false }
zeno-fcis-patch = { version = "=0.1.0", path = "../zeno-fcis-patch", default-features = false }
zeno-fcis-project = { version = "=0.1.0", path = "../zeno-fcis-project", default-features = false }
zeno-fcis-receipt = { version = "=0.1.0", path = "../zeno-fcis-receipt", default-features = false }
zeno-fcis-schema = { version = "=0.1.0", path = "../zeno-fcis-schema", default-features = false }
zeno-fcis-shell = { version = "=0.1.0", path = "../zeno-fcis-shell", default-features = false }
zeno-fcis-transition = { version = "=0.1.0", path = "../zeno-fcis-transition", default-features = false }

[dev-dependencies]
zeno-fcis-value = { version = "=0.1.0", path = "../zeno-fcis-value" }

[lints]
workspace = true
