[package]
name = "zeno-fcis-receipt"
description = "Candidate sealing, receipts, and atomic commit bundles for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-core/std",
    "zeno-fcis-codec/std",
    "zeno-fcis-patch/std",
    "zeno-fcis-plan/std",
    "zeno-fcis-value/std",
]

[dependencies]
zeno-fcis-core = { path = "../zeno-fcis-core", default-features = false }
zeno-fcis-codec = { path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-patch = { path = "../zeno-fcis-patch", default-features = false }
zeno-fcis-plan = { path = "../zeno-fcis-plan", default-features = false }
zeno-fcis-value = { path = "../zeno-fcis-value", default-features = false }

[lints]
workspace = true
