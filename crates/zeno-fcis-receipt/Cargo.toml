[package]
name = "zeno-fcis-receipt"
description = "Candidate sealing, receipts, and atomic commit bundles for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = [
    "zeno-fcis-core/std",
    "zeno-fcis-codec/std",
    "zeno-fcis-patch/std",
    "zeno-fcis-plan/std",
    "zeno-fcis-value/std",
]

[dependencies]
zeno-fcis-core = { version = "=1.1.0", path = "../zeno-fcis-core", default-features = false }
zeno-fcis-codec = { version = "=1.1.0", path = "../zeno-fcis-codec", default-features = false }
zeno-fcis-patch = { version = "=1.1.0", path = "../zeno-fcis-patch", default-features = false }
zeno-fcis-plan = { version = "=1.1.0", path = "../zeno-fcis-plan", default-features = false }
zeno-fcis-value = { version = "=1.1.0", path = "../zeno-fcis-value", default-features = false }

[dev-dependencies]
zeno-fcis-crypto = { version = "=1.1.0", path = "../zeno-fcis-crypto", default-features = false, features = ["parity"] }
criterion = "=0.5.1"

[[bench]]
name = "validation"
harness = false

[lints]
workspace = true
