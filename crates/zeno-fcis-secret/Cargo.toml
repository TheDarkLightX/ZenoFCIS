[package]
name = "zeno-fcis-secret"
description = "Zeroizing and constant-time secret handling boundaries for ZenoFCIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["zeno-fcis-codec/std", "zeroize/std"]

[dependencies]
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
zeno-fcis-codec = { version = "=0.1.0", path = "../zeno-fcis-codec", default-features = false }

[lints]
workspace = true
