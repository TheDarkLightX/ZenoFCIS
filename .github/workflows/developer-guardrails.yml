name: developer-guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: developer-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-probity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Reject vulnerable locked development graphs
        run: npm audit --audit-level=high

      - name: Exercise hostile and permitted coding-agent actions
        run: python3 tools/check_probity.py
