    steps:
      - name: Checkout original candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 32a0960048741f6e6faab030fde14a5dbf3eae7a
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          test "$(git rev-parse HEAD)" = 32a0960048741f6e6faab030fde14a5dbf3eae7a
          test -z "$(git status --porcelain)"
      - name: Build original candidate and preserve privacy refusal
        run: python3 tools/rc_package.py build-host-binary --output "$RUNNER_TEMP/host"
      - name: Encrypt diagnostic archive and records
        if: failure()
        id: encrypt
        run: |
          set -euo pipefail
          umask 077
          test -f "$RUNNER_TEMP/host/HOST-BINARY.json"
          mkdir "$RUNNER_TEMP/encrypted-diagnostic"
          printf '%s\n' "$DIAGNOSTIC_CERTIFICATE" > "$RUNNER_TEMP/recipient.pem"
          crypto="$(brew --prefix openssl@3)/bin/openssl"
          "$crypto" version
          "$crypto" x509 -in "$RUNNER_TEMP/recipient.pem" -noout -fingerprint -sha256
          tar -czf "$RUNNER_TEMP/diagnostic.tar.gz" -C "$RUNNER_TEMP/host" binaries HOST-BINARY.json COMPILED-INPUTS-aarch64-apple-darwin.json
          "$crypto" cms -encrypt -aes-256-gcm -binary -in "$RUNNER_TEMP/diagnostic.tar.gz" -outform DER -out "$RUNNER_TEMP/encrypted-diagnostic/diagnostic.cms" -recip "$RUNNER_TEMP/recipient.pem" -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cipher=root/'encrypted-diagnostic/diagnostic.cms'
          record={'source_commit':'32a0960048741f6e6faab030fde14a5dbf3eae7a','ciphertext_sha256':hashlib.sha256(cipher.read_bytes()).hexdigest(),'recipient_certificate_sha256':hashlib.sha256(os.environ['DIAGNOSTIC_CERTIFICATE'].encode()).hexdigest(),'encryption':'CMS AuthEnvelopedData AES-256-GCM RSA-OAEP-SHA256','scope':'diagnostic reconstruction only; original privacy refusal preserved'}
          (root/'encrypted-diagnostic/DIAGNOSTIC.json').write_text(json.dumps(record,indent=2)+'\n')
          PYCODE
      - name: Upload encrypted diagnostic only
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release24-encrypted-mac-diagnostic
          path: |
            ${{ runner.temp }}/encrypted-diagnostic/diagnostic.cms
            ${{ runner.temp }}/encrypted-diagnostic/DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 2
