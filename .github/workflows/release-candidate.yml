name: release-candidate-mac-cleanup-diagnostic
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  macos-cleanup-diagnostic:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout original candidate
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: 32a0960048741f6e6faab030fde14a5dbf3eae7a
        persist-credentials: false
    - name: Install pinned Rust
      run: rustup toolchain install 1.97.1 --profile minimal
    - name: Apply source patch and typed diagnostic
      run: "git apply <<'PATCH'\nPATCH\npython3 - <<'PYCODE'\nfrom pathlib import Path\np=Path('crates/zeno-fcis-formal-tools/src/lib.rs')\n\
        s=p.read_text()\na='''        let waited = self.child.wait();\n        self.armed = false;'''\nb='''   \
        \     let waited = self.child.wait();\n        eprintln!(\"CLEANUP-DIAGNOSTIC group={:?} wait={:?} observed={}\"\
        , group_result, waited, observed_exit);\n        self.armed = false;'''\nif s.count(a)!=1:raise SystemExit('diagnostic\
        \ context changed')\np.write_text(s.replace(a,b))\nPYCODE\n"
    - name: Report actual group and wait result
      run: cargo +1.97.1 test --locked -p zeno-fcis-formal-tools --lib tests::cleanup_accepts_an_exit_before_the_first_status_observation
        -- --exact --nocapture
