name: release-candidate
'on':
  workflow_dispatch:
    inputs:
      include_macos:
        description: Assemble the reviewed Linux and natively qualified macOS artifacts at signed v2.7.0
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: zeno-fcis-release-recovery-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  release-set:
    name: Qualify reviewed Linux and native macOS release set
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_macos }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout unchanged signed release source
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: 4160086fb9d19f3ebe25047e69b1caa467aa74fd
        persist-credentials: false
    - name: Pin the signed source and load the separate recovery controller
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 4160086fb9d19f3ebe25047e69b1caa467aa74fd\ngit fetch\
        \ --no-tags --depth=1 origin refs/tags/v2.7.0:refs/tags/v2.7.0\ntest \"$(git rev-parse refs/tags/v2.7.0)\"\
        \ = 92f6cb07c7c920d7684be772507961602e29df15\ntest \"$(git rev-parse 'v2.7.0^{}')\" = 4160086fb9d19f3ebe25047e69b1caa467aa74fd\n\
        git fetch --no-tags --depth=1 origin \"$GITHUB_SHA\"\nmkdir \"$RUNNER_TEMP/recovery\"\nfor item in recover.py\
        \ privacy-allowlist.json MACOS-PRIVACY-REVIEW.json recipient.crt; do\n  git show \"$GITHUB_SHA:ci/release270/$item\"\
        \ > \"$RUNNER_TEMP/recovery/$item\"\ndone\ntest \"$(git rev-parse HEAD)\" = 4160086fb9d19f3ebe25047e69b1caa467aa74fd\n"
    - name: Establish contained checker runtime
      uses: ./.github/actions/checker-containment
    - name: Install pinned Rust for custody metadata
      run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
    - name: Fetch locked crate archives for compiled-input custody
      uses: ./.github/actions/fetch-locked-crates
    - name: Download the qualified Linux set at the release commit
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: zeno-fcis-release-set-4160086fb9d19f3ebe25047e69b1caa467aa74fd
        run-id: 41384803560
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/linux-qualified
    - name: Download the encrypted native macOS evidence
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: zeno-fcis-macos-review-encrypted-41393248258
        run-id: 41393248258
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/macos-capture
    - name: Verify native receipts, apply reviewed exact exceptions and require all eleven custody checks
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CAPTURE_DECRYPTION_KEY: ${{ secrets.ZENOFCIS_270_MACOS_CAPTURE_A5BBC573 }}
      run: python3 -B "$RUNNER_TEMP/recovery/recover.py" --linux "$RUNNER_TEMP/linux-qualified" --capture "$RUNNER_TEMP/macos-capture"
        --output "$RUNNER_TEMP/joined"
    - name: Upload the checked two-host release set
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: zeno-fcis-release-set-4160086fb9d19f3ebe25047e69b1caa467aa74fd
        path: '${{ runner.temp }}/joined/release

          ${{ runner.temp }}/joined/evidence'
        if-no-files-found: error
        retention-days: 30
    - name: Retain custody and privacy diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: zeno-fcis-release-recovery-records-${{ github.run_id }}
        path: ${{ runner.temp }}/joined/evidence/*.json
        if-no-files-found: warn
        retention-days: 30
