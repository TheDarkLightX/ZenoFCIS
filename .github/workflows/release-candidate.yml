name: release-candidate-mac-test-diagnostic
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  macos-test-diagnostic:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout original candidate
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: 32a0960048741f6e6faab030fde14a5dbf3eae7a
        persist-credentials: false
    - name: Install pinned Rust
      run: rustup toolchain install 1.97.1 --profile minimal
    - name: Improve test-only diagnostic
      run: "git apply <<'PATCH'\ndiff --git a/crates/zeno-fcis-formal-tools/src/lib.rs b/crates/zeno-fcis-formal-tools/src/lib.rs\n\
        index 4fdef09..0d4a0d9 100644\n--- a/crates/zeno-fcis-formal-tools/src/lib.rs\n+++ b/crates/zeno-fcis-formal-tools/src/lib.rs\n\
        @@ -4649,7 +4649,7 @@ mod tests {\n     }\n \n     #[test]\n-    #[cfg(unix)]\n+    #[cfg(target_os = \"\
        linux\")]\n     fn busy_executables_are_retried_briefly_then_fail_closed() {\n         use std::os::unix::fs::PermissionsExt\
        \ as _;\n \n@@ -5171,21 +5171,23 @@ mod tests {\n             ToolRunStatus::Failed(ToolFailure::Crash(Some(23)))\n\
        \         );\n \n-        assert!(matches!(\n-            run_fixed(\n-                &executable,\n- \
        \               &[\n-                    \"--ignored\",\n-                    \"--exact\",\n-          \
        \          \"tests::process_helper_output_limit\",\n-                    \"--nocapture\",\n-           \
        \     ],\n-                None,\n-                1_000,\n-                64,\n-            ),\n-    \
        \        Err(ToolFailure::OutputLimit)\n-        ));\n+        let overflow = run_fixed(\n+            &executable,\n\
        +            &[\n+                \"--ignored\",\n+                \"--exact\",\n+                \"tests::process_helper_output_limit\"\
        ,\n+                \"--nocapture\",\n+            ],\n+            None,\n+            1_000,\n+      \
        \      64,\n+        );\n+        assert!(\n+            matches!(&overflow, Err(ToolFailure::OutputLimit)),\n\
        +            \"unexpected output-limit result: {:?}\",\n+            overflow.map(|output| output.status)\n\
        +        );\n     }\n \n     #[test]\nPATCH\n"
    - name: Report typed output-limit failure
      run: cargo +1.97.1 test --locked -p zeno-fcis-formal-tools --lib tests::rc3_formal_fail_closed_and_model_replay
        -- --exact --nocapture
