name: release-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-review:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - uses: ./.github/actions/fetch-locked-crates
      - name: Build and scan the exact host executable
        continue-on-error: true
        run: python3 tools/rc_package.py build-host-binary --output "$RUNNER_TEMP/host"
      - name: Encrypt the unapproved artifact for local privacy review
        env:
          REVIEW_CERT: ${{ vars.ZENO_RELEASE_REVIEW_CERT }}
        run: |
          test -n "$REVIEW_CERT"
          printf '%s\n' "$REVIEW_CERT" > "$RUNNER_TEMP/recipient.crt"
          test -d "$RUNNER_TEMP/host/binaries"
          tar -czf "$RUNNER_TEMP/review.tar.gz" -C "$RUNNER_TEMP/host" .
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/review.tar.gz" -outform DER -out "$RUNNER_TEMP/macos-review.cms" -recip "$RUNNER_TEMP/recipient.crt" -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-macos-review
          path: ${{ runner.temp }}/macos-review.cms
          retention-days: 2
          if-no-files-found: error
