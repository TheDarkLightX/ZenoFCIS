name: tier1-cranelift-rust-wasm-idiom-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-cranelift-rust-idiom-28.yml"
      - "experiments/cranelift-tier1/idiom_saturating_add_28.rs"
      - "experiments/cranelift-tier1/qualify_rust_idiom_wasm_28.py"
      - "experiments/cranelift-tier1/independent_recheck_rust_idiom_28.py"
      - "experiments/cranelift-tier1/test_rust_idiom_28.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-cranelift-rust-wasm-idiom-28
  cancel-in-progress: true

jobs:
  source-pinned-rust-idiom-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout isolated research branch source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Exact source-pinned Wasmtime checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Install pinned Rust target and run reference controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          rustc --version
          python3 -B experiments/cranelift-tier1/test_rust_idiom_28.py -v
      - name: Build original and patched pinned Wasmtime compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-rust-results
          {
            echo "ZenoFCIS $(git rev-parse HEAD)"
            echo "Wasmtime $(git -C upstream rev-parse HEAD)"
            rustc --version
            cargo --version
            rustup target list --installed
            sha256sum experiments/cranelift-tier1/idiom_saturating_add_28.rs
            sha256sum experiments/cranelift-tier1/qualify_rust_idiom_wasm_28.py
            sha256sum experiments/cranelift-tier1/independent_recheck_rust_idiom_28.py
          } > tier1-rust-results/source-and-host.txt
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-rust-results/baseline-build.stdout \
            2> tier1-rust-results/baseline-build.stderr
          cp upstream/target/debug/wasmtime tier1-rust-results/wasmtime-baseline
          python3 -B experiments/cranelift-tier1/install_isle_candidate.py \
            --upstream upstream --out tier1-rust-results/patch-receipt.json
          git -C upstream diff -- cranelift/codegen/src/opts/selects.isle \
            > tier1-rust-results/one-rule.patch
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-rust-results/patched-build.stdout \
            2> tier1-rust-results/patched-build.stderr
          cp upstream/target/debug/wasmtime tier1-rust-results/wasmtime-patched
      - name: Compile real Rust-generated Wasm at two opt levels and both Cranelift compilers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_rust_idiom_wasm_28.py \
            --upstream upstream \
            --baseline-bin tier1-rust-results/wasmtime-baseline \
            --patched-bin tier1-rust-results/wasmtime-patched \
            --out tier1-rust-results/cases
      - name: Independently recheck exact Rust-generated Wasm and native object costs
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/independent_recheck_rust_idiom_28.py \
            --upstream upstream \
            --baseline-bin tier1-rust-results/wasmtime-baseline \
            --patched-bin tier1-rust-results/wasmtime-patched \
            --source-receipt tier1-rust-results/cases/qualification.json \
            --out tier1-rust-results/independent-recheck.json
      - name: Preserve original Rust/Wasm, actual native AOT, disassembly and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rust-idiom-real-wasm-aot-source-and-cost-28
          path: |
            tier1-rust-results/cases
            tier1-rust-results/independent-recheck.json
            tier1-rust-results/patch-receipt.json
            tier1-rust-results/one-rule.patch
            tier1-rust-results/source-and-host.txt
            tier1-rust-results/*.stdout
            tier1-rust-results/*.stderr
          retention-days: 30
          if-no-files-found: warn
