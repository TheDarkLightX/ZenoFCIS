name: sha256-provider-assemble

on:
  push:
    branches:
      - agent/sha256-providers-v1
    paths:
      - "crates/zeno-fcis-crypto/**"
      - "docs/SHA256_PROVIDER_POLICY.md"
      - ".github/workflows/sha256-provider-assemble.yml"

permissions:
  contents: write

concurrency:
  group: sha256-provider-assemble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/sha256-providers-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Integrate provider crate and permanent assurance workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("Cargo.toml")
          text = root.read_text(encoding="utf-8")
          marker = '    "crates/zeno-fcis-codec",\n'
          if '    "crates/zeno-fcis-crypto",\n' not in text:
              if marker not in text:
                  raise SystemExit("workspace codec member marker missing")
              text = text.replace(marker, marker + '    "crates/zeno-fcis-crypto",\n', 1)
          root.write_text(text, encoding="utf-8")

          cargo = Path("crates/zeno-fcis/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          if "rustcrypto-sha256" not in text:
              match = re.search(r'(std\s*=\s*\[.*?\n\])', text, re.S)
              if match is None:
                  raise SystemExit("umbrella std feature list missing")
              block = match.group(1)
              replacement = block[:-2] + '''    "zeno-fcis-crypto?/std",
]
rustcrypto-sha256 = ["dep:zeno-fcis-crypto", "zeno-fcis-crypto/rustcrypto"]
verified-sha256 = ["dep:zeno-fcis-crypto", "zeno-fcis-crypto/libcrux"]
sha256-parity = ["rustcrypto-sha256", "verified-sha256", "zeno-fcis-crypto/parity"]'''
              text = text.replace(block, replacement, 1)
              dependency = 'zeno-fcis-crypto = { path = "../zeno-fcis-crypto", default-features = false, optional = true }\n'
              if "[dependencies]\n" not in text:
                  raise SystemExit("umbrella dependency table missing")
              text = text.replace("[dependencies]\n", "[dependencies]\n" + dependency, 1)
          cargo.write_text(text, encoding="utf-8")

          lib = Path("crates/zeno-fcis/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          module_export = '''#[cfg(any(feature = "rustcrypto-sha256", feature = "verified-sha256"))]
/// Vetted SHA-256 providers and independent parity checks.
pub use zeno_fcis_crypto as crypto;
'''
          if "pub use zeno_fcis_crypto as crypto;" not in text:
              marker = "pub use zeno_fcis_codec as codec;\n"
              if marker not in text:
                  raise SystemExit("umbrella codec export missing")
              text = text.replace(marker, marker + module_export, 1)
              text += '''
#[cfg(any(feature = "rustcrypto-sha256", feature = "verified-sha256"))]
pub use zeno_fcis_crypto::{KnownAnswerReport, ProviderVerificationError, verify_known_answers};
#[cfg(feature = "rustcrypto-sha256")]
pub use zeno_fcis_crypto::RustCryptoSha256;
#[cfg(feature = "verified-sha256")]
pub use zeno_fcis_crypto::LibcruxSha256;
#[cfg(feature = "sha256-parity")]
pub use zeno_fcis_crypto::{ProviderParityReport, verify_provider_parity};
'''
          lib.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/sha256-providers.yml")
          workflow.write_text('''name: sha256-providers

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Provider feature matrix
        run: |
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features rustcrypto --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features libcrux --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features parity --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features rustcrypto-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features verified-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features sha256-parity --locked --target wasm32-unknown-unknown

      - name: Independent parity law suite
        run: cargo +1.97.1 test -p zeno-fcis-crypto --all-features --locked
''', encoding="utf-8")
          PY
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 fmt --all

      - name: Verify full workspace and provider matrix
        run: |
          cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-features --locked
          cargo +1.97.1 test --workspace --doc --all-features --locked
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features rustcrypto --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features libcrux --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features parity --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features rustcrypto-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features verified-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features sha256-parity --locked --target wasm32-unknown-unknown
          RUSTDOCFLAGS='-D warnings' cargo +1.97.1 doc --workspace --all-features --locked --no-deps

      - name: Commit formatted review surface and lockfile
        run: |
          git config user.name 'ZenoFCIS SHA-256 provider assembler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Cargo.toml \
            Cargo.lock \
            .github/workflows/sha256-providers.yml \
            crates/zeno-fcis-crypto \
            crates/zeno-fcis/Cargo.toml \
            crates/zeno-fcis/src/lib.rs \
            docs/SHA256_PROVIDER_POLICY.md
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'feat: add independently checked SHA-256 providers'
          git push origin HEAD:agent/sha256-providers-v1
