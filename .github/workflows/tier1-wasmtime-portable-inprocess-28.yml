name: tier1-wasmtime-portable-inprocess-28-source-pinned

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-wasmtime-portable-inprocess-28.yml"
      - "experiments/cranelift-tier1/qualify_wasmtime_portable_28.py"
      - "experiments/cranelift-tier1/qualify_wasmtime_portable_inprocess_28.py"
      - "experiments/cranelift-tier1/inprocess_bench_28/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-wasmtime-portable-inprocess-28
  cancel-in-progress: true

jobs:
  portable-target-runtime-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - name: Checkout isolated ZenoFCIS research revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Checkout detached exact upstream compiler
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Check pinned source and finite evaluator controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-portable-results
          test "$(git -C upstream rev-parse HEAD)" = b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          rustup toolchain install 1.97.1 --profile minimal
          python3 -B experiments/cranelift-tier1/test_qualify_wasmtime_frontend_28.py
          python3 -B experiments/cranelift-tier1/test_qualify_wasmtime_function_bytes_28.py
          python3 -B experiments/cranelift-tier1/test_qualify_wasmtime_inprocess_28.py
          {
            git rev-parse HEAD
            git -C upstream rev-parse HEAD
            rustc --version
            cargo --version
            uname -a
            lscpu
          } > tier1-portable-results/source-host-toolchain.txt
      - name: Compile baseline and one-rule-changed pinned Wasmtime CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-portable-results/baseline-build.stdout \
            2> tier1-portable-results/baseline-build.stderr
          cp upstream/target/debug/wasmtime tier1-portable-results/wasmtime-baseline
          python3 -B experiments/cranelift-tier1/install_isle_candidate.py \
            --upstream upstream \
            --out tier1-portable-results/patch-receipt.json
          git -C upstream diff -- cranelift/codegen/src/opts/selects.isle \
            > tier1-portable-results/one-rule.patch
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-portable-results/patched-build.stdout \
            2> tier1-portable-results/patched-build.stderr
          cp upstream/target/debug/wasmtime tier1-portable-results/wasmtime-patched
      - name: Produce independent portable x86-64 AOT and finite-oracle receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_wasmtime_portable_28.py \
            --upstream upstream \
            --baseline-bin tier1-portable-results/wasmtime-baseline \
            --patched-bin tier1-portable-results/wasmtime-patched \
            --out tier1-portable-results/wasm-check
      - name: Build Wasmtime runtime-only in-process harness from same source revision
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path experiments/cranelift-tier1/inprocess_bench_28/Cargo.toml
          cargo build --locked --release \
            --manifest-path experiments/cranelift-tier1/inprocess_bench_28/Cargo.toml \
            > tier1-portable-results/harness-build.stdout \
            2> tier1-portable-results/harness-build.stderr
          cp experiments/cranelift-tier1/inprocess_bench_28/Cargo.lock \
            tier1-portable-results/runtime-harness-Cargo.lock
      - name: Independently check arithmetic and record paired in-process timings
        shell: bash
        run: |
          set -euo pipefail
          bin=experiments/cranelift-tier1/inprocess_bench_28/target/release/tier1-wasmtime-inprocess-28
          "$bin" \
            tier1-portable-results/wasm-check/baseline/satadd.cwasm \
            tier1-portable-results/wasm-check/patched/satadd.cwasm \
            250000 6 16 > tier1-portable-results/runtime-raw.csv
          python3 -B experiments/cranelift-tier1/qualify_wasmtime_portable_inprocess_28.py \
            --source-root tier1-portable-results/wasm-check \
            --raw tier1-portable-results/runtime-raw.csv \
            --cargo-lock tier1-portable-results/runtime-harness-Cargo.lock \
            --loops 250000 --reps 6 --blocks 16 \
            --out tier1-portable-results/runtime-qualified.json
      - name: Archive exact emitted code, raw execution/cost evidence and build inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-wasmtime-portable-inprocess-28-qualified
          path: |
            tier1-portable-results/wasm-check
            tier1-portable-results/patch-receipt.json
            tier1-portable-results/one-rule.patch
            tier1-portable-results/source-host-toolchain.txt
            tier1-portable-results/*build.stdout
            tier1-portable-results/*build.stderr
            tier1-portable-results/runtime-harness-Cargo.lock
            tier1-portable-results/runtime-raw.csv
            tier1-portable-results/runtime-qualified.json
          retention-days: 30
          if-no-files-found: warn
