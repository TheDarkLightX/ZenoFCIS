name: tier1-rust-llvm-overflow-veriisle-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-rust-overflow-veriisle-28.yml"
      - "experiments/cranelift-tier1/verify_rust_overflow_veriisle_28.py"
      - "experiments/cranelift-tier1/install_rust_overflow_predicate_28.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-rust-llvm-overflow-veriisle-28
  cancel-in-progress: true

jobs:
  source-pinned-unmodified-spec-veriisle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - name: Checkout isolated research source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Checkout source-pinned unmodified upstream
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Install independent upstream verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cvc5 z3
          rustup toolchain install 1.97.1 --profile minimal
          mkdir -p tier1-overflow-veriisle
          {
            git rev-parse HEAD
            git -C upstream rev-parse HEAD
            cargo --version
            rustc --version
            cvc5 --version
            z3 --version
          } > tier1-overflow-veriisle/toolchain.txt
      - name: Apply only the named predicate rewrite; no locally supplied specification
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/install_rust_overflow_predicate_28.py \
            --upstream upstream --mode xorand \
            --out tier1-overflow-veriisle/source-receipt.json
          git -C upstream diff -- cranelift/codegen/src/opts/selects.isle \
            > tier1-overflow-veriisle/one-rule.patch
      - name: Run genuine named VeriISLE and classify all coverage/unknown outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/verify_rust_overflow_veriisle_28.py \
            --upstream upstream --out tier1-overflow-veriisle/qualification.json
      - name: Preserve raw compiler source identities and full verifier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rust-overflow-unchanged-veriisle-28
          path: tier1-overflow-veriisle
          retention-days: 30
          if-no-files-found: warn
