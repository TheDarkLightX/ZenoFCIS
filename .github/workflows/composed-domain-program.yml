name: composed-domain-program

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: composed-domain-program-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-program:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Lint retired compatibility and current authority surfaces
        run: cargo +1.97.1 clippy -p zeno-fcis-composed-program -p zeno-fcis-authority --all-targets --all-features --locked -- -D warnings

      - name: Provision the locked historical verification dependencies
        run: cargo +1.97.1 fetch --manifest-path verification/Cargo.toml --locked

      - name: Execute retained historical composition assertions
        run: python3 tools/atdd.py run --scenario composed-program

      - name: Test current checked authority admission and invocation
        run: python3 tools/atdd.py run --scenario production-authority

      - name: Check no_std compatibility surfaces
        run: |
          cargo +1.97.1 check -p zeno-fcis-composed-program --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features composed-program --locked --target wasm32-unknown-unknown

      - name: Build warning-free compatibility documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc -p zeno-fcis-composed-program --all-features --locked --no-deps
