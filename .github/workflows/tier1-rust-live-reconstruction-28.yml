name: tier1-rust-live-reconstruction-28
on:
  push:
    branches: [research/2.8-tier1-cranelift-performance-20261102]
    paths:
      - '.github/workflows/tier1-rust-live-reconstruction-28.yml'
      - 'experiments/cranelift-tier1/rust_live_reconstruction_28.rs'
      - 'experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-rust-live-reconstruction-28
  cancel-in-progress: true
jobs:
  rust-live-ssa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Pinned Rust and independent producer/auditor arithmetic controls
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          python3 -m py_compile experiments/cranelift-tier1/{qualify_rust_live_reconstruction_28,qualify_rust_divrem_28,recheck_rust_divrem_28,scan_divrem_clif_28}.py
          python3 -B experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py --self-test
          mkdir -p tier1-live-reconstruction
          git rev-parse HEAD >tier1-live-reconstruction/zenofcis-head.txt
          rustc --version >tier1-live-reconstruction/rustc.txt
          sha256sum experiments/cranelift-tier1/{rust_live_reconstruction_28.rs,qualify_rust_live_reconstruction_28.py} >tier1-live-reconstruction/source.sha256
      - name: Download pinned and previously qualified baseline/patched Wasmtime compilers
        uses: actions/download-artifact@v4
        with:
          repository: TheDarkLightX/ZenoFCIS
          run-id: 42951667233
          github-token: ${{ github.token }}
          name: tier1-udivrem-llvm-reconstruction-28
          path: tier1-live-reconstruction/source
      - name: Test identical optimized Rust-generated Wasm with both real native compilers
        run: |
          set -euo pipefail
          test -f tier1-live-reconstruction/source/tier1-reconstruction/compilers/qualification.json
          chmod u+x tier1-live-reconstruction/source/tier1-reconstruction/compilers/{baseline,patched}/wasmtime
          python3 -B experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py \
            --archive tier1-live-reconstruction/source/tier1-reconstruction/compilers \
            --out tier1-live-reconstruction/results | tee tier1-live-reconstruction/producer-summary.json
      - name: Independent file-hash cost and fresh-value executable recheck
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py \
            --archive tier1-live-reconstruction/source/tier1-reconstruction/compilers \
            --results tier1-live-reconstruction/results --recheck \
            | tee tier1-live-reconstruction/independent-recheck.json
      - name: Archive exact Rust Wasm CLIF AOT native disassembly and independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rust-live-reconstruction-28
          path: |
            tier1-live-reconstruction/zenofcis-head.txt
            tier1-live-reconstruction/rustc.txt
            tier1-live-reconstruction/source.sha256
            tier1-live-reconstruction/producer-summary.json
            tier1-live-reconstruction/independent-recheck.json
            tier1-live-reconstruction/results
            experiments/cranelift-tier1/rust_live_reconstruction_28.rs
            experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py
            experiments/cranelift-tier1/RUST_LIVE_RECONSTRUCTION_28.md
          if-no-files-found: warn
          retention-days: 30
