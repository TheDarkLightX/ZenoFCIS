name: tier1-wasmtime-alignment-boundary-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-wasmtime-alignment-boundary-28.yml"
      - "experiments/cranelift-tier1/qualify_wasmtime_alignment_boundary_28.py"
      - "experiments/cranelift-tier1/independent_recheck_alignment_boundary_28.py"
      - "experiments/cranelift-tier1/test_alignment_boundary_28.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-wasmtime-alignment-boundary-28
  cancel-in-progress: true

jobs:
  source-pinned-aot-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - name: Checkout isolated ZenoFCIS experiment
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Detached source-pinned Wasmtime/Cranelift
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Source controls and exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          rustup toolchain install 1.97.1 --profile minimal
          python3 -B experiments/cranelift-tier1/test_alignment_boundary_28.py
          python3 -B experiments/cranelift-tier1/test_qualify_wasmtime_scaling_28.py
      - name: Rebuild exact source-pinned baseline and one-rule patched compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-alignment-results
          {
            git rev-parse HEAD
            git -C upstream rev-parse HEAD
            rustc --version
            cargo --version
            uname -a
          } > tier1-alignment-results/source-and-host.txt
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-alignment-results/baseline-build.stdout \
            2> tier1-alignment-results/baseline-build.stderr
          cp upstream/target/debug/wasmtime tier1-alignment-results/wasmtime-baseline
          python3 -B experiments/cranelift-tier1/install_isle_candidate.py \
            --upstream upstream --out tier1-alignment-results/patch-receipt.json
          git -C upstream diff -- cranelift/codegen/src/opts/selects.isle \
            > tier1-alignment-results/one-rule.patch
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-alignment-results/patched-build.stdout \
            2> tier1-alignment-results/patched-build.stderr
          cp upstream/target/debug/wasmtime tier1-alignment-results/wasmtime-patched
      - name: Execute same-source per-variant finite checks and real AOT measurement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_wasmtime_alignment_boundary_28.py \
            --upstream upstream \
            --baseline-bin tier1-alignment-results/wasmtime-baseline \
            --patched-bin tier1-alignment-results/wasmtime-patched \
            --out tier1-alignment-results/cases
      - name: Independently audit every exact WAT, AOT ELF, byte count and claimed delta
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/independent_recheck_alignment_boundary_28.py \
            --source-receipt tier1-alignment-results/cases/qualification.json \
            --out tier1-alignment-results/independent-recheck.json
      - name: Archive real unmodified objects, generated WAT, logs and separate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-wasmtime-alignment-boundary-28-real-aot
          path: |
            tier1-alignment-results/cases
            tier1-alignment-results/independent-recheck.json
            tier1-alignment-results/patch-receipt.json
            tier1-alignment-results/one-rule.patch
            tier1-alignment-results/source-and-host.txt
            tier1-alignment-results/*.stdout
            tier1-alignment-results/*.stderr
          retention-days: 30
          if-no-files-found: warn
