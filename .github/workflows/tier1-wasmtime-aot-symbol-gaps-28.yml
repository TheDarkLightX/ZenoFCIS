name: tier1-wasmtime-aot-symbol-gaps-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-wasmtime-aot-symbol-gaps-28.yml"
      - "experiments/cranelift-tier1/qualify_aot_symbol_gaps_28.py"
      - "experiments/cranelift-tier1/test_qualify_aot_symbol_gaps_28.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tier1-wasmtime-aot-symbol-gaps-28
  cancel-in-progress: true

jobs:
  source-and-binary-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated ZenoFCIS research head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Checkout detached exact pinned Cranelift/Wasmtime source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Download existing qualified AOT binaries and finite-run receipts
        uses: actions/download-artifact@v4
        with:
          name: tier1-wasmtime-scaling-28-synthetic
          run-id: 41769602461
          github-token: ${{ github.token }}
          path: archived-aot
      - name: Run independent positive and refusal tests before consuming AOT binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/test_qualify_aot_symbol_gaps_28.py
          readelf --version
          git -C upstream rev-parse HEAD
      - name: Verify source alignment path and compare actual archived function symbol slots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-symbol-gap-results
          python3 -B experiments/cranelift-tier1/qualify_aot_symbol_gaps_28.py \
            --root archived-aot \
            --upstream upstream \
            --out tier1-symbol-gap-results/audit.json
          {
            git rev-parse HEAD
            git -C upstream rev-parse HEAD
            uname -a
          } > tier1-symbol-gap-results/pins.txt
          sha256sum tier1-symbol-gap-results/audit.json > tier1-symbol-gap-results/audit.sha256
      - name: Archive raw-result bound attribution without broad performance claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-wasmtime-aot-symbol-gaps-28
          path: tier1-symbol-gap-results
          retention-days: 30
          if-no-files-found: warn
