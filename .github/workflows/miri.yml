name: miri

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  interpret:
    name: interpret (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: values
            packages: -p zeno-fcis-core -p zeno-fcis-value -p zeno-fcis-codec -p zeno-fcis-secret
          - group: schemas
            packages: -p zeno-fcis-project -p zeno-fcis-catalog -p zeno-fcis-schema -p zeno-fcis-refine
          - group: plans
            packages: -p zeno-fcis-patch -p zeno-fcis-plan -p zeno-fcis-receipt -p zeno-fcis-security
          - group: publication
            packages: -p zeno-fcis-transition -p zeno-fcis-authority -p zeno-fcis-shell -p zeno-fcis-compose -p zeno-fcis-domain
          - group: synthesis
            packages: -p zeno-fcis-synthesis
          - group: specification
            packages: -p zeno-fcis-spec -p zeno-fcis-backend
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Miri toolchain
        run: |
          rustup toolchain install nightly-2026-07-21 --profile minimal --component miri
          cargo +nightly-2026-07-21 miri setup

      - name: Interpret semantic boundary tests
        run: cargo +nightly-2026-07-21 miri test --locked ${{ matrix.packages }}

  semantic-core:
    name: semantic-core
    needs: interpret
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Miri group to pass
        env:
          INTERPRET_RESULT: ${{ needs.interpret.result }}
        run: test "$INTERPRET_RESULT" = success
