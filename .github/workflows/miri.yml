name: miri

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  semantic-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Miri toolchain
        run: |
          rustup toolchain install nightly-2026-07-21 --profile minimal --component miri
          cargo +nightly-2026-07-21 miri setup

      - name: Interpret semantic boundary tests
        run: |
          cargo +nightly-2026-07-21 miri test --locked \
            -p zeno-fcis-core -p zeno-fcis-value -p zeno-fcis-codec \
            -p zeno-fcis-project -p zeno-fcis-catalog \
            -p zeno-fcis-transition -p zeno-fcis-authority \
            -p zeno-fcis-security -p zeno-fcis-secret \
            -p zeno-fcis-patch -p zeno-fcis-plan -p zeno-fcis-receipt \
            -p zeno-fcis-shell -p zeno-fcis-compose -p zeno-fcis-refine \
            -p zeno-fcis-schema -p zeno-fcis-synthesis -p zeno-fcis-backend
