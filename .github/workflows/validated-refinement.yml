name: validated-refinement

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: zeno-fcis-validated-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validated-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Compile strict refinement boundary
        run: |
          cargo +1.97.1 clippy \
            -p zeno-fcis-refine \
            -p zeno-fcis-adapter \
            -p zeno-fcis-adapter-zenodex \
            -p zeno-fcis \
            --all-targets --all-features --locked -- -D warnings

      - name: Reconstruction, manifest, coverage, and report laws
        run: |
          cargo +1.97.1 test \
            -p zeno-fcis-refine \
            -p zeno-fcis-adapter \
            -p zeno-fcis-adapter-zenodex \
            --all-features --locked
          cargo +1.97.1 test \
            -p zeno-fcis-refine \
            -p zeno-fcis-adapter \
            -p zeno-fcis-adapter-zenodex \
            --doc --all-features --locked

      - name: no_std validated refinement
        run: |
          cargo +1.97.1 check \
            -p zeno-fcis-refine \
            --no-default-features --features rustcrypto --locked \
            --target wasm32-unknown-unknown
          cargo +1.97.1 check \
            -p zeno-fcis-refine \
            --no-default-features --features libcrux --locked \
            --target wasm32-unknown-unknown
          cargo +1.97.1 check \
            -p zeno-fcis \
            --no-default-features --features rustcrypto-sha256 --locked \
            --target wasm32-unknown-unknown

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.97.1 doc \
            -p zeno-fcis-refine \
            -p zeno-fcis-adapter \
            -p zeno-fcis-adapter-zenodex \
            -p zeno-fcis \
            --all-features --locked --no-deps

      - name: Static authority-boundary checks
        run: python3 tools/check_assurance.py
