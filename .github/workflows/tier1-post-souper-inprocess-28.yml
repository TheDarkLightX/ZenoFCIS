name: tier1-post-souper-inprocess-28
on:
  push:
    branches: [research/2.8-tier1-cranelift-performance-20261102]
    paths:
      - '.github/workflows/tier1-post-souper-inprocess-28.yml'
      - 'experiments/cranelift-tier1/inprocess_post_souper_28/**'
      - 'experiments/cranelift-tier1/audit_post_souper_inprocess_28.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-post-souper-inprocess-28
  cancel-in-progress: true
jobs:
  pinned-same-aot-inprocess:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: 8b19f199f89da864c529b3fa3ca2f7e40d5de609
          path: upstream
          persist-credentials: false
      - name: Fetch exactly the independently qualified post-Souper AOT producer artifacts
        uses: actions/download-artifact@v4
        with:
          repository: TheDarkLightX/ZenoFCIS
          run-id: 44056104464
          github-token: ${{ github.token }}
          name: tier1-post-souper-divrem-28
          path: tier1-post-souper-inprocess/source
      - name: Fail closed on source pins, SHA-256, identical WAT, and four AOT images before deserialization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 8b19f199f89da864c529b3fa3ca2f7e40d5de609
          test "$(uname -m)" = x86_64
          mkdir -p tier1-post-souper-inprocess/output
          python3 -m py_compile experiments/cranelift-tier1/audit_post_souper_inprocess_28.py
          python3 -B experiments/cranelift-tier1/audit_post_souper_inprocess_28.py --self-test
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'experiments/cranelift-tier1')
          from audit_post_souper_inprocess_28 import producer
          doc = producer(Path('tier1-post-souper-inprocess/source'))
          print('original AOTs and compiler source independently hash-bound:', doc['source_pin'])
          PY
      - name: Build same-upstream Wasmtime runtime, without recompiling archived AOT images
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          cargo generate-lockfile --manifest-path experiments/cranelift-tier1/inprocess_post_souper_28/Cargo.toml
          cargo build --locked --release --manifest-path experiments/cranelift-tier1/inprocess_post_souper_28/Cargo.toml >tier1-post-souper-inprocess/output/build.stdout 2>tier1-post-souper-inprocess/output/build.stderr
          cp experiments/cranelift-tier1/inprocess_post_souper_28/Cargo.lock tier1-post-souper-inprocess/output/Cargo.lock
          { git rev-parse HEAD; git -C upstream rev-parse HEAD; rustc --version; cargo --version; uname -a; lscpu; } >tier1-post-souper-inprocess/output/host-tools.txt
      - name: Balanced ABBA/BAAB in-process SAME-AOT runtime experiment and independent replay
        shell: bash
        run: |
          set -euo pipefail
          dir=tier1-post-souper-inprocess
          src="$dir/source/runtime-screen"
          bin=experiments/cranelift-tier1/inprocess_post_souper_28/target/release/tier1-udivrem-post-souper-inprocess-28
          "$bin" "$src/pair-baseline.cwasm" "$src/pair-patched.cwasm" "$src/quotient_control-baseline.cwasm" "$src/quotient_control-patched.cwasm" 5000000 6 > "$dir/output/raw.csv"
          python3 -B experiments/cranelift-tier1/audit_post_souper_inprocess_28.py --source-root "$dir/source" --raw "$dir/output/raw.csv" --lock "$dir/output/Cargo.lock" --iterations 5000000 --cycles 6 --out "$dir/output/qualified.json"
      - name: Preserve original artifact pins, raw transcript, validation and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-post-souper-inprocess-28
          path: tier1-post-souper-inprocess/output/
          retention-days: 30
          if-no-files-found: warn
