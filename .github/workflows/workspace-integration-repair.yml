name: workspace-integration-repair

on:
  push:
    branches:
      - agent/workspace-integration-repair-v1
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/zeno-fcis/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ecosystem-features.yml"
      - ".github/workflows/workspace-integration-repair.yml"
  pull_request:
    branches:
      - agent/schema-codegen-v1
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/zeno-fcis/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ecosystem-features.yml"
      - ".github/workflows/workspace-integration-repair.yml"

permissions:
  contents: write

concurrency:
  group: workspace-integration-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/workspace-integration-repair-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Generate lockfile and normalize source
        run: |
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 fmt --all

      - name: Verify integrated workspace
        run: |
          cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-features --locked
          cargo +1.97.1 test --workspace --doc --all-features --locked
          for crate in \
            zeno-fcis-core \
            zeno-fcis-value \
            zeno-fcis-codec \
            zeno-fcis-crypto \
            zeno-fcis-patch \
            zeno-fcis-plan \
            zeno-fcis-receipt \
            zeno-fcis-shell \
            zeno-fcis-compose \
            zeno-fcis-refine \
            zeno-fcis-profile-zenodex \
            zeno-fcis-schema \
            zeno-fcis
          do
            cargo +1.97.1 check -p "${crate}" --no-default-features --locked --target wasm32-unknown-unknown
          done
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features rustcrypto --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features libcrux --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features parity --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features schema --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --features codegen --locked
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features rustcrypto-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features verified-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features sha256-parity --locked --target wasm32-unknown-unknown
          RUSTDOCFLAGS='-D warnings' cargo +1.97.1 doc --workspace --all-features --locked --no-deps

      - name: Commit exact integrated review surface
        run: |
          git config user.name 'ZenoFCIS workspace integration repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Cargo.toml \
            Cargo.lock \
            crates/zeno-fcis/Cargo.toml \
            crates/zeno-fcis/src/lib.rs \
            .github/workflows/ci.yml \
            .github/workflows/ecosystem-features.yml
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'fix: integrate crypto schema and codegen workspace layers'
          git push origin HEAD:agent/workspace-integration-repair-v1
