name: agent-generate-onchain-fixtures

on:
  push:
    branches:
      - agent/onchain-assurance-fixtures-20260727

permissions:
  contents: write

concurrency:
  group: agent-generate-onchain-fixtures
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
          ref: agent/onchain-assurance-fixtures-20260727
          show-progress: false

      - name: Upgrade compiler pin and repair fixture types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "crates/zeno-fcis-codegen/src/solidity.rs": [
                  ('pub const SOLIDITY_PRAGMA: &str = "0.8.35";', 'pub const SOLIDITY_PRAGMA: &str = "0.8.36";'),
              ],
              "crates/zeno-fcis-codegen/src/solidity_advanced.rs": [
                  ('pub const SOLIDITY_PINNED_VERSION: &str = "0.8.35";', 'pub const SOLIDITY_PINNED_VERSION: &str = "0.8.36";'),
              ],
              "docs/ONCHAIN_FCIS_GENERATION.md": [
                  ('Solidity `0.8.35`', 'Solidity `0.8.36`'),
              ],
              "crates/zeno-fcis-codegen-fixture/src/bin/generate_onchain_fixtures.rs": [
                  ('fn retained_fixture_readme(machine_hash: zeno_fcis_codegen::Hash32)', 'fn retained_fixture_readme(machine_hash: zeno_fcis_codec::Hash32)'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"{filename}: expected one occurrence of {old!r}, found {text.count(old)}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          for filename in ["docs/SOLIDITY_FCIS.md", "README.md"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8").replace("0.8.35", "0.8.36")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +1.97.1 fmt --all

      - name: Generate exact fixtures
        run: |
          cargo +1.97.1 run \
            -p zeno-fcis-codegen-fixture \
            --bin generate_onchain_fixtures \
            --locked -- \
            fixtures/onchain-generated

      - name: Remove temporary generation workflow
        run: rm .github/workflows/agent-generate-onchain-fixtures.yml

      - name: Commit retained fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retain generated onchain assurance fixtures"
          git pull --rebase origin agent/onchain-assurance-fixtures-20260727
          git push origin HEAD:agent/onchain-assurance-fixtures-20260727
