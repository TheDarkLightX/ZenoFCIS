name: universal-backend-assemble

on:
  pull_request:
    branches:
      - agent/universal-project-runtime-v1

permissions:
  contents: write

concurrency:
  group: universal-backend-assemble-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout backend branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/universal-backend-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact mounted ZenoDEX revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: TheDarkLightX/ZenoDEX
          ref: e3cf1aad40e487893230ae0c55f1f0dda62f9955
          path: integration/zenodex
          persist-credentials: false

      - name: Install pinned current stable Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Apply deterministic hardening and normalize source
        run: |
          python internal/universal-backend-hardening.py
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 fmt --all

      - name: Capture ZenoFCIS verification diagnostics
        shell: bash
        run: |
          set +e
          ROOT=internal/universal-backend-diagnostics
          mkdir -p "${ROOT}"
          status=0
          run_check() {
            name="$1"
            shift
            "$@" > "${ROOT}/${name}.log" 2>&1
            code=$?
            printf '%s\n' "${code}" > "${ROOT}/${name}.status"
            if test "${code}" -ne 0 && test "${status}" -eq 0; then
              status="${code}"
            fi
          }
          run_check clippy cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          run_check tests cargo +1.97.1 test --workspace --all-features --locked
          run_check doctests cargo +1.97.1 test --workspace --doc --all-features --locked
          run_check synthesis-no-std cargo +1.97.1 check -p zeno-fcis-synthesis --no-default-features --locked --target wasm32-unknown-unknown
          run_check backend-no-std cargo +1.97.1 check -p zeno-fcis-backend --no-default-features --locked --target wasm32-unknown-unknown
          run_check umbrella-backend-no-std cargo +1.97.1 check -p zeno-fcis --no-default-features --features backend --locked --target wasm32-unknown-unknown
          run_check rustdoc env RUSTDOCFLAGS=-Dwarnings cargo +1.97.1 doc --workspace --all-features --locked --no-deps
          printf '%s\n' "${status}" > "${ROOT}/status.txt"
          exit 0

      - name: Upload ZenoFCIS diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-backend-diagnostics
          path: internal/universal-backend-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Enforce ZenoFCIS verification result
        run: test "$(cat internal/universal-backend-diagnostics/status.txt)" = "0"

      - name: Verify exact mounted ZenoDEX workspace
        run: |
          cargo +1.97.1 fmt --manifest-path integration/zenodex/rust-runtime/Cargo.toml --all -- --check
          cargo +1.97.1 clippy --manifest-path integration/zenodex/rust-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --manifest-path integration/zenodex/rust-runtime/Cargo.toml --workspace --locked

      - name: Commit validated source and lockfile
        run: |
          git config user.name 'ZenoFCIS generic backend assembler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Cargo.toml \
            Cargo.lock \
            crates/zeno-fcis-backend \
            crates/zeno-fcis-synthesis \
            crates/zeno-fcis \
            tools/check_assurance.py \
            docs/GENERIC_BACKEND_PROTOCOL.md \
            .github/workflows/ci.yml \
            .github/workflows/ecosystem-features.yml \
            .github/workflows/miri.yml
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'feat: add private-engine-neutral checked backend protocol'
          git push origin HEAD:agent/universal-backend-v1
