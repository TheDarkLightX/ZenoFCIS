name: schema-codegen-cleanup

on:
  push:
    branches:
      - agent/schema-codegen-v1
    paths:
      - ".github/workflows/schema-codegen-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/schema-codegen-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-shot assembly workflows
        run: |
          git config user.name 'ZenoFCIS schema/codegen cleanup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/schema-codegen-assemble.yml \
            .github/workflows/schema-codegen-cleanup.yml
          git commit -m 'chore: remove schema/codegen assembly workflows'
          git push origin HEAD:agent/schema-codegen-v1
