name: security-hotspots

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: zeno-fcis-security-hotspots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-review-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Record Python identity
        run: python3 --version

      - name: Exercise hostile and deterministic scanner fixtures
        run: python3 tools/security_hotspots.py self-test

      - name: Reject unreviewed hotspot or model drift
        run: python3 tools/security_hotspots.py check

      - name: Render prompt-minimized reviewer cards
        run: >-
          python3 tools/security_hotspots.py scan
          --format markdown
          --top 30
          > /tmp/zeno-fcis-security-hotspots.md

      - name: Check public documentation links
        run: python3 tools/check_library_docs.py
