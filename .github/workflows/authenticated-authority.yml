name: authenticated-authority

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: zeno-fcis-authenticated-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-bound-authenticated-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Compile strict authenticated boundaries
        run: |
          cargo +1.97.1 clippy \
            -p zeno-fcis-authenticated \
            -p zeno-fcis-authenticated-authority \
            -p zeno-fcis \
            --all-targets --all-features --locked -- -D warnings

      - name: Decoder, qualification, relation, and nominal-constructor laws
        run: |
          cargo +1.97.1 test \
            -p zeno-fcis-authenticated \
            -p zeno-fcis-authenticated-authority \
            --all-features --locked
          cargo +1.97.1 test \
            -p zeno-fcis-authenticated \
            -p zeno-fcis-authenticated-authority \
            --doc --all-features --locked

      - name: Umbrella authenticated authority feature
        run: |
          cargo +1.97.1 check \
            -p zeno-fcis \
            --no-default-features --features authenticated-authority --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.97.1 doc \
            -p zeno-fcis-authenticated \
            -p zeno-fcis-authenticated-authority \
            -p zeno-fcis \
            --all-features --locked --no-deps

      - name: Static authority-boundary checks
        run: python3 tools/check_assurance.py
