name: tier1-wasmtime-scaling-28-aot-binary

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-wasmtime-scaling-28.yml"
      - "experiments/cranelift-tier1/qualify_wasmtime_scaling_28.py"
      - "experiments/cranelift-tier1/test_qualify_wasmtime_scaling_28.py"
      - "experiments/cranelift-tier1/independent_recheck_scaling_28.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-wasmtime-scaling-28
  cancel-in-progress: true

jobs:
  synthetic-multiplicity-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - name: Checkout exact isolated ZenoFCIS experiment
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Checkout detached exact Wasmtime/Cranelift revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Qualify generator source and refusal controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          rustup toolchain install 1.97.1 --profile minimal
          python3 -B experiments/cranelift-tier1/test_qualify_wasmtime_scaling_28.py
          python3 -B experiments/cranelift-tier1/test_qualify_wasmtime_frontend_28.py
      - name: Build source-identical baseline and one-rule patched Wasmtime CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-scaling-results
          {
            git rev-parse HEAD
            git -C upstream rev-parse HEAD
            rustc --version
            cargo --version
            uname -a
          } > tier1-scaling-results/pins.txt
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-scaling-results/baseline-build.stdout \
            2> tier1-scaling-results/baseline-build.stderr
          cp upstream/target/debug/wasmtime tier1-scaling-results/wasmtime-baseline
          python3 -B experiments/cranelift-tier1/install_isle_candidate.py \
            --upstream upstream --out tier1-scaling-results/patch-receipt.json
          git -C upstream diff -- cranelift/codegen/src/opts/selects.isle \
            > tier1-scaling-results/one-rule.patch
          cargo build --locked --manifest-path upstream/Cargo.toml \
            -p wasmtime-cli --bin wasmtime --no-default-features \
            --features run,compile,wat,objdump \
            > tier1-scaling-results/patched-build.stdout \
            2> tier1-scaling-results/patched-build.stderr
          cp upstream/target/debug/wasmtime tier1-scaling-results/wasmtime-patched
      - name: Compile 1, 16, 64 and 256 function synthetic Wasm modules and check finite oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_wasmtime_scaling_28.py \
            --upstream upstream \
            --baseline-bin tier1-scaling-results/wasmtime-baseline \
            --patched-bin tier1-scaling-results/wasmtime-patched \
            --out tier1-scaling-results/generated
      - name: Independently re-measure compiled Wasmtime binary size and refuse source drift
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/independent_recheck_scaling_28.py \
            --source-receipt tier1-scaling-results/generated/qualification.json \
            --out tier1-scaling-results/independent-recheck.json
      - name: Archive pinned compiler, emitted objects, exact WAT and independent receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-wasmtime-scaling-28-synthetic
          path: |
            tier1-scaling-results/generated
            tier1-scaling-results/independent-recheck.json
            tier1-scaling-results/patch-receipt.json
            tier1-scaling-results/one-rule.patch
            tier1-scaling-results/pins.txt
            tier1-scaling-results/*.stdout
            tier1-scaling-results/*.stderr
          retention-days: 30
          if-no-files-found: warn
