name: composition-profile-assemble

on:
  pull_request:
    branches:
      - agent/candidate-commit-bundle-v1
    paths:
      - "internal/composition-profile-payload-v2/**"
      - ".github/workflows/composition-profile-assemble.yml"

permissions:
  contents: write

concurrency:
  group: composition-profile-assemble-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assemble-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "${path}")"
            if [ "${actual}" != "${expected}" ]; then
              printf 'blob mismatch: %s expected=%s actual=%s\n' "${path}" "${expected}" "${actual}" >&2
              exit 1
            fi
          }
          check_blob f1a2601e96beeda3563ddf8e0b1f69cc37f91828 internal/composition-profile-payload-v2/000.b64
          check_blob eecbf93876baad807fba88c727e43449e917c541 internal/composition-profile-payload-v2/001.b64
          check_blob 9837b873b2b38003b724475df9a06435a69d7413 internal/composition-profile-payload-v2/002a.b64
          check_blob 00fc1dfe775e24b3d0ef063b6dc3ca986fe10560 internal/composition-profile-payload-v2/002b.b64
          check_blob d4d1aadd882be194dcb2c2469397c38365a1f8bf internal/composition-profile-payload-v2/002c.b64
          check_blob a619f944956385af733d66b52777191b79a1d9b1 internal/composition-profile-payload-v2/002d.b64
          check_blob 4d16ed5c2637da484f9a20719a8ffe289f6bdcc9 internal/composition-profile-payload-v2/003.b64
          check_blob 87f288f9d3691d7cbacd5375950f1887c33238cf internal/composition-profile-payload-v2/004.b64
          check_blob fe14460f916d197d92611894b9b12e557421bafd internal/composition-profile-payload-v2/005.b64
          check_blob 30258ffb3e1810e2ddb5513fc6c70fc8c43cc38e internal/composition-profile-payload-v2/006.b64
          check_blob 9d7b0f4becf33a274f913bb3c0d6761abfc9fbce internal/composition-profile-payload-v2/007.b64
          check_blob 94f0849ff62162ec2e2cd24811fd2078974225fa internal/composition-profile-payload-v2/008.b64
          check_blob 16cfbe361bd137606958e97ae9910110846808b7 internal/composition-profile-payload-v2/009.b64
          check_blob a90a35ec482f70365da6b4f0484a8b9cd27a0352 internal/composition-profile-payload-v2/010.b64
          check_blob 8a580b423f69f32e4439216de654ff4de1328093 internal/composition-profile-payload-v2/011.b64
          cat \
            internal/composition-profile-payload-v2/000.b64 \
            internal/composition-profile-payload-v2/001.b64 \
            internal/composition-profile-payload-v2/002a.b64 \
            internal/composition-profile-payload-v2/002b.b64 \
            internal/composition-profile-payload-v2/002c.b64 \
            internal/composition-profile-payload-v2/002d.b64 \
            internal/composition-profile-payload-v2/003.b64 \
            internal/composition-profile-payload-v2/004.b64 \
            internal/composition-profile-payload-v2/005.b64 \
            internal/composition-profile-payload-v2/006.b64 \
            internal/composition-profile-payload-v2/007.b64 \
            internal/composition-profile-payload-v2/008.b64 \
            internal/composition-profile-payload-v2/009.b64 \
            internal/composition-profile-payload-v2/010.b64 \
            internal/composition-profile-payload-v2/011.b64 \
            | base64 --decode > "${RUNNER_TEMP}/composition-profile.tar.gz"
          printf '%s  %s\n' \
            '25fd1cb0db4f1167efe51d86928ec0bb082eef13d0747451461317ab837612c4' \
            "${RUNNER_TEMP}/composition-profile.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/composition-profile.tar.gz" -C .
          cargo +1.97.1 fmt --all

      - name: Capture exact Rust diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p internal/composition-profile-diagnostics
          LOG=internal/composition-profile-diagnostics/rust.log
          : > "${LOG}"
          status=0
          run_check() {
            printf '\n===== %s =====\n' "$1" >> "${LOG}"
            shift
            "$@" >> "${LOG}" 2>&1 || status=$?
          }
          run_check clippy cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
          run_check tests cargo +1.97.1 test --workspace --all-features
          run_check doctests cargo +1.97.1 test --workspace --doc --all-features
          for crate in \
            zeno-fcis-core \
            zeno-fcis-value \
            zeno-fcis-codec \
            zeno-fcis-patch \
            zeno-fcis-plan \
            zeno-fcis-receipt \
            zeno-fcis-shell \
            zeno-fcis-compose \
            zeno-fcis-refine \
            zeno-fcis-profile-zenodex \
            zeno-fcis
          do
            run_check "no_std-${crate}" cargo +1.97.1 check -p "${crate}" --no-default-features --target wasm32-unknown-unknown
          done
          run_check rustdoc env RUSTDOCFLAGS='-D warnings' cargo +1.97.1 doc --workspace --all-features --no-deps
          printf '%s\n' "${status}" > internal/composition-profile-diagnostics/status.txt
          exit 0

      - name: Upload compiler transcript
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: composition-profile-rust-diagnostics
          path: internal/composition-profile-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce verification result
        run: test "$(cat internal/composition-profile-diagnostics/status.txt)" = "0"

      - name: Publish reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZenoFCIS composition assembler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Cargo.toml \
            docs/COMPOSITION_REFINEMENT_ZENODEX.md \
            crates/zeno-fcis/Cargo.toml \
            crates/zeno-fcis/src/lib.rs \
            crates/zeno-fcis-compose \
            crates/zeno-fcis-refine \
            crates/zeno-fcis-profile-zenodex
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'feat: add compositional contracts and ZenoDEX refinement'
          git push origin HEAD:agent/composition-refinement-zenodex-v1
