name: agent-integrate-solana-generator

on:
  push:
    branches:
      - agent/solana-fcis-v1-20260727

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
          ref: agent/solana-fcis-v1-20260727

      - name: Integrate and repair generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/zeno-fcis-codegen/src/solana_anchor.rs")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '("unsafe", SolanaCoreSafetyFindingKind::UnsafeCode),',
              '("unsafe {", SolanaCoreSafetyFindingKind::UnsafeCode),',
          )
          text = text.replace(
              '("unsafe", SolanaShellSafetyFindingKind::UnsafeCode),',
              '("unsafe {", SolanaShellSafetyFindingKind::UnsafeCode),',
          )

          pattern = re.compile(
              r'\n    let shell_source = files\n'
              r'        \.iter\(\)\n'
              r'        \.find\(\|file\| file\.path\(\)\.ends_with\("programs/"\)\)\n'
              r'        \.map\(GeneratedOnchainFile::content\);\n'
              r'    if !inspect_solana_core_source\(core_source\)\.is_clean\(\) \|\| shell_source\.is_some\(\) \{\n'
              r'        return Err\(OnchainModelError::InvalidBinding\);\n'
              r'    \}\n'
          )
          text, count = pattern.subn(
              '\n    if !inspect_solana_core_source(core_source).is_clean() {\n'
              '        return Err(OnchainModelError::InvalidBinding);\n'
              '    }\n',
              text,
          )
          if count != 1:
              raise SystemExit(f"expected one redundant shell lookup, found {count}")

          text = text.replace(
              'ProjectCore, State, MACHINE_HASH}};',
              'ProjectCore, State, MACHINE_HASH, MACHINE_VERSION}};',
          )
          if text.count('state.version = 1;') != 1:
              raise SystemExit("expected one hardcoded machine version")
          text = text.replace('state.version = 1;', 'state.version = MACHINE_VERSION;')

          old = '-> EffectPlan {{\n    EffectPlan {{'
          new = '-> EffectPlan {{\n    let _ = (before_state, command, context);\n    EffectPlan {{'
          if text.count(old) != 1:
              raise SystemExit("effect builder body not found")
          text = text.replace(old, new)

          start = text.index("fn encode_bytes32(")
          end = text.index("\nfn rust_type", start)
          replacement = r'''fn encode_bytes32(scalar: OnchainScalar, name: &str) -> String {
              match scalar {
                  OnchainScalar::Bool => format!(
                      "{{ let mut output = [0_u8; 32]; output[31] = u8::from({name}); output }}"
                  ),
                  OnchainScalar::Bytes32 => name.to_owned(),
                  OnchainScalar::U8 => encode_unsigned_bytes32(name, 1),
                  OnchainScalar::U16 => encode_unsigned_bytes32(name, 2),
                  OnchainScalar::U32 => encode_unsigned_bytes32(name, 4),
                  OnchainScalar::U64 => encode_unsigned_bytes32(name, 8),
                  OnchainScalar::U128 => encode_unsigned_bytes32(name, 16),
                  OnchainScalar::I8 => encode_signed_bytes32(name, 1),
                  OnchainScalar::I16 => encode_signed_bytes32(name, 2),
                  OnchainScalar::I32 => encode_signed_bytes32(name, 4),
                  OnchainScalar::I64 => encode_signed_bytes32(name, 8),
                  OnchainScalar::I128 => encode_signed_bytes32(name, 16),
              }
          }

          fn encode_unsigned_bytes32(name: &str, width: usize) -> String {
              let start = 32_usize.saturating_sub(width);
              format!(
                  "{{ let mut output = [0_u8; 32]; let bytes = {name}.to_be_bytes(); output[{start}..].copy_from_slice(&bytes); output }}"
              )
          }

          fn encode_signed_bytes32(name: &str, width: usize) -> String {
              let start = 32_usize.saturating_sub(width);
              format!(
                  "{{ let mut output = if {name} < 0 {{ [0xff_u8; 32] }} else {{ [0_u8; 32] }}; let bytes = {name}.to_be_bytes(); output[{start}..].copy_from_slice(&bytes); output }}"
              )
          }
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(".map(u8::to_string)", ".map(|byte| byte.to_string())")
          path.write_text(text, encoding="utf-8")

          path = Path("crates/zeno-fcis-codegen/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          if "mod solana_anchor;" not in text:
              marker = "mod root_envelope;\n"
              if text.count(marker) != 1:
                  raise SystemExit("codegen module insertion point not found")
              text = text.replace(marker, marker + "mod solana_anchor;\n")
          if "pub use solana_anchor::{" not in text:
              marker = "pub use render::{GENERATOR_ID, generate};\n"
              block = '''pub use solana_anchor::{
              ANCHOR_VERSION, MAX_SOLANA_GENERATED_FILE_BYTES, SOLANA_ANCHOR_GENERATOR_ID,
              SOLANA_TOOLCHAIN_VERSION, SolanaAnchorSpec, SolanaCoreSafetyFindingKind,
              SolanaFungibleBinding, SolanaSafetyFinding, SolanaSafetyReport,
              SolanaShellSafetyFindingKind, generate_solana_anchor, inspect_solana_core_source,
              inspect_solana_shell_source,
          };
          '''
              if text.count(marker) != 1:
                  raise SystemExit("codegen export insertion point not found")
              text = text.replace(marker, marker + block)
          path.write_text(text, encoding="utf-8")

          path = Path("crates/zeno-fcis/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          if "SOLANA_ANCHOR_GENERATOR_ID" not in text:
              text = text.replace(
                  "    CodegenError, GENERATOR_ID, GeneratedBundle, GeneratedFile, GeneratedOnchainBundle,\n",
                  "    ANCHOR_VERSION, CodegenError, GENERATOR_ID, GeneratedBundle, GeneratedFile,\n    GeneratedOnchainBundle,\n",
              )
              text = text.replace(
                  "    GeneratedOnchainFile, GeneratedSolidity, GenerationSpec, MAX_ONCHAIN_CAPABILITIES,\n",
                  "    GeneratedOnchainFile, GeneratedSolidity, GenerationSpec, MAX_ONCHAIN_CAPABILITIES,\n    MAX_SOLANA_GENERATED_FILE_BYTES,\n",
              )
              text = text.replace(
                  "    OnchainMachineSpec, OnchainModelError, OnchainReason, OnchainScalar, RecipientPolicy,\n",
                  "    OnchainMachineSpec, OnchainModelError, OnchainReason, OnchainScalar, RecipientPolicy,\n    SOLANA_ANCHOR_GENERATOR_ID, SOLANA_TOOLCHAIN_VERSION, SolanaAnchorSpec,\n    SolanaCoreSafetyFindingKind, SolanaFungibleBinding, SolanaSafetyFinding,\n    SolanaSafetyReport, SolanaShellSafetyFindingKind,\n",
              )
              text = text.replace(
                  "    SoliditySafetyFindingKind, SoliditySafetyReport, SolidityScalar, generate,\n    generate_advanced_solidity, generate_solidity, inspect_solidity_source,\n",
                  "    SoliditySafetyFindingKind, SoliditySafetyReport, SolidityScalar, generate,\n    generate_advanced_solidity, generate_solana_anchor, generate_solidity,\n    inspect_solana_core_source, inspect_solana_shell_source, inspect_solidity_source,\n",
              )
          path.write_text(text, encoding="utf-8")

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "bounded Solidity and chain-neutral on-chain FCIS generators",
              "bounded Solidity, Solana/Anchor, and chain-neutral on-chain FCIS generators",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary integration workflow
        run: rm .github/workflows/agent-integrate-solana-generator.yml

      - name: Install pinned formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +1.97.1 fmt --all

      - name: Commit integrated generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Solana Anchor FCIS generator"
          git push origin HEAD:agent/solana-fcis-v1-20260727
