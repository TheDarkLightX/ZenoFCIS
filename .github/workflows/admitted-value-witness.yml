name: admitted-value-witness

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: zeno-fcis-admitted-value-witness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admitted-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Compile witness boundary
        run: |
          cargo +1.97.1 clippy \
            -p zeno-fcis-value \
            -p zeno-fcis-codec \
            -p zeno-fcis \
            --all-targets --all-features --locked -- -D warnings

      - name: Admission and encoding laws
        run: |
          cargo +1.97.1 test \
            -p zeno-fcis-value \
            -p zeno-fcis-codec \
            -p zeno-fcis \
            --all-features --locked
          cargo +1.97.1 test -p zeno-fcis-value --doc --locked

      - name: no_std witness boundary
        run: |
          cargo +1.97.1 check \
            -p zeno-fcis-value \
            --no-default-features --locked \
            --target wasm32-unknown-unknown
          cargo +1.97.1 check \
            -p zeno-fcis-codec \
            --no-default-features --locked \
            --target wasm32-unknown-unknown
          cargo +1.97.1 check \
            -p zeno-fcis \
            --no-default-features --locked \
            --target wasm32-unknown-unknown

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.97.1 doc \
            -p zeno-fcis-value \
            -p zeno-fcis-codec \
            -p zeno-fcis \
            --all-features --locked --no-deps

      - name: Static authority-boundary checks
        run: python3 tools/check_assurance.py
