name: qemu-demo

on:
  pull_request:
    paths:
      - "crates/zeno-fcis-spec/**"
      - "demos/mini-determinator-qemu/**"
      - "tools/qemu_demo.py"
      - "docs/QEMU_MINI_DETERMINATOR.md"
      - "docs/assets/marketing/mini-determinator-qemu-*"
      - ".github/workflows/qemu-demo.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-and-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install host-only emulator and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf imagemagick

      - name: Install pinned freestanding Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-21 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rust-src \
            --target x86_64-unknown-none

      - name: Exercise fail-closed host validation
        run: python3 tools/qemu_demo.py self-test

      - name: Boot kernel and capture guest evidence
        run: python3 tools/qemu_demo.py capture --out "${RUNNER_TEMP}/qemu-capture"

      - name: Compare canonical guest transcript
        run: cmp docs/assets/marketing/mini-determinator-qemu-serial.txt "${RUNNER_TEMP}/qemu-capture/mini-determinator-qemu-serial.txt"

      - name: Verify framebuffer artifact
        run: |
          identify "${RUNNER_TEMP}/qemu-capture/mini-determinator-qemu-kernel.png"
          compare -metric AE \
            docs/assets/marketing/mini-determinator-qemu-kernel.png \
            "${RUNNER_TEMP}/qemu-capture/mini-determinator-qemu-kernel.png" \
            null:
