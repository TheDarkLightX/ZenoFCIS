name: composition-v2-assemble

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: composition-v2-assemble-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout composition branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/composition-proof-v2-20260728
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact mounted ZenoDEX revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: TheDarkLightX/ZenoDEX
          ref: e3cf1aad40e487893230ae0c55f1f0dda62f9955
          path: integration/zenodex
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Apply exact hardening and normalize source
        run: |
          python3 internal/composition-v2-hardening.py
          cargo +1.97.1 fmt --all

      - name: Capture exact diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p internal/composition-v2-diagnostics
          status=0
          run_check() {
            name="$1"
            shift
            "$@" >"internal/composition-v2-diagnostics/${name}.log" 2>&1
            code=$?
            printf '%s\n' "$code" >"internal/composition-v2-diagnostics/${name}.status"
            if test "$code" -ne 0; then status="$code"; fi
          }
          run_check clippy cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          run_check tests cargo +1.97.1 test --workspace --all-features --locked
          run_check doctests cargo +1.97.1 test --workspace --doc --all-features --locked
          run_check compose-no-std cargo +1.97.1 check -p zeno-fcis-compose --no-default-features --locked --target wasm32-unknown-unknown
          run_check umbrella-no-std cargo +1.97.1 check -p zeno-fcis --no-default-features --locked --target wasm32-unknown-unknown
          run_check rustdoc env RUSTDOCFLAGS=-Dwarnings cargo +1.97.1 doc --workspace --all-features --locked --no-deps
          printf '%s\n' "$status" > internal/composition-v2-diagnostics/status.txt
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: composition-v2-diagnostics
          path: internal/composition-v2-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Enforce ZenoFCIS result
        run: test "$(cat internal/composition-v2-diagnostics/status.txt)" = "0"

      - name: Verify exact mounted ZenoDEX workspace
        run: |
          cargo +1.97.1 fmt --manifest-path integration/zenodex/rust-runtime/Cargo.toml --all -- --check
          cargo +1.97.1 clippy --manifest-path integration/zenodex/rust-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --manifest-path integration/zenodex/rust-runtime/Cargo.toml --workspace --locked

      - name: Commit exact validated source
        run: |
          git config user.name 'ZenoFCIS composition v2 assembly'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            crates/zeno-fcis-compose/src/lib.rs \
            crates/zeno-fcis-compose/tests/frame_authorization.rs \
            crates/zeno-fcis/src/lib.rs \
            docs/FORMAL_COMPOSITION_V2.md \
            docs/audits/COMPOSITION_CBC_AUDIT_20260728.md \
            .github/workflows/formal-composition-v2.yml
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'feat: add proof-carrying formal composition v2'
          git push origin HEAD:agent/composition-proof-v2-20260728
