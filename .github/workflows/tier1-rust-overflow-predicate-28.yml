name: tier1-rust-llvm-overflow-predicate-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-rust-overflow-predicate-28.yml"
      - "experiments/cranelift-tier1/install_rust_overflow_predicate_28.py"
      - "experiments/cranelift-tier1/verify_rust_overflow_predicate_28.py"
      - "experiments/cranelift-tier1/qualify_rust_overflow_predicate_28.py"
      - "experiments/cranelift-tier1/independent_recheck_rust_overflow_predicate_28.py"
      - "experiments/cranelift-tier1/test_rust_overflow_predicate_28.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-rust-llvm-overflow-predicate-28
  cancel-in-progress: true

jobs:
  full-rust-overflow-semantic-native-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - name: Checkout isolated ZenoFCIS experimental head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Checkout exact pinned upstream Wasmtime/Cranelift
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Set up Rust and enforce source and bounded-exhaustive semantic controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          python3 -B experiments/cranelift-tier1/test_rust_overflow_predicate_28.py -v
          python3 -m venv "$RUNNER_TEMP/tier1-overflow-venv"
          "$RUNNER_TEMP/tier1-overflow-venv/bin/python" -m pip install \
            --only-binary=:all: --require-hashes -r tools/machine_code_requirements.txt
      - name: Independent all-input signed overflow predicate and entire clamp QF_BV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-overflow-results
          {
            echo "ZenoFCIS $(git rev-parse HEAD)"
            echo "Upstream $(git -C upstream rev-parse HEAD)"
            rustc --version
            cargo --version
            "$RUNNER_TEMP/tier1-overflow-venv/bin/python" -c 'import z3; print("Z3",z3.get_version_string())'
          } > tier1-overflow-results/pins.txt
          "$RUNNER_TEMP/tier1-overflow-venv/bin/python" -B \
            experiments/cranelift-tier1/verify_rust_overflow_predicate_28.py \
            --out tier1-overflow-results/predicate-proof.json
      - name: Build the original and one-rule-patched compiler from identical upstream
        shell: bash
        run: |
          set -euo pipefail
          for mode in baseline xorand; do
            python3 -B experiments/cranelift-tier1/install_rust_overflow_predicate_28.py \
              --upstream upstream --mode "$mode" \
              --out "tier1-overflow-results/$mode-source-receipt.json"
            git -C upstream diff -- cranelift/codegen/src/opts/selects.isle \
              > "tier1-overflow-results/$mode-rule.patch"
            cargo build --locked --manifest-path upstream/Cargo.toml \
              -p wasmtime-cli --bin wasmtime --no-default-features \
              --features run,compile,wat,objdump \
              > "tier1-overflow-results/$mode-build.stdout" \
              2> "tier1-overflow-results/$mode-build.stderr"
            cp upstream/target/debug/wasmtime "tier1-overflow-results/wasmtime-$mode"
            sha256sum "tier1-overflow-results/wasmtime-$mode" \
              >> tier1-overflow-results/pins.txt
          done
      - name: Compile identical Rust-generated Wasm and recheck finite i64 semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_rust_overflow_predicate_28.py \
            --upstream upstream \
            --baseline-bin tier1-overflow-results/wasmtime-baseline \
            --xorand-bin tier1-overflow-results/wasmtime-xorand \
            --baseline-receipt tier1-overflow-results/baseline-source-receipt.json \
            --xorand-receipt tier1-overflow-results/xorand-source-receipt.json \
            --out tier1-overflow-results/cases
      - name: Independent source, native ELF, full AOT and executable witness audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/independent_recheck_rust_overflow_predicate_28.py \
            --upstream upstream \
            --source-receipt tier1-overflow-results/cases/qualification.json \
            --baseline-bin tier1-overflow-results/wasmtime-baseline \
            --xorand-bin tier1-overflow-results/wasmtime-xorand \
            --baseline-receipt tier1-overflow-results/baseline-source-receipt.json \
            --xorand-receipt tier1-overflow-results/xorand-source-receipt.json \
            --out tier1-overflow-results/independent-recheck.json
      - name: Archive exact original Wasm, native AOT objects, solver and cost receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rust-llvm-overflow-xorand-28
          path: |
            tier1-overflow-results/cases
            tier1-overflow-results/predicate-proof.json
            tier1-overflow-results/independent-recheck.json
            tier1-overflow-results/*-source-receipt.json
            tier1-overflow-results/*-rule.patch
            tier1-overflow-results/pins.txt
            tier1-overflow-results/*.stdout
            tier1-overflow-results/*.stderr
          retention-days: 30
          if-no-files-found: warn
