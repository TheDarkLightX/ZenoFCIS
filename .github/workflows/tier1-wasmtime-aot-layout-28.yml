name: tier1-wasmtime-aot-elf-layout-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-wasmtime-aot-layout-28.yml"
      - "experiments/cranelift-tier1/qualify_aot_layout_28.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tier1-wasmtime-aot-layout-28
  cancel-in-progress: true

jobs:
  independently-audit-archived-elf-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated research audit source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Fetch EXACT previously qualified AOT modules and independent recheck receipts
        uses: actions/download-artifact@v4
        with:
          name: tier1-wasmtime-scaling-28-synthetic
          run-id: 41769602461
          github-token: ${{ github.token }}
          path: archived-aot
      - name: Check ELF tool and parser baseline before using research artifacts
        shell: bash
        run: |
          set -euo pipefail
          readelf --version
          python3 -B -c 'from pathlib import Path; import sys; sys.path.insert(0,"experiments/cranelift-tier1"); from qualify_aot_layout_28 import sections; s = sections(Path("/usr/bin/true")); assert s[".text"]["bytes"] > 0; print("positive ELF layout control passed")'
      - name: Audit exact ELF sections, function symbols and raw text content in producer artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-aot-layout-result
          python3 -B experiments/cranelift-tier1/qualify_aot_layout_28.py \
            --root archived-aot \
            --out tier1-aot-layout-result/qualified.json
          git rev-parse HEAD > tier1-aot-layout-result/audit-commit.txt
          sha256sum tier1-aot-layout-result/qualified.json > tier1-aot-layout-result/qualified.sha256
      - name: Archive independent layout audit and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-wasmtime-aot-layout-28-recheck
          path: tier1-aot-layout-result
          retention-days: 30
          if-no-files-found: warn
