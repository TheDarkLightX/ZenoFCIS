name: tier1-rust-signmask-palette-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-rust-signmask-palette-28.yml"
      - "experiments/cranelift-tier1/install_rust_signmask_palette_28.py"
      - "experiments/cranelift-tier1/verify_rust_signmask_palette_28.py"
      - "experiments/cranelift-tier1/qualify_rust_signmask_palette_28.py"
      - "experiments/cranelift-tier1/independent_recheck_rust_signmask_palette_28.py"
      - "experiments/cranelift-tier1/test_rust_signmask_palette_28.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-rust-signmask-palette-28
  cancel-in-progress: true

jobs:
  native-aot-three-candidate-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - name: Checkout exact isolated research source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Checkout exact pinned Wasmtime/Cranelift source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Setup exact Rust, solver and independent bounded candidate tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          python3 -B experiments/cranelift-tier1/test_rust_signmask_palette_28.py -v
          python3 -m venv "$RUNNER_TEMP/tier1-signmask-venv"
          "$RUNNER_TEMP/tier1-signmask-venv/bin/python" -m pip install \
            --only-binary=:all: --require-hashes -r tools/machine_code_requirements.txt
      - name: Check every admitted expression with fresh independent QF_BV proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-signmask-results
          {
            echo "ZenoFCIS experiment source: $(git rev-parse HEAD)"
            echo "Wasmtime source: $(git -C upstream rev-parse HEAD)"
            rustc --version
            cargo --version
            uname -a
            "$RUNNER_TEMP/tier1-signmask-venv/bin/python" -c \
              'import z3; print("Z3", z3.get_version_string())'
          } > tier1-signmask-results/source-and-host.txt
          "$RUNNER_TEMP/tier1-signmask-venv/bin/python" -B \
            experiments/cranelift-tier1/verify_rust_signmask_palette_28.py \
            --out tier1-signmask-results/semantic-proofs.json
      - name: Build source-pinned original and two isolated ISLE alternatives
        shell: bash
        run: |
          set -euo pipefail
          for variant in original add sub; do
            python3 -B experiments/cranelift-tier1/install_rust_signmask_palette_28.py \
              --upstream upstream --mode "$variant" \
              --out "tier1-signmask-results/$variant-source-receipt.json"
            git -C upstream diff -- cranelift/codegen/src/opts/selects.isle \
              > "tier1-signmask-results/$variant-rule.patch"
            cargo build --locked --manifest-path upstream/Cargo.toml \
              -p wasmtime-cli --bin wasmtime --no-default-features \
              --features run,compile,wat,objdump \
              > "tier1-signmask-results/$variant-build.stdout" \
              2> "tier1-signmask-results/$variant-build.stderr"
            cp upstream/target/debug/wasmtime "tier1-signmask-results/wasmtime-$variant"
            "tier1-signmask-results/wasmtime-$variant" --version \
              >> tier1-signmask-results/source-and-host.txt
            sha256sum "tier1-signmask-results/wasmtime-$variant" \
              >> tier1-signmask-results/source-and-host.txt
          done
      - name: Finite native Wasm checks and exact same-source AOT cost for both Rust opt profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_rust_signmask_palette_28.py \
            --upstream upstream \
            --original-bin tier1-signmask-results/wasmtime-original \
            --add-bin tier1-signmask-results/wasmtime-add \
            --sub-bin tier1-signmask-results/wasmtime-sub \
            --original-receipt tier1-signmask-results/original-source-receipt.json \
            --add-receipt tier1-signmask-results/add-source-receipt.json \
            --sub-receipt tier1-signmask-results/sub-source-receipt.json \
            --out tier1-signmask-results/cases
      - name: Independent ELF size and complete .cwasm recheck with second native oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/independent_recheck_rust_signmask_palette_28.py \
            --upstream upstream \
            --source-receipt tier1-signmask-results/cases/qualification.json \
            --original-bin tier1-signmask-results/wasmtime-original \
            --add-bin tier1-signmask-results/wasmtime-add \
            --sub-bin tier1-signmask-results/wasmtime-sub \
            --original-receipt tier1-signmask-results/original-source-receipt.json \
            --add-receipt tier1-signmask-results/add-source-receipt.json \
            --sub-receipt tier1-signmask-results/sub-source-receipt.json \
            --out tier1-signmask-results/independent-recheck.json
      - name: Retain original emitted Wasm and AOT objects, SMT and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rust-llvm-signmask-palette-28
          path: |
            tier1-signmask-results/cases
            tier1-signmask-results/semantic-proofs.json
            tier1-signmask-results/independent-recheck.json
            tier1-signmask-results/*-source-receipt.json
            tier1-signmask-results/*-rule.patch
            tier1-signmask-results/source-and-host.txt
            tier1-signmask-results/*.stdout
            tier1-signmask-results/*.stderr
          retention-days: 30
          if-no-files-found: warn
