name: formal-tools

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "verification/Cargo.toml"
      - "verification/Cargo.lock"
      - "verification/kernel-laws/**"
      - "tools/record_gate_evidence.py"
      - "tools/symbolic_certificate_checker/**"
      - "tools/check_symbolic_certificates.py"
      - "tools/check_lean_inductive_mutations.py"
      - "tools/atdd.py"
      - "acceptance/features/symbolic_checks.feature"
      - "crates/zeno-fcis-formal-tools/**"
      - "crates/zeno-fcis-cli/**"
      - "crates/zeno-fcis-spec/**"
      - "crates/zeno-fcis-synthesis/**"
      - "release/formal-tools-linux-x86_64.sha256"
      - "release/lean-4.30.0-tree.sha256"
      - ".github/workflows/formal-tools.yml"
      - ".github/actions/fetch-locked-crates/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Match qualification's optimized native adapters without removing checks.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
  CVC5_URL: https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.3/cvc5-Linux-x86_64-static.zip
  Z3_URL: https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
  LEAN_URL: https://github.com/leanprover/lean4/releases/download/v4.30.0/lean-4.30.0-linux.zip

jobs:
  pinned-linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Fetch locked crates for offline repository tools
        uses: ./.github/actions/fetch-locked-crates
      - name: Record runner storage before tool download
        run: df -h
      - name: Download official artifacts
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error "$CVC5_URL" --output cvc5-Linux-x86_64-static.zip
          curl --fail --location --silent --show-error "$Z3_URL" --output z3-4.16.0-x64-glibc-2.39.zip
          curl --fail --location --silent --show-error "$LEAN_URL" --output lean-4.30.0-linux.zip
      - name: Verify recorded SHA-256 digests
        working-directory: ${{ runner.temp }}
        run: sha256sum --check "$GITHUB_WORKSPACE/release/formal-tools-linux-x86_64.sha256"
      - name: Extract pinned tools
        working-directory: ${{ runner.temp }}
        run: |
          unzip -q cvc5-Linux-x86_64-static.zip -d cvc5
          rm -f cvc5-Linux-x86_64-static.zip
          unzip -q z3-4.16.0-x64-glibc-2.39.zip -d z3
          rm -f z3-4.16.0-x64-glibc-2.39.zip
          unzip -q lean-4.30.0-linux.zip -d lean
          rm -f lean-4.30.0-linux.zip
      - name: Record extracted tool footprint
        working-directory: ${{ runner.temp }}
        run: |
          du -sh cvc5 z3 lean
          find lean -type f -print | wc -l
          df -h
      - name: Verify exact tool versions
        working-directory: ${{ runner.temp }}
        run: |
          CVC5_BIN="$(find cvc5 -type f -name cvc5 -perm -111 -print -quit)"
          test -n "$CVC5_BIN"
          "$CVC5_BIN" --version | grep -F "1.3.3"
          z3/z3-4.16.0-x64-glibc-2.39/bin/z3 --version | grep -F "4.16.0"
          lean/lean-4.30.0-linux/bin/lean --version | grep -F "4.30.0"
      - name: Test deterministic exporters and fail-closed adapters
        run: cargo +1.97.1 test -p zeno-fcis-formal-tools --locked
      - name: Match the qualified Lean runtime trust anchor
        working-directory: ${{ runner.temp }}
        run: |
          LEAN_ROOT="$PWD/lean/lean-4.30.0-linux"
          EXPECTED_TREE="$(tr -d '\n' < "$GITHUB_WORKSPACE/release/lean-4.30.0-tree.sha256")"
          ACTUAL_TREE="$(cargo +1.97.1 run --quiet --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            -p zeno-fcis-cli --locked -- backend inventory-lean "$LEAN_ROOT" | awk '/^lean tree_sha256 / { print $3 }')"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
      - name: Kernel-check linear induction and its exporter controls
        env:
          ZENO_FCIS_LEAN: ${{ runner.temp }}/lean/lean-4.30.0-linux/bin/lean
          ZENO_FCIS_LEAN_ROOT: ${{ runner.temp }}/lean/lean-4.30.0-linux
          ZENO_FCIS_LEAN_EVIDENCE: ${{ runner.temp }}/lean-inductive-evidence
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo +1.97.1 test -p zeno-fcis-formal-tools --locked -j 2 \
            lean_inductive::tests::pinned_lean_ -- --ignored --nocapture --test-threads=1
          cargo +1.97.1 test -p zeno-fcis-cli --locked -j 2 --test lean_inductive_cli \
            pinned_lean_kernel_checks_both_inductive_pilots_through_prove -- --ignored --exact --nocapture
          python3 tools/check_lean_inductive_mutations.py
      - name: Retain public induction fixture source and kernel output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-inductive-evidence
          path: ${{ runner.temp }}/lean-inductive-evidence
          if-no-files-found: warn
      - name: Kernel-check the private original shallow Lean reference
        working-directory: ${{ runner.temp }}
        run: |
          LEAN_BIN="$(find lean -type f -path '*/bin/lean' -perm -111 -print -quit)"
          test -n "$LEAN_BIN"
          ZENO_FCIS_LEAN="$PWD/$LEAN_BIN" \
            ZENO_FCIS_LEAN_ROOT="$PWD/lean/lean-4.30.0-linux" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-formal-tools --locked \
              tests::pinned_lean_translation_kernel_checks -- --ignored --exact
          ZENO_FCIS_TRANSLATION_LEAN="$PWD/$LEAN_BIN" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-formal-tools --locked \
              translation_tests::operator_corpus_checks_with_existing_lean -- --ignored --exact --nocapture
      - name: Kernel-check the private original CLI reference process
        working-directory: ${{ runner.temp }}
        run: |
          LEAN_BIN="$(find lean -type f -path '*/bin/lean' -perm -111 -print -quit)"
          test -n "$LEAN_BIN"
          ZENO_FCIS_LEAN="$PWD/$LEAN_BIN" \
            ZENO_FCIS_LEAN_ROOT="$PWD/lean/lean-4.30.0-linux" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-formal-tools --locked \
              legacy_cli::pinned_lean_cli_prove_is_process_level -- --ignored --exact
      - name: Differential-check exact CVC5 and Z3 translations
        working-directory: ${{ runner.temp }}
        run: |
          CVC5_BIN="$(find cvc5 -type f -name cvc5 -perm -111 -print -quit)"
          Z3_BIN="z3/z3-4.16.0-x64-glibc-2.39/bin/z3"
          test -n "$CVC5_BIN"
          test -x "$Z3_BIN"
          ZENO_FCIS_CVC5="$PWD/$CVC5_BIN" ZENO_FCIS_Z3="$PWD/$Z3_BIN" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-formal-tools --locked \
              tests::pinned_smt_translation_differential_check -- --ignored --exact
          ZENO_FCIS_CVC5="$PWD/$CVC5_BIN" ZENO_FCIS_Z3="$PWD/$Z3_BIN" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-formal-tools --locked \
              tests::pinned_inductive_steps_agree_with_exhaustive_replay -- --ignored --exact
          ZENO_FCIS_CVC5="$PWD/$CVC5_BIN" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-formal-tools --locked \
              system::tests::pinned_system_smt_agrees_with_exhaustive_check -- --ignored --exact
          ZENO_FCIS_CVC5="$PWD/$CVC5_BIN" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-formal-tools --locked \
              system::tests::pinned_solver_route_agrees_with_exhaustive_route_on_small_programs -- --ignored --exact
          ZENO_FCIS_CVC5="$PWD/$CVC5_BIN" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-cli --bin zeno-fcis --locked \
              synth::tests::pinned_counter_system_smt_agrees_with_exhaustive_check -- --ignored --exact
      - name: Check symbolic per-case checks with the pinned CVC5 and Z3
        working-directory: ${{ runner.temp }}
        run: |
          CVC5_BIN="$(find cvc5 -type f -name cvc5 -perm -111 -print -quit)"
          Z3_BIN="z3/z3-4.16.0-x64-glibc-2.39/bin/z3"
          test -n "$CVC5_BIN"
          test -x "$Z3_BIN"
          ZENO_FCIS_CVC5="$PWD/$CVC5_BIN" ZENO_FCIS_Z3="$PWD/$Z3_BIN" \
            cargo +1.97.1 test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p zeno-fcis-cli --locked --test symbolic_cli pinned_symbolic_ -- --ignored
      - name: Build and test the independent complete-root checker
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/certificate-checker-target
        run: |
          python3 tools/symbolic_certificate_checker/build.py --build-dir "$RUNNER_TEMP/certificate-checker"
          cargo +1.97.1 test --locked --offline -j 1 \
            --manifest-path "$RUNNER_TEMP/certificate-checker/wrapper/Cargo.toml"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'certificate-checker'
          build = json.loads((directory / 'BUILD.json').read_text())
          manifest = {'schema': 'zeno-fcis/certificate-checker/1',
                      'path': build['executable'], 'sha256': build['sha256'],
                      'timeout_ms': 10000, 'max_output_bytes': 1048576}
          (directory / 'checker.json').write_text(json.dumps(manifest) + '\n')
          PY
      - name: Qualify actual scalar certificate command and replay
        working-directory: ${{ runner.temp }}
        run: |
          CVC5_BIN="$(find cvc5 -type f -name cvc5 -perm -111 -print -quit)"
          test -n "$CVC5_BIN"
          ZENO_FCIS_CVC5="$PWD/$CVC5_BIN" \
            ZENO_FCIS_CERTIFICATE_CHECKER="$RUNNER_TEMP/certificate-checker/checker.json" \
            python3 "$GITHUB_WORKSPACE/tools/check_symbolic_certificates.py"
      - name: Check pure authoring compiler without std
        run: cargo +1.97.1 check -p zeno-fcis-spec --no-default-features --locked
      - name: Run formal-tools ATDD bindings
        run: |
          python3 tools/atdd.py run --scenario rc3-formal-tools
          python3 tools/atdd.py run --scenario rc3-formal-fail-closed
