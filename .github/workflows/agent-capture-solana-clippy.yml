name: agent-capture-solana-clippy

on:
  pull_request:
  push:
    branches:
      - agent/solana-fcis-v1-20260727

permissions:
  contents: write

concurrency:
  group: agent-capture-solana-clippy
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
          ref: agent/solana-fcis-v1-20260727
          show-progress: false

      - name: Install pinned Rust and Clippy
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy

      - name: Capture exact diagnostics
        shell: bash
        run: |
          set +e
          cargo +1.97.1 clippy -p zeno-fcis-codegen -p zeno-fcis --all-targets --all-features --locked -- -D warnings > /tmp/solana-clippy.log 2>&1
          status=$?
          set -e
          mkdir -p .agent-diagnostics
          cp /tmp/solana-clippy.log .agent-diagnostics/solana-clippy.log
          printf '%s\n' "$status" > .agent-diagnostics/solana-clippy.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-diagnostics/solana-clippy.log .agent-diagnostics/solana-clippy.status
          git commit -m "Capture Solana generator Clippy diagnostics"
          git pull --rebase origin agent/solana-fcis-v1-20260727
          git push origin HEAD:agent/solana-fcis-v1-20260727
