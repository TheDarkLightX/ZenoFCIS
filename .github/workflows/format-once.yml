name: format-once

on:
  push:
    branches:
      - agent/semantic-kernel-v1
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/semantic-kernel-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format and commit
        run: |
          cargo +1.97.1 fmt --all
          git config user.name 'ZenoFCIS formatting bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.toml' 'crates/**/*.rs'
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'style: apply pinned rustfmt'
          git push origin HEAD:agent/semantic-kernel-v1
