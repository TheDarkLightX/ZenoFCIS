name: project-bootstrap

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: zeno-fcis-project-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Compile generated starter and deny warnings
        run: |
          cargo +1.97.1 clippy -p zeno-fcis-bootstrap -p zeno-fcis-codegen-fixture --all-targets --all-features --locked -- -D warnings
          cargo +1.97.1 check -p zeno-fcis --features bootstrap --locked

      - name: Generator laws and compiled fixtures
        run: |
          cargo +1.97.1 test -p zeno-fcis-bootstrap --locked
          cargo +1.97.1 test -p zeno-fcis-codegen-fixture --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc -p zeno-fcis-bootstrap -p zeno-fcis-codegen-fixture --locked --no-deps

      - name: Static authority-boundary checks
        run: python3 tools/check_assurance.py
