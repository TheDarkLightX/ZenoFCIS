name: secret-hardening

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  release-and-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/zeno-fcis-secret-target
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Check no_std secret boundary
        run: cargo +1.97.1 check -p zeno-fcis-secret --no-default-features --locked --target wasm32-unknown-unknown

      - name: Test optimized secret boundary
        run: cargo +1.97.1 test -p zeno-fcis-secret --all-features --release --locked

      - name: Retain exact release LLVM IR
        run: |
          cargo +1.97.1 rustc -p zeno-fcis-secret --lib --all-features --release --locked -- --emit=llvm-ir
          mapfile -t ir_files < <(find /tmp/zeno-fcis-secret-target/release/deps -type f -name 'zeno_fcis_secret-*.ll' -print)
          test "${#ir_files[@]}" -eq 1
          cp "${ir_files[0]}" /tmp/zeno-fcis-secret.ll
          test -s /tmp/zeno-fcis-secret.ll

      - name: Build content-addressed IR evidence bundle
        run: |
          rustc +1.97.1 -vV > /tmp/zeno-fcis-secret-toolchain.txt
          python3 tools/release_manifest.py --require-clean > /tmp/zeno-fcis-secret-source.json
          sha256sum /tmp/zeno-fcis-secret.ll > /tmp/zeno-fcis-secret-ir.sha256
          python3 tools/build_assurance_bundle.py \
            --source-manifest /tmp/zeno-fcis-secret-source.json \
            --artifact llvm-ir=/tmp/zeno-fcis-secret.ll \
            --artifact llvm-ir-digest=/tmp/zeno-fcis-secret-ir.sha256 \
            --artifact toolchain=/tmp/zeno-fcis-secret-toolchain.txt \
            --output /tmp/zeno-fcis-secret-ir-a.zip
          python3 tools/build_assurance_bundle.py \
            --source-manifest /tmp/zeno-fcis-secret-source.json \
            --artifact llvm-ir=/tmp/zeno-fcis-secret.ll \
            --artifact llvm-ir-digest=/tmp/zeno-fcis-secret-ir.sha256 \
            --artifact toolchain=/tmp/zeno-fcis-secret-toolchain.txt \
            --output /tmp/zeno-fcis-secret-ir-b.zip
          cmp /tmp/zeno-fcis-secret-ir-a.zip /tmp/zeno-fcis-secret-ir-b.zip

      - name: Retain secret hardening evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeno-fcis-secret-ir-${{ github.sha }}
          path: /tmp/zeno-fcis-secret-ir-a.zip
          if-no-files-found: error
          retention-days: 30
