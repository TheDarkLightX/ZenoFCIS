name: map-entry-construction

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: zeno-fcis-map-entry-construction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checked-map-entries:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Compile and deny warnings
        run: |
          cargo +1.97.1 clippy \
            -p zeno-fcis-value \
            -p zeno-fcis-codec \
            -p zeno-fcis-patch \
            -p zeno-fcis-codegen \
            -p zeno-fcis-codegen-fixture \
            -p zeno-fcis-collections \
            --all-targets --all-features --locked -- -D warnings

      - name: Constructor, codec, patch, generator, and backend laws
        run: |
          cargo +1.97.1 test \
            -p zeno-fcis-value \
            -p zeno-fcis-codec \
            -p zeno-fcis-patch \
            -p zeno-fcis-codegen \
            -p zeno-fcis-codegen-fixture \
            -p zeno-fcis-collections \
            --all-features --locked
          cargo +1.97.1 test -p zeno-fcis-value -p zeno-fcis-collections --doc --locked

      - name: no_std construction boundary
        run: |
          for crate in zeno-fcis-value zeno-fcis-codec zeno-fcis-patch zeno-fcis-collections
          do
            cargo +1.97.1 check -p "${crate}" --no-default-features --locked --target wasm32-unknown-unknown
          done

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.97.1 doc \
            -p zeno-fcis-value \
            -p zeno-fcis-codec \
            -p zeno-fcis-patch \
            -p zeno-fcis-collections \
            --all-features --locked --no-deps

      - name: Static authority-boundary checks
        run: python3 tools/check_assurance.py
