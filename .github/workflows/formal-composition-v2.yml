name: formal-composition-v2

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: formal-composition-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-carrying-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Lint composition boundary
        run: cargo +1.97.1 clippy -p zeno-fcis-compose --all-targets --all-features --locked -- -D warnings

      - name: Test composition laws
        run: cargo +1.97.1 test -p zeno-fcis-compose --all-features --locked

      - name: Test composition documentation
        run: cargo +1.97.1 test -p zeno-fcis-compose --doc --all-features --locked

      - name: Check no_std composition and umbrella surfaces
        run: |
          cargo +1.97.1 check -p zeno-fcis-compose --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --locked --target wasm32-unknown-unknown

      - name: Check warning-free documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc -p zeno-fcis-compose --all-features --locked --no-deps
