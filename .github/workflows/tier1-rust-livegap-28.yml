name: tier1-rust-livegap-28
on:
  push:
    branches: [research/2.8-tier1-cranelift-performance-20261102]
    paths:
      - '.github/workflows/tier1-rust-livegap-28.yml'
      - 'experiments/cranelift-tier1/install_udivrem_livegap_28.py'
      - 'experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py'
      - 'experiments/cranelift-tier1/rust_live_reconstruction_28.rs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-rust-livegap-28
  cancel-in-progress: true
jobs:
  livegap-experimental-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          path: upstream
          persist-credentials: false
      - name: Pinned toolchain, source checks and independent Rust semantics
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          test "$(git -C upstream rev-parse HEAD)" = b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
          test -z "$(git -C upstream status --porcelain)"
          python3 -m py_compile experiments/cranelift-tier1/{install_udivrem_livegap_28,install_udivrem_reconstruction_28,qualify_rust_live_reconstruction_28}.py
          python3 -B experiments/cranelift-tier1/install_udivrem_livegap_28.py --self-test
          python3 -B experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py --self-test
          mkdir -p tier1-livegap/compilers/{baseline,patched}
          git rev-parse HEAD >tier1-livegap/zenofcis-head.txt
          git -C upstream rev-parse HEAD >tier1-livegap/wasmtime-head.txt
          rustc --version >tier1-livegap/rustc.txt
      - name: Fetch independently qualified exact pristine baseline compiler
        uses: actions/download-artifact@v4
        with:
          repository: TheDarkLightX/ZenoFCIS
          run-id: 42951667233
          github-token: ${{ github.token }}
          name: tier1-udivrem-llvm-reconstruction-28
          path: tier1-livegap/original
      - name: Verify original binary and apply bounded two-pure-op SSA patch to disposable checkout
        run: |
          set -euo pipefail
          cp tier1-livegap/original/tier1-reconstruction/compilers/baseline/wasmtime tier1-livegap/compilers/baseline/wasmtime
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib,json
          archive=Path('tier1-livegap/original/tier1-reconstruction/compilers')
          receipt=json.loads((archive/'qualification.json').read_text())
          assert receipt['upstream']=='b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49'
          original=(archive/'baseline/wasmtime').read_bytes()
          assert hashlib.sha256(original).hexdigest()==receipt['results']['baseline']['compiler_sha256']
          PY
          python3 -B experiments/cranelift-tier1/install_udivrem_livegap_28.py --upstream upstream --out tier1-livegap/installer.json
          git -C upstream diff >tier1-livegap/experimental.patch
          test -s tier1-livegap/experimental.patch
      - name: Build exact experimental compiler and record binary identities
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path upstream/Cargo.toml -p wasmtime-cli --bin wasmtime --no-default-features --features run,compile,wat,objdump >tier1-livegap/build.stdout 2>tier1-livegap/build.stderr
          cp upstream/target/debug/wasmtime tier1-livegap/compilers/patched/wasmtime
          chmod u+x tier1-livegap/compilers/{baseline,patched}/wasmtime
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('tier1-livegap/compilers')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          r={'upstream':'b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49',
             'target':'x86_64-unknown-linux',
             'experimental_source':'install_udivrem_livegap_28.py',
             'results':{m:{'compiler_sha256':sha(root/m/'wasmtime')}
                        for m in ('baseline','patched')}}
          assert r['results']['baseline']['compiler_sha256']!=r['results']['patched']['compiler_sha256']
          (root/'qualification.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Recompile identical optimized Rust Wasm through baseline and experimental compiler
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py \
            --archive tier1-livegap/compilers --out tier1-livegap/results | tee tier1-livegap/producer-summary.json
      - name: Independently replay output hashes, finite semantics and native-cost receipts
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py \
            --archive tier1-livegap/compilers --results tier1-livegap/results --recheck \
            | tee tier1-livegap/independent-recheck.json
      - name: Archive pinned patch, exact inputs and machine code; no compiler binaries required
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rust-livegap-28
          path: |
            tier1-livegap/installer.json
            tier1-livegap/experimental.patch
            tier1-livegap/build.stdout
            tier1-livegap/build.stderr
            tier1-livegap/zenofcis-head.txt
            tier1-livegap/wasmtime-head.txt
            tier1-livegap/rustc.txt
            tier1-livegap/compilers/qualification.json
            tier1-livegap/producer-summary.json
            tier1-livegap/independent-recheck.json
            tier1-livegap/results
            experiments/cranelift-tier1/install_udivrem_livegap_28.py
            experiments/cranelift-tier1/rust_live_reconstruction_28.rs
            experiments/cranelift-tier1/qualify_rust_live_reconstruction_28.py
          if-no-files-found: warn
          retention-days: 30
