name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: zeno-fcis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --workspace --all-features

      - name: Documentation tests
        run: cargo +1.97.1 test --workspace --doc --all-features

      - name: no_std checks
        run: |
          cargo +1.97.1 check -p zeno-fcis-core --no-default-features --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-value --no-default-features --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-codec --no-default-features --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --target wasm32-unknown-unknown

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --workspace --all-features --no-deps
