name: ci

on:
  workflow_dispatch:
    inputs:
      check_macos:
        description: Run the deferred native macOS test suite
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

# Keep test executables within the checked evidence-reader's 128 MiB input bound.
# Debug assertions and overflow checks remain enabled.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: zeno-fcis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zal-observations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Observation models, replay and negative controls
        run: |
          python3 -B -m unittest discover -s integrations/zal -p 'test_observation*.py'
          python3 -B -m unittest discover -s integrations/zal -p 'test_relational_observation.py'
      - name: Generated diagram correspondence
        run: |
          python3 -B integrations/zal/observation_diagrams.py integrations/zal/examples/observations/delivery.zal --profile integrations/zal/examples/observations/delivery.partial.json --out docs/zal/diagrams/observations --name delivery_partial --check
          python3 -B integrations/zal/observation_diagrams.py integrations/zal/examples/observations/delivery_idempotent.zal --profile integrations/zal/examples/observations/delivery_idempotent.partial.json --out docs/zal/diagrams/observations --name delivery_idempotent --check
          python3 -B integrations/zal/observation_diagrams.py integrations/zal/examples/observations/relational_delayed_leak.zal --profile integrations/zal/examples/observations/relational_delayed_leak.json --mode relational --out docs/zal/diagrams/observations --name relational_leak --check

  zal-libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Ontology, controlled English, CLI and actual MCP requests
        run: |
          python3 -B -m unittest discover -s integrations/zal -p 'test_ontology*.py'
          PYTHONOPTIMIZE=1 python3 -O -B -m unittest discover -s integrations/zal -p 'test_ontology*.py'
      - name: Existing review, sharing, story and Lens behavior
        working-directory: integrations/zal
        run: |
          python3 -B -m unittest test_shared test_reviewed_export test_ladder_tools zal_notation.tests.test_sharing zal_notation.tests.test_story zal_notation.tests.test_lenses zal_notation.tests.test_lens_integration

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Establish contained checker runtime
        uses: ./.github/actions/checker-containment

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Fetch locked crates for offline repository tools
        uses: ./.github/actions/fetch-locked-crates

      - name: Evaluator identity
        run: |
          python3 tools/check_authority_v2.py --check-sources
          python3 -m unittest discover -s tools -p test_evaluator_identity.py
          cargo +1.97.1 test --locked -p zeno-fcis-synthesis --test v2_evaluator_identity

      - name: Repository tool tests
        # Pure-Python tests of repository tools that no ATDD scenario runs.
        run: |
          python3 tools/test_miri_exclusions.py
          python3 tools/test_authority_source_bundle.py
          python3 tools/test_proof_challenge.py
          python3 tools/test_signed_arithmetic.py
          python3 tools/test_check_spec_parser.py
          python3 tools/test_generate_spec_grammar.py

      - name: Spot reference and source tests
        run: python3 -B -m unittest discover -s core-apps/zenodex-spot/tests -p "test_*.py"
      # BEGIN neutral knowledge source and packaging guards.
      - name: Knowledge file include policy and engine reference
        run: |
          python3 -B tools/check_knowledge_files.py
          python3 -B tools/test_strategy_knowledge_reference.py
          python3 -B tools/test_knowledge_files.py
      # END neutral knowledge guards.

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --workspace --all-features --locked

      - name: Validate commitment and persistent-map benchmark fixtures
        run: >-
          cargo +1.97.1 bench --profile dev
          -p zeno-fcis-crypto -p zeno-fcis-collections
          --all-features --locked -- --test

      - name: Documentation tests
        run: cargo +1.97.1 test --workspace --doc --all-features --locked

      - name: no_std checks
        run: |
          for crate in \
            zeno-fcis-core \
            zeno-fcis-value \
            zeno-fcis-codec \
            zeno-fcis-crypto \
            zeno-fcis-project \
            zeno-fcis-catalog \
            zeno-fcis-transition \
            zeno-fcis-laws \
            zeno-fcis-authority \
            zeno-fcis-security \
            zeno-fcis-secret \
            zeno-fcis-patch \
            zeno-fcis-plan \
            zeno-fcis-receipt \
            zeno-fcis-shell \
            zeno-fcis-compose \
            zeno-fcis-domain \
            zeno-fcis-composed-program \
            zeno-fcis-refine \
            zeno-fcis-profile-zenodex \
            zeno-fcis-schema \
            zeno-fcis-synthesis \
            zeno-fcis-backend \
            zeno-fcis-spec \
            zeno-fcis
          do
            cargo +1.97.1 check -p "${crate}" --no-default-features --locked --target wasm32-unknown-unknown
          done

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --workspace --all-features --locked --no-deps

  rust-macos:
    name: rust (macOS arm64)
    # Native macOS qualification is separate from the initial Linux release.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_macos }}
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustc +1.97.1 -vV
          test "$(rustc +1.97.1 -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin

      - name: Fetch locked crates for offline repository tools
        uses: ./.github/actions/fetch-locked-crates

      - name: Clippy on the macOS host
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features --locked --offline -- -D warnings

      - name: Portable tests on the macOS host
        run: cargo +1.97.1 test --workspace --all-features --locked --offline
