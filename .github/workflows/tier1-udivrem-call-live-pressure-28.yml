name: tier1-udivrem-call-live-pressure-28
on:
  push:
    branches: [research/2.8-tier1-cranelift-performance-20261102]
    paths:
      - '.github/workflows/tier1-udivrem-call-live-pressure-28.yml'
      - 'experiments/cranelift-tier1/qualify_udivrem_live_calls_28.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-udivrem-call-live-pressure-28
  cancel-in-progress: true
jobs:
  live-across-div:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Syntax and deterministic oracle tests
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/cranelift-tier1/qualify_udivrem_live_calls_28.py
          python3 -B experiments/cranelift-tier1/qualify_udivrem_live_calls_28.py --self-test
          mkdir -p tier1-call-live
          git rev-parse HEAD > tier1-call-live/zenofcis-head.txt
      - name: Retrieve previously qualified exact-source baseline and patched compilers
        uses: actions/download-artifact@v4
        with:
          repository: TheDarkLightX/ZenoFCIS
          run-id: 42596373104
          github-token: ${{ github.token }}
          name: tier1-udivrem-same-wasm-dualresult-28
          path: tier1-call-live/source
      - name: Validate compiler pins and run same-WAT native call-live pressure matrix
        run: |
          set -euo pipefail
          chmod u+x tier1-call-live/source/tier1-dual-same-wasm/{baseline,patched}/wasmtime
          python3 -B experiments/cranelift-tier1/qualify_udivrem_live_calls_28.py \
            --archive tier1-call-live/source/tier1-dual-same-wasm \
            --out tier1-call-live/results
      - name: Preserve exact WAT, AOT, disassembly, source and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-udivrem-call-live-pressure-28
          path: |
            tier1-call-live/zenofcis-head.txt
            tier1-call-live/results
            experiments/cranelift-tier1/qualify_udivrem_live_calls_28.py
          if-no-files-found: warn
          retention-days: 30
