name: machine-code

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/machine_code/**'
      - 'tools/test_machine_code*.py'
      - 'tools/machine_qualification/**'
      - 'tools/test_machine_qualification*.py'
      - 'tools/test_zal_word_kernel.py'
      - 'tools/test_zal_word_kernel2.py'
      - 'integrations/zal/run.py'
      - 'integrations/zal/word_kernel.py'
      - 'integrations/zal/word_kernel2.py'
      - 'tools/machine_code_requirements.txt'
      - 'test-data/machine-code/**'
      - 'test-data/zal-word-kernel/**'
      - '.github/workflows/machine-code.yml'
  push:
    branches: [main, 'wip/2.7-machine-code-*', 'wip/2.7-zal-machine-code-*']
    paths:
      - 'tools/machine_code/**'
      - 'tools/test_machine_code*.py'
      - 'tools/machine_qualification/**'
      - 'tools/test_machine_qualification*.py'
      - 'tools/test_zal_word_kernel.py'
      - 'tools/test_zal_word_kernel2.py'
      - 'integrations/zal/run.py'
      - 'integrations/zal/word_kernel.py'
      - 'integrations/zal/word_kernel2.py'
      - 'tools/machine_code_requirements.txt'
      - 'test-data/machine-code/**'
      - 'test-data/zal-word-kernel/**'
      - '.github/workflows/machine-code.yml'

permissions:
  contents: read

jobs:
  registered-isa-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install the hash-pinned experimental checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/machine-code-venv"
          "$RUNNER_TEMP/machine-code-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r tools/machine_code_requirements.txt
          printf '%s\n' "$RUNNER_TEMP/machine-code-venv/bin" >> "$GITHUB_PATH"
      - name: Independent decoder and counterexample controls
        run: python3 -B tools/test_machine_code_verifier.py
      - name: Machine proposal, synthesis and receipt replay
        run: python3 -B tools/test_machine_code_loop.py
      - name: Exact footprint pruning keeps every behaviour at its least cost
        run: |
          python3 -B tools/test_machine_code_footprint.py
          python3 -O -B tools/test_machine_code_footprint.py
      - name: Solver unrealizability agrees with exhaustive exact enumeration
        run: |
          python3 -B tools/test_machine_code_realize.py
          python3 -O -B tools/test_machine_code_realize.py
      - name: ZAL source, human feedback and independent machine replay
        run: python3 -B tools/test_zal_word_kernel.py
      - name: ZAL word-kernel profile 2, library-equal lowering and profile-2 replay
        run: python3 -B tools/test_zal_word_kernel2.py
      - name: Exact-rational analysis of fabricated paired measurements
        run: |
          python3 -B tools/test_machine_qualification_performance.py
          python3 -O -B tools/test_machine_qualification_performance.py
      - name: Profile-2 decoder, flag model and counterexample controls
        run: python3 -B tools/test_machine_code_profile2_verifier.py
      - name: Profile-2 proposal, search, emission and replay
        run: python3 -B tools/test_machine_code_profile2_loop.py
      - name: Every checked-library kernel rechecked at its recorded cost
        run: python3 -B tools/test_machine_code_library.py
      - name: Arithmetic contracts lowered to profile 2, refused by named bridge, or checked
        run: python3 -B tools/test_machine_code_contracts.py
      - name: Profile-3 memory decoder, admission refusals and counterexample controls
        run: python3 -B tools/test_machine_code_profile3_verifier.py
      - name: Profile-3 search, emission, replay and the memory-kernel library
        run: python3 -B tools/test_machine_code_profile3_loop.py
      - name: Exact specialization with a Z3 proof, and checker-accepted specialized kernels
        run: |
          python3 -B tools/test_machine_code_specialize.py
          python3 -O -B tools/test_machine_code_specialize.py
      - name: Per-result backward slices, each checked as a one-result kernel
        run: |
          python3 -B tools/test_machine_code_slice.py
          python3 -O -B tools/test_machine_code_slice.py
      - name: Optimized Python keeps the same guards
        run: |
          python3 -O -B tools/test_machine_code_verifier.py
          python3 -O -B tools/test_machine_code_loop.py
          python3 -O -B tools/test_zal_word_kernel.py
          python3 -O -B tools/test_zal_word_kernel2.py
          python3 -O -B tools/test_machine_code_profile2_verifier.py
          python3 -O -B tools/test_machine_code_profile2_loop.py
          python3 -O -B tools/test_machine_code_library.py
          python3 -O -B tools/test_machine_code_contracts.py
          python3 -O -B tools/test_machine_code_profile3_verifier.py
          python3 -O -B tools/test_machine_code_profile3_loop.py
      - name: Actual x86 execution, assembler and RV64I object correspondence
        run: python3 -B tools/test_machine_code_native.py
      - name: Every admitted x86 form against the concrete and SMT models on this CPU
        run: python3 -B tools/test_machine_code_conformance.py
      - name: Actual x86 execution of emitted profile-2 kernels, including two-word results
        run: python3 -B tools/test_machine_code_profile2_native.py
      - name: Every x86 library kernel run natively against the integer reference, and the scoped timing table
        run: |
          python3 -B tools/test_machine_code_library_native.py
          python3 -O -B tools/test_machine_code_library_native.py
      - name: Every x86 memory kernel run natively on aligned, disjoint buffers against the integer reference
        run: |
          python3 -B tools/test_machine_code_profile3_native.py
          python3 -O -B tools/test_machine_code_profile3_native.py
      - name: Every admitted profile-2 x86 form, with CF/ZF/SF/OF, against the models on this CPU
        run: python3 -B tools/test_machine_code_profile2_conformance.py

  checker-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install the hash-pinned experimental checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/machine-code-venv"
          "$RUNNER_TEMP/machine-code-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r tools/machine_code_requirements.txt
          printf '%s\n' "$RUNNER_TEMP/machine-code-venv/bin" >> "$GITHUB_PATH"
      - name: Planted-defect campaign outcome classes on small specimens
        run: |
          python3 -B tools/test_machine_qualification_controls.py
          python3 -O -B tools/test_machine_qualification_controls.py
      - name: Every registered checker defect detected by its intended control under -B and -O -B
        run: python3 -B -m tools.machine_qualification.controls run --out "$RUNNER_TEMP/machine-checker-controls.json"

  rv64i-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install the hash-pinned experimental checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/machine-code-venv"
          "$RUNNER_TEMP/machine-code-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r tools/machine_code_requirements.txt
          printf '%s\n' "$RUNNER_TEMP/machine-code-venv/bin" >> "$GITHUB_PATH"
      - name: Install the RISC-V user-mode emulator and cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-user gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross
          dpkg-query --show qemu-user gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross
          qemu-riscv64 --version | head -n 1
      - name: Every admitted RV64I form against the concrete and SMT models under QEMU
        env:
          ZENO_MACHINE_REQUIRE_RV64I: '1'
        run: python3 -B tools/test_machine_code_rv64i_conformance.py
