name: adopter-acceptance

on:
  # Manual runs replay the component evidence; with portfolio set they run the complete
  # adopter portfolio, so a fix head can be checked on a branch that triggers nothing else.
  workflow_dispatch:
    inputs:
      portfolio:
        description: Run the complete adopter acceptance portfolio instead of the component replay
        type: boolean
        default: false
      scenarios:
        description: With portfolio, run only these space-separated scenario IDs (empty runs every scenario)
        type: string
        default: ""
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: adopter-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # Keep unrelated process-spawning tests from inheriting a journey's file lock.
  # Tests that exercise concurrency explicitly still run those operations.
  RUST_TEST_THREADS: "1"
  # Match the native CI stack used by the complete workspace test step.
  RUST_MIN_STACK: "33554432"
  # Use the same native profile as local acceptance, retaining runtime checks.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"

jobs:
  rc3-product-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # Optimize exhaustive tests while retaining their assertion and overflow checks.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Fetch the pinned historical evaluator source
        # The copy check compares against this exact released commit.
        # A depth-one checkout of the candidate does not contain it.
        run: |
          git fetch --no-tags --depth=1 origin 8c444487f96d6acd14c9f7fa55d9ba88ca780fb6

      - name: Keep build output outside the source inventory
        # The knowledge guard scans ignored files too. Compiler caches and
        # generated test projects do not belong in its bounded source inventory.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/adopter-target" >> "$GITHUB_ENV"

      - name: Establish contained checker runtime
        uses: ./.github/actions/checker-containment

      - name: Install the two pinned Lean proof runtimes
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        env:
          ELAN_HOME: ${{ runner.temp }}/lean-proof-tools/elan
        run: |
          # These runtimes expand to about 5.4 GiB together. Android is outside
          # this job's tool closure and can be removed from this ephemeral runner.
          if (( $(df -k --output=avail "$RUNNER_TEMP" | tail -n 1) < 20 * 1024 * 1024 )); then
            sudo rm -rf /usr/local/lib/android
          fi
          test "$(df -k --output=avail "$RUNNER_TEMP" | tail -n 1)" -ge $((8 * 1024 * 1024))
          tools="$RUNNER_TEMP/lean-proof-tools"
          mkdir -p "$tools/installer"
          cd "$tools"
          check_archive() {
            local archive="$1" expected
            expected="$(awk -v name="$archive" '$2 == name {print $1}' \
              "$GITHUB_WORKSPACE/release/lean-proof-tools-linux-x86_64.sha256")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          }
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output elan-x86_64-unknown-linux-gnu.tar.gz
          check_archive elan-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz -C installer
          installer/elan-init -y --default-toolchain none --no-modify-path
          versions="$(PYTHONPATH="$GITHUB_WORKSPACE/tools" python3 -c \
            'from check_lean_proofs import VERSIONS; import re; assert VERSIONS and len(set(VERSIONS)) == len(VERSIONS) and all(re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v) for v in VERSIONS); print(*VERSIONS)')"
          for version in $versions; do
            archive="lean-$version-linux.tar.zst"
            curl --fail --location --silent --show-error \
              "https://github.com/leanprover/lean4/releases/download/v$version/$archive" \
              --output "$archive"
            check_archive "$archive"
            tar --zstd -xf "$archive"
            "$ELAN_HOME/bin/elan" toolchain link "leanprover/lean4:v$version" "$tools/lean-$version-linux"
            "$ELAN_HOME/bin/elan" run "leanprover/lean4:v$version" lean --version
            rm "$archive"
          done
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Fetch locked crates for offline repository tools
        uses: ./.github/actions/fetch-locked-crates

      - name: Fetch the published 2.6.0 executable and source for released-26-compatibility
        # The scenario meets stores and an adoption made by the published 2.6.0 CLI. It needs that
        # executable and an unmodified v2.6.0 checkout, kept outside this checkout, and the crates
        # locked by 2.6.0 for its offline cargo metadata.
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/released-26"
          mkdir -p "$base/download" "$base/extracted"
          curl --fail --location --silent --show-error \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v2.6.0/zeno-fcis-2.6.0-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$base/download/archive.tar.gz"
          printf '%s  %s\n' 254640ea741ced298b72058f253edd410706573bed2b0609764b8f0b4a1b4a29 \
            "$base/download/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$base/download/archive.tar.gz" -C "$base/extracted" --no-same-owner --no-same-permissions
          cli="$base/extracted/zeno-fcis-2.6.0-x86_64-unknown-linux-gnu/zeno-fcis"
          test -f "$cli" && test ! -L "$cli"
          printf '%s  %s\n' ce6f0c037c92d9c1c8ec1358e259239f133828e76f583cdc97441ee995f01227 "$cli" \
            | sha256sum --check --strict
          chmod 0755 "$cli"
          git init -q "$base/v260"
          git -C "$base/v260" fetch -q --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            7d175c47099866939c86acd463ac85219abba882
          git -C "$base/v260" checkout -q --detach FETCH_HEAD
          test "$(git -C "$base/v260" rev-parse HEAD)" = 7d175c47099866939c86acd463ac85219abba882
          cargo +1.97.1 fetch --locked --manifest-path "$base/v260/Cargo.toml"
          printf 'ZENO_FCIS_RELEASED_26_CLI=%s\nZENO_FCIS_RELEASED_26_SOURCE=%s\n' "$cli" "$base/v260" >> "$GITHUB_ENV"

      - name: Install pinned Node
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked guardrail tooling without lifecycle scripts
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        run: npm ci --ignore-scripts

      - name: Prove hostile acceptance bindings fail closed
        run: python3 tools/atdd.py self-test

      - name: Check exact BDD to ATDD registry
        run: python3 tools/atdd.py check

      - name: Prepare genuine tools for mandatory certificate acceptance
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/certificate-checker-target
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.3/cvc5-Linux-x86_64-static.zip \
            --output cvc5-Linux-x86_64-static.zip
          sha256sum --check --ignore-missing "$GITHUB_WORKSPACE/release/formal-tools-linux-x86_64.sha256"
          unzip -q cvc5-Linux-x86_64-static.zip -d cvc5-certificate
          python3 "$GITHUB_WORKSPACE/tools/symbolic_certificate_checker/build.py" \
            --build-dir "$RUNNER_TEMP/certificate-checker"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          directory = temporary / 'certificate-checker'
          build = json.loads((directory / 'BUILD.json').read_text())
          manifest = {'schema': 'zeno-fcis/certificate-checker/1',
                      'path': build['executable'], 'sha256': build['sha256'],
                      'timeout_ms': 10000, 'max_output_bytes': 1048576}
          checker = directory / 'checker.json'
          checker.write_text(json.dumps(manifest) + '\n')
          cvc5 = temporary / 'cvc5-certificate/cvc5-Linux-x86_64-static/bin/cvc5'
          if not cvc5.is_file(): raise SystemExit('pinned CVC5 executable missing')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ZENO_FCIS_CVC5={cvc5}\nZENO_FCIS_CERTIFICATE_CHECKER={checker}\n')
          PY

      - name: Install pinned OCaml for the scalar consumer profile
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ocaml=4.14.1-1ubuntu1 ocaml-base=4.14.1-1ubuntu1 ocaml-interp=4.14.1-1ubuntu1 \
            libstdlib-ocaml=4.14.1-1ubuntu1 libstdlib-ocaml-dev=4.14.1-1ubuntu1 \
            libcompiler-libs-ocaml-dev=4.14.1-1ubuntu1
          sha256sum --check --strict release/ocaml-4.14.1-ubuntu-24.04-amd64.sha256
          test "$(/usr/bin/ocamlopt -version)" = 4.14.1
          gcc --version | head -n 1
          ld --version | head -n 1

      - name: Install pinned bubblewrap for the native worker host check
        # native-worker-host pins /usr/bin/bwrap as a core runtime file; the image does not ship it.
        # Ubuntu 24.04 may restrict unprivileged user namespaces. The stock bwrap profile from
        # apparmor-profiles (disabled by default) lets bwrap create its namespaces while its children
        # keep no capabilities; it is loaded only when the restriction is enforced.
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap=0.9.0-1ubuntu0.3 apparmor-profiles=4.0.1really4.0.1-0ubuntu0.24.04.9
          sha256sum --check --strict <<'SUMS'
          e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71  /usr/bin/bwrap
          11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9  /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          SUMS
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          fi
          /usr/bin/bwrap --version

      - name: Install the hash-pinned experimental machine-code checker
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/machine-code-venv"
          "$RUNNER_TEMP/machine-code-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r tools/machine_code_requirements.txt
          printf '%s\n' "$RUNNER_TEMP/machine-code-venv/bin" >> "$GITHUB_PATH"

      - name: Run complete adopter acceptance portfolio
        if: github.event_name != 'workflow_dispatch' || inputs.portfolio
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          if [ -z "${SCENARIOS:-}" ]; then
            python3 tools/atdd.py run --all
          else
            # A manual run for a fix head: the listed scenarios only; the registry refuses unknown IDs.
            for scenario in $SCENARIOS; do
              python3 tools/atdd.py run --scenario "$scenario"
            done
          fi

      - name: Replay current component certificates
        if: github.event_name == 'workflow_dispatch' && !inputs.portfolio
        run: python3 tools/atdd.py run --scenario core-component-families

      - name: Report knowledge inventory failures
        if: failure()
        run: python3 -B tools/check_knowledge_files.py

      - name: Retain component-check diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-check-diagnostics-${{ github.sha }}
          path: /tmp/zeno-fcis-core-families-*/qualification/*.log
          if-no-files-found: ignore
