name: adopter-acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: adopter-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc3-product-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # Optimize exhaustive tests while retaining their assertion and overflow checks.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Establish contained checker runtime
        uses: ./.github/actions/checker-containment

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Fetch locked crates for offline repository tools
        uses: ./.github/actions/fetch-locked-crates

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked guardrail tooling without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prove hostile acceptance bindings fail closed
        run: python3 tools/atdd.py self-test

      - name: Check exact BDD to ATDD registry
        run: python3 tools/atdd.py check

      - name: Prepare genuine tools for mandatory certificate acceptance
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/certificate-checker-target
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.3/cvc5-Linux-x86_64-static.zip \
            --output cvc5-Linux-x86_64-static.zip
          sha256sum --check --ignore-missing "$GITHUB_WORKSPACE/release/formal-tools-linux-x86_64.sha256"
          unzip -q cvc5-Linux-x86_64-static.zip -d cvc5-certificate
          python3 "$GITHUB_WORKSPACE/tools/symbolic_certificate_checker/build.py" \
            --build-dir "$RUNNER_TEMP/certificate-checker"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          directory = temporary / 'certificate-checker'
          build = json.loads((directory / 'BUILD.json').read_text())
          manifest = {'schema': 'zeno-fcis/certificate-checker/1',
                      'path': build['executable'], 'sha256': build['sha256'],
                      'timeout_ms': 10000, 'max_output_bytes': 1048576}
          checker = directory / 'checker.json'
          checker.write_text(json.dumps(manifest) + '\n')
          cvc5 = temporary / 'cvc5-certificate/cvc5-Linux-x86_64-static/bin/cvc5'
          if not cvc5.is_file(): raise SystemExit('pinned CVC5 executable missing')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ZENO_FCIS_CVC5={cvc5}\nZENO_FCIS_CERTIFICATE_CHECKER={checker}\n')
          PY

      - name: Install pinned OCaml for the scalar consumer profile
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ocaml=4.14.1-1ubuntu1 ocaml-base=4.14.1-1ubuntu1 ocaml-interp=4.14.1-1ubuntu1 \
            libstdlib-ocaml=4.14.1-1ubuntu1 libstdlib-ocaml-dev=4.14.1-1ubuntu1 \
            libcompiler-libs-ocaml-dev=4.14.1-1ubuntu1
          sha256sum --check --strict release/ocaml-4.14.1-ubuntu-24.04-amd64.sha256
          test "$(/usr/bin/ocamlopt -version)" = 4.14.1
          gcc --version | head -n 1
          ld --version | head -n 1

      - name: Run complete adopter acceptance portfolio
        run: python3 tools/atdd.py run --all
