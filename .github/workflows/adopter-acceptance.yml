name: adopter-acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: adopter-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc2-product-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked guardrail tooling without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prove hostile acceptance bindings fail closed
        run: python3 tools/atdd.py self-test

      - name: Check exact BDD to ATDD registry
        run: python3 tools/atdd.py check

      - name: Run complete adopter acceptance portfolio
        run: python3 tools/atdd.py run --all
