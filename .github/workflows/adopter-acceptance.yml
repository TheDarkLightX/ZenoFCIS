name: adopter-acceptance

on:
  # Manual reruns cover the component evidence refresh without repeating ATDD.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: adopter-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Keep unrelated process-spawning tests from inheriting a journey's file lock.
  # Tests that exercise concurrency explicitly still run those operations.
  RUST_TEST_THREADS: "1"
  # Use the same native profile as local acceptance, retaining runtime checks.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"

jobs:
  rc3-product-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # Optimize exhaustive tests while retaining their assertion and overflow checks.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Fetch the pinned historical evaluator source
        # The copy check compares against this exact released commit.
        # A depth-one checkout of the candidate does not contain it.
        run: |
          git fetch --no-tags --depth=1 origin 8c444487f96d6acd14c9f7fa55d9ba88ca780fb6

      - name: Establish contained checker runtime
        uses: ./.github/actions/checker-containment

      - name: Install the two pinned Lean proof runtimes
        if: github.event_name != 'workflow_dispatch'
        env:
          ELAN_HOME: ${{ runner.temp }}/lean-proof-tools/elan
        run: |
          # These runtimes expand to about 5.4 GiB together. Android is outside
          # this job's tool closure and can be removed from this ephemeral runner.
          if (( $(df -k --output=avail "$RUNNER_TEMP" | tail -n 1) < 20 * 1024 * 1024 )); then
            sudo rm -rf /usr/local/lib/android
          fi
          test "$(df -k --output=avail "$RUNNER_TEMP" | tail -n 1)" -ge $((8 * 1024 * 1024))
          tools="$RUNNER_TEMP/lean-proof-tools"
          mkdir -p "$tools/installer"
          cd "$tools"
          check_archive() {
            local archive="$1" expected
            expected="$(awk -v name="$archive" '$2 == name {print $1}' \
              "$GITHUB_WORKSPACE/release/lean-proof-tools-linux-x86_64.sha256")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          }
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output elan-x86_64-unknown-linux-gnu.tar.gz
          check_archive elan-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz -C installer
          installer/elan-init -y --default-toolchain none --no-modify-path
          versions="$(PYTHONPATH="$GITHUB_WORKSPACE/tools" python3 -c \
            'from check_lean_proofs import VERSIONS; import re; assert VERSIONS and len(set(VERSIONS)) == len(VERSIONS) and all(re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v) for v in VERSIONS); print(*VERSIONS)')"
          for version in $versions; do
            archive="lean-$version-linux.tar.zst"
            curl --fail --location --silent --show-error \
              "https://github.com/leanprover/lean4/releases/download/v$version/$archive" \
              --output "$archive"
            check_archive "$archive"
            tar --zstd -xf "$archive"
            "$ELAN_HOME/bin/elan" toolchain link "leanprover/lean4:v$version" "$tools/lean-$version-linux"
            "$ELAN_HOME/bin/elan" run "leanprover/lean4:v$version" lean --version
            rm "$archive"
          done
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Fetch locked crates for offline repository tools
        uses: ./.github/actions/fetch-locked-crates

      - name: Install pinned Node
        if: github.event_name != 'workflow_dispatch'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked guardrail tooling without lifecycle scripts
        if: github.event_name != 'workflow_dispatch'
        run: npm ci --ignore-scripts

      - name: Prove hostile acceptance bindings fail closed
        run: python3 tools/atdd.py self-test

      - name: Check exact BDD to ATDD registry
        run: python3 tools/atdd.py check

      - name: Prepare genuine tools for mandatory certificate acceptance
        if: github.event_name != 'workflow_dispatch'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/certificate-checker-target
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.3/cvc5-Linux-x86_64-static.zip \
            --output cvc5-Linux-x86_64-static.zip
          sha256sum --check --ignore-missing "$GITHUB_WORKSPACE/release/formal-tools-linux-x86_64.sha256"
          unzip -q cvc5-Linux-x86_64-static.zip -d cvc5-certificate
          python3 "$GITHUB_WORKSPACE/tools/symbolic_certificate_checker/build.py" \
            --build-dir "$RUNNER_TEMP/certificate-checker"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          directory = temporary / 'certificate-checker'
          build = json.loads((directory / 'BUILD.json').read_text())
          manifest = {'schema': 'zeno-fcis/certificate-checker/1',
                      'path': build['executable'], 'sha256': build['sha256'],
                      'timeout_ms': 10000, 'max_output_bytes': 1048576}
          checker = directory / 'checker.json'
          checker.write_text(json.dumps(manifest) + '\n')
          cvc5 = temporary / 'cvc5-certificate/cvc5-Linux-x86_64-static/bin/cvc5'
          if not cvc5.is_file(): raise SystemExit('pinned CVC5 executable missing')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ZENO_FCIS_CVC5={cvc5}\nZENO_FCIS_CERTIFICATE_CHECKER={checker}\n')
          PY

      - name: Install pinned OCaml for the scalar consumer profile
        if: github.event_name != 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ocaml=4.14.1-1ubuntu1 ocaml-base=4.14.1-1ubuntu1 ocaml-interp=4.14.1-1ubuntu1 \
            libstdlib-ocaml=4.14.1-1ubuntu1 libstdlib-ocaml-dev=4.14.1-1ubuntu1 \
            libcompiler-libs-ocaml-dev=4.14.1-1ubuntu1
          sha256sum --check --strict release/ocaml-4.14.1-ubuntu-24.04-amd64.sha256
          test "$(/usr/bin/ocamlopt -version)" = 4.14.1
          gcc --version | head -n 1
          ld --version | head -n 1

      - name: Run complete adopter acceptance portfolio
        if: github.event_name != 'workflow_dispatch'
        run: python3 tools/atdd.py run --all

      - name: Replay current component certificates
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/atdd.py run --scenario core-component-families

      - name: Retain component-check diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-check-diagnostics-${{ github.sha }}
          path: /tmp/zeno-fcis-core-families-*/qualification/*.log
          if-no-files-found: ignore
