name: synthesis-platforms

on:
  pull_request:
  push:
    branches: [main, "platform/**"]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: cargo +1.97.1 test --locked -p zeno-fcis-cli -p zeno-fcis-formal-tools
      - run: cargo +1.97.1 test --locked -p zeno-fcis-cli --test synthesis_javascript -- --ignored
      - run: cargo +1.97.1 clippy --locked -p zeno-fcis-cli -p zeno-fcis-formal-tools --all-targets -- -D warnings
      - run: python3 tools/check_synthesis.py
