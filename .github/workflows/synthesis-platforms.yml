name: synthesis-platforms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".node-version"
      - "test-data/synthesis/**"
      - "tools/check_synthesis_platform.py"
      - ".github/workflows/synthesis-platforms.yml"
  push:
    branches: ["release/2.6.0"]

permissions:
  contents: read

concurrency:
  group: synthesis-platforms-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "3"

jobs:
  native-conformance:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Fetch locked dependencies
        run: cargo +1.97.1 fetch --locked
      - name: Native synthesis and process supervision tests
        run: >-
          cargo +1.97.1 test --locked --offline -p zeno-fcis-cli
          --bin zeno-fcis synth:: -- --test-threads=2
      - name: Native formal-tool tests
        run: cargo +1.97.1 test --locked --offline -p zeno-fcis-formal-tools -- --test-threads=2
      - name: Required JavaScript conformance tests
        run: cargo +1.97.1 test --locked --offline -p zeno-fcis-cli --test synthesis_javascript -- --ignored --test-threads=2
      - name: Build the native CLI
        run: cargo +1.97.1 build --locked --offline -p zeno-fcis-cli --bin zeno-fcis
      - name: Replay conformance and refusal controls
        run: python3 tools/check_synthesis_platform.py --cli target/debug/zeno-fcis --out "$RUNNER_TEMP/synthesis-conformance"
      - name: Clippy
        run: cargo +1.97.1 clippy --locked --offline -p zeno-fcis-cli -p zeno-fcis-formal-tools --all-targets -- -D warnings
      - name: Retain native conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-synthesis-conformance
          path: ${{ runner.temp }}/synthesis-conformance
          if-no-files-found: warn
