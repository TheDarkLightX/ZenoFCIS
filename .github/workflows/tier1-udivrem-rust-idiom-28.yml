name: tier1-udivrem-rust-idiom-28
on:
  push:
    branches: [research/2.8-tier1-cranelift-performance-20261102]
    paths:
      - '.github/workflows/tier1-udivrem-rust-idiom-28.yml'
      - 'experiments/cranelift-tier1/idiom_divrem_28.rs'
      - 'experiments/cranelift-tier1/qualify_rust_divrem_28.py'
      - 'experiments/cranelift-tier1/recheck_rust_divrem_28.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-udivrem-rust-idiom-28
  cancel-in-progress: true
jobs:
  rust-generated-wasm-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Pinned Rust target and independently formulated oracle preflights
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          python3 -m py_compile experiments/cranelift-tier1/{qualify_rust_divrem_28,recheck_rust_divrem_28}.py
          python3 -B experiments/cranelift-tier1/qualify_rust_divrem_28.py --self-test
          python3 -B experiments/cranelift-tier1/recheck_rust_divrem_28.py --self-test
          mkdir -p tier1-rust-divrem
          git rev-parse HEAD > tier1-rust-divrem/zenofcis-head.txt
          rustc --version
      - name: Retrieve previously qualified exact-source baseline and patched compilers
        uses: actions/download-artifact@v4
        with:
          repository: TheDarkLightX/ZenoFCIS
          run-id: 42596373104
          github-token: ${{ github.token }}
          name: tier1-udivrem-same-wasm-dualresult-28
          path: tier1-rust-divrem/source
      - name: Verify compiler hashes and compare real Rust-generated Wasm under original/patched Cranelift
        run: |
          set -euo pipefail
          chmod u+x tier1-rust-divrem/source/tier1-dual-same-wasm/{baseline,patched}/wasmtime
          python3 -B experiments/cranelift-tier1/qualify_rust_divrem_28.py \
            --archive tier1-rust-divrem/source/tier1-dual-same-wasm \
            --out tier1-rust-divrem/results
      - name: Independently replay hashes, native cost and fresh finite arithmetic witnesses
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/recheck_rust_divrem_28.py \
            --archive tier1-rust-divrem/source/tier1-dual-same-wasm \
            --results tier1-rust-divrem/results | tee tier1-rust-divrem/independent-recheck.json
      - name: Preserve the exact Wasm, CLIF, native objects and proof/cost receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-udivrem-rust-idiom-28
          path: |
            tier1-rust-divrem/zenofcis-head.txt
            tier1-rust-divrem/results
            tier1-rust-divrem/independent-recheck.json
            experiments/cranelift-tier1/idiom_divrem_28.rs
            experiments/cranelift-tier1/qualify_rust_divrem_28.py
            experiments/cranelift-tier1/recheck_rust_divrem_28.py
          if-no-files-found: warn
          retention-days: 30
