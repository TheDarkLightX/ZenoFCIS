name: ecosystem-features

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: SHA-256 provider matrix
        run: |
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features rustcrypto --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features libcrux --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-crypto --no-default-features --features parity --locked --target wasm32-unknown-unknown
          cargo +1.97.1 test -p zeno-fcis-crypto --all-features --locked

      - name: Synthesis and backend matrix
        run: |
          cargo +1.97.1 check -p zeno-fcis-synthesis --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis-backend --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 test -p zeno-fcis-backend --all-features --locked

      - name: Umbrella feature matrix
        run: |
          cargo +1.97.1 check -p zeno-fcis --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features schema --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features synthesis --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features backend --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --features codegen --locked
          cargo +1.97.1 check -p zeno-fcis --features mounted-runtime --locked
          cargo +1.97.1 check -p zeno-fcis --features mounted-zenodex --locked
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features rustcrypto-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features verified-sha256 --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features sha256-parity --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --features full --locked
