name: sha256-provider-cleanup

on:
  push:
    branches:
      - agent/sha256-providers-v1
    paths:
      - ".github/workflows/sha256-provider-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/sha256-providers-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-shot assembly artifacts
        run: |
          git config user.name 'ZenoFCIS SHA-256 cleanup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/sha256-provider-assemble.yml \
            .github/workflows/sha256-provider-cleanup.yml \
            .github/workflows/sha256-provider-assemble.trigger \
            docs/PR4_SHA256_SCOPE.md \
            docs/PR4_SHA256_IMPLEMENTATION.md \
            docs/PR4_SHA256_VALIDATION.md
          git commit -m 'chore: remove SHA-256 assembly artifacts'
          git push origin HEAD:agent/sha256-providers-v1
