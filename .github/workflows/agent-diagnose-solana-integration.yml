name: agent-diagnose-solana-integration

on:
  push:
    branches:
      - agent/solana-fcis-v1-20260727
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
          ref: agent/solana-fcis-v1-20260727

      - name: Record exact transformation counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("crates/zeno-fcis-codegen/src/solana_anchor.rs").read_text(encoding="utf-8")
          codegen = Path("crates/zeno-fcis-codegen/src/lib.rs").read_text(encoding="utf-8")
          umbrella = Path("crates/zeno-fcis/src/lib.rs").read_text(encoding="utf-8")
          pattern = re.compile(
              r'\n    let shell_source = files\n'
              r'        \.iter\(\)\n'
              r'        \.find\(\|file\| file\.path\(\)\.ends_with\("programs/"\)\)\n'
              r'        \.map\(GeneratedOnchainFile::content\);\n'
              r'    if !inspect_solana_core_source\(core_source\)\.is_clean\(\) \|\| shell_source\.is_some\(\) \{\n'
              r'        return Err\(OnchainModelError::InvalidBinding\);\n'
              r'    \}\n'
          )
          rows = {
              "unsafe_core": source.count('(\"unsafe\", SolanaCoreSafetyFindingKind::UnsafeCode),'),
              "unsafe_shell": source.count('(\"unsafe\", SolanaShellSafetyFindingKind::UnsafeCode),'),
              "redundant_shell_lookup": len(pattern.findall(source)),
              "import_marker": source.count('ProjectCore, State, MACHINE_HASH}};'),
              "hardcoded_version": source.count('state.version = 1;'),
              "effect_builder": source.count('-> EffectPlan {{\\n    EffectPlan {{'),
              "encode_start": source.count('fn encode_bytes32('),
              "rust_type_start": source.count('\\nfn rust_type'),
              "map_method": source.count('.map(u8::to_string)'),
              "codegen_module": codegen.count('mod solana_anchor;'),
              "codegen_export": codegen.count('pub use solana_anchor::{'),
              "umbrella_export": umbrella.count('SOLANA_ANCHOR_GENERATOR_ID'),
          }
          Path(".agent-diagnostics").mkdir(exist_ok=True)
          Path(".agent-diagnostics/solana-integration.txt").write_text(
              "\n".join(f"{key}={value}" for key, value in rows.items()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-diagnostics/solana-integration.txt
          git commit -m "Capture Solana integration diagnostics"
          git push origin HEAD:agent/solana-fcis-v1-20260727
