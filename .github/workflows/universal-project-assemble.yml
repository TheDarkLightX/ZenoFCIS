name: universal-project-assemble

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: universal-project-assemble-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout ZenoFCIS branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/universal-project-runtime-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact mounted ZenoDEX revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: TheDarkLightX/ZenoDEX
          ref: e3cf1aad40e487893230ae0c55f1f0dda62f9955
          path: integration/zenodex
          persist-credentials: false

      - name: Install pinned current stable Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Normalize ZenoFCIS source and lockfile
        run: |
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 fmt --all

      - name: Verify ZenoFCIS universal layer
        run: |
          cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-features --locked
          cargo +1.97.1 test --workspace --doc --all-features --locked
          cargo +1.97.1 check -p zeno-fcis-project --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --features mounted-runtime --locked
          cargo +1.97.1 check -p zeno-fcis --features mounted-zenodex --locked
          RUSTDOCFLAGS='-D warnings' cargo +1.97.1 doc --workspace --all-features --locked --no-deps

      - name: Check exact mounted ZenoDEX formatting
        run: cargo +1.97.1 fmt --manifest-path integration/zenodex/rust-runtime/Cargo.toml --all -- --check

      - name: Lint exact mounted ZenoDEX Rust workspace
        run: cargo +1.97.1 clippy --manifest-path integration/zenodex/rust-runtime/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test exact mounted ZenoDEX Rust workspace
        run: cargo +1.97.1 test --manifest-path integration/zenodex/rust-runtime/Cargo.toml --workspace --locked

      - name: Commit validated ZenoFCIS formatting and lockfile
        run: |
          git config user.name 'ZenoFCIS universal project assembler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Cargo.lock \
            crates/zeno-fcis-project \
            crates/zeno-fcis-adapter \
            crates/zeno-fcis-adapter-zenodex \
            crates/zeno-fcis \
            tools/check_assurance.py \
            docs/UNIVERSAL_PROJECT_PROFILES.md \
            .github/workflows/ci.yml \
            .github/workflows/ecosystem-features.yml
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'feat: generalize project profiles and mounted runtimes'
          git push origin HEAD:agent/universal-project-runtime-v1
