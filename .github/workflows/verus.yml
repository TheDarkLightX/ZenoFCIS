name: verus

on:
  pull_request:
    paths:
      - "crates/zeno-fcis-authority/**"
      - "crates/zeno-fcis-synthesis/**"
      - "verification/verus/**"
      - "tools/check_verus.py"
      - "tools/test_check_verus.py"
      - "tools/check_finite_execution.py"
      - "tools/test_check_finite_execution.py"
      - "tools/check_metered_execution.py"
      - "tools/test_check_metered_execution.py"
      - "tools/check_canonical_bytes.py"
      - "tools/test_check_canonical_bytes.py"
      - "tools/check_protected_input.py"
      - "tools/test_check_protected_input.py"
      - "tools/check_record_execution.py"
      - "tools/test_check_record_execution.py"
      - "tools/verus_coverage.py"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/verus.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-runtime-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install application and verifier toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install 1.98.1 --profile minimal
      - name: Check receipt admission and native runtime boundaries
        run: |
          python3 tools/test_check_verus.py
          python3 tools/test_check_finite_execution.py
          python3 tools/test_check_metered_execution.py
          python3 tools/test_check_canonical_bytes.py
          python3 tools/test_check_protected_input.py
          python3 tools/test_check_record_execution.py
      - name: Verify shared Rust and require mutation failures
        run: python3 tools/check_verus.py --install --out "${{ runner.temp }}/verus-evidence.json"
      - name: Verify finite admission and execution with contract coverage
        run: python3 tools/check_finite_execution.py --out "${{ runner.temp }}/finite-execution-evidence.json"
      - name: Verify V2 metering and reviewed operation order
        run: python3 tools/check_metered_execution.py --out "${{ runner.temp }}/metered-execution-evidence.json"
      - name: Verify V2 integer byte interpretation and refusal bounds
        run: python3 tools/check_canonical_bytes.py --out "${{ runner.temp }}/canonical-byte-evidence.json"
      - name: Verify protected record projection and retained access reports
        run: python3 tools/check_protected_input.py --out "${{ runner.temp }}/protected-input-evidence.json"
      - name: Verify original records, exact ABI binding and shared metered execution
        run: python3 tools/check_record_execution.py --out "${{ runner.temp }}/record-execution-evidence.json"
      - name: Check no-std authority compatibility
        run: cargo +1.97.1 check -p zeno-fcis-authority -p zeno-fcis-synthesis --no-default-features --locked
      - name: Retain scoped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verus-evidence
          path: |
            ${{ runner.temp }}/verus-evidence.json
            ${{ runner.temp }}/finite-execution-evidence.json
            ${{ runner.temp }}/metered-execution-evidence.json
            ${{ runner.temp }}/canonical-byte-evidence.json
            ${{ runner.temp }}/protected-input-evidence.json
            ${{ runner.temp }}/record-execution-evidence.json
          if-no-files-found: warn
