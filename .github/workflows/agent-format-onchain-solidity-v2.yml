name: agent-format-onchain-solidity-v2

on:
  push:
    branches:
      - agent/solidity-fcis-v1-20260727

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
          ref: agent/solidity-fcis-v1-20260727

      - name: Apply integration repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/zeno-fcis-codegen/src/solidity.rs")
          text = path.read_text(encoding="utf-8")
          old = 'pub const SOLIDITY_PRAGMA: &str = ">=0.8.24 <0.9.0";'
          new = 'pub const SOLIDITY_PRAGMA: &str = "0.8.35";'
          if old not in text:
              raise SystemExit("legacy Solidity pragma not found")
          path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("crates/zeno-fcis-codegen/src/solidity_advanced.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    render_execute(&mut output, machine, event_capacity, effect_capacity)?;":
                  "    render_execute(&mut output);",
              '''fn render_execute(
              output: &mut String,
              machine: &OnchainMachineSpec,
              event_capacity: usize,
              effect_capacity: usize,
          ) -> Result<(), OnchainModelError> {''':
                  '''fn render_execute(output: &mut String) {''',
              '    output.push_str("        unchecked { _sequence += 1; }\\n");':
                  '    output.push_str("        _sequence += 1;\\n");',
              '''
              let _ = (machine, event_capacity, effect_capacity);
              Ok(())
          }''':
                  '''
          }''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"advanced Solidity repair not found: {old[:60]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "content-addressed generation manifests, and a bounded effect-free Solidity FCIS scaffold generator;"
          new = "content-addressed generation manifests, a shared chain-neutral on-chain machine model, and bounded Solidity FCIS generators with capability-typed effects;"
          if old not in text:
              raise SystemExit("README generator description not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Install pinned formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +1.97.1 fmt --all

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md crates/zeno-fcis-codegen/src crates/zeno-fcis/src/lib.rs docs/ONCHAIN_FCIS_GENERATION.md
          git commit -m "Format and integrate advanced Solidity generator"
          git push origin HEAD:agent/solidity-fcis-v1-20260727
