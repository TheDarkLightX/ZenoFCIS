name: tier1-post-souper-verifier-gate-28
on:
  push:
    branches: [research/2.8-tier1-verifier-gating-20261117]
    paths:
      - '.github/workflows/tier1-post-souper-verifier-gate-28.yml'
      - 'experiments/cranelift-tier1/measure_conditional_verifier_28.py'
      - 'experiments/cranelift-tier1/install_udivrem_combiner_28.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-post-souper-verifier-gate-28
  cancel-in-progress: true
jobs:
  pinned-compile-serialize-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Syntax, generated-WAT and five deliberate malformed-receipt controls
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/cranelift-tier1/measure_conditional_verifier_28.py
          python3 -B experiments/cranelift-tier1/post_souper_portability_28.py --mode self-test
          python3 -B experiments/cranelift-tier1/measure_conditional_verifier_28.py --mode self-test
      - name: Fetch exact previous independently qualified pristine and experimental compilers
        uses: actions/download-artifact@v4
        with:
          repository: TheDarkLightX/ZenoFCIS
          run-id: 44056104464
          github-token: ${{ github.token }}
          name: tier1-post-souper-divrem-28
          path: tier1-compile-envelope/source
      - name: Verify compiler bytes before restoring artifact executable permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'experiments/cranelift-tier1')
          from audit_post_souper_inprocess_28 import producer
          source = Path('tier1-compile-envelope/source')
          producer(source)
          for mode in ('baseline', 'patched'):
              path = source / mode / 'wasmtime'
              path.chmod(0o755)
          print('pinned compiler SHA-256 verified; ZIP-stripped executable permission restored')
          PY
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: 8b19f199f89da864c529b3fa3ca2f7e40d5de609 # Souper #15258 merge
          path: upstream
          persist-credentials: false
      - name: Install source-pinned conditional verifier experiment in detached Wasmtime checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-compile-envelope/conditional-source
          git rev-parse HEAD > tier1-compile-envelope/conditional-source/zenofcis-head.txt
          git -C upstream rev-parse HEAD > tier1-compile-envelope/conditional-source/wasmtime-head.txt
          python3 -B experiments/cranelift-tier1/post_souper_portability_28.py --mode preflight --upstream upstream
          python3 -B experiments/cranelift-tier1/post_souper_portability_28.py --mode install \
            --upstream upstream --out tier1-compile-envelope/conditional-source
          cp tier1-compile-envelope/conditional-source/install.json \
            tier1-compile-envelope/source/conditional-install.json
          git -C upstream diff --check
          git -C upstream diff -- \
            cranelift/codegen/src/context.rs \
            cranelift/codegen/meta/src/shared/instructions.rs \
            cranelift/codegen/src/isa/x64/lower.isle \
            cranelift/interpreter/src/step.rs > tier1-compile-envelope/conditional-source/compiler-patch.diff
          test -s tier1-compile-envelope/conditional-source/compiler-patch.diff
      - name: Build isolated conditional treatment compiler with pinned lock and Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustc -Vv > tier1-compile-envelope/conditional-source/rustc-version.txt
          cargo build --locked --manifest-path upstream/Cargo.toml -p wasmtime-cli \
            --bin wasmtime --no-default-features --features run,compile,wat,objdump \
            >tier1-compile-envelope/conditional-source/build.stdout \
            2>tier1-compile-envelope/conditional-source/build.stderr
          mkdir -p tier1-compile-envelope/source/conditional
          cp upstream/target/debug/wasmtime tier1-compile-envelope/source/conditional/wasmtime
      - name: Run controlled alternating compile plus serialize measurements
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/measure_conditional_verifier_28.py \
            --mode run --source-root tier1-compile-envelope/source \
            --out tier1-compile-envelope/measurements
      - name: Recalculate durations and reject changed WAT, compilers and native image digests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/measure_conditional_verifier_28.py \
            --mode audit --source-root tier1-compile-envelope/source \
            --out tier1-compile-envelope/measurements
      - name: Preserve exact source generation, AOT bytes and timing receipts on success/failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-post-souper-verifier-gate-28
          path: |
            tier1-compile-envelope/measurements/
            tier1-compile-envelope/conditional-source/
          retention-days: 30
          if-no-files-found: warn
