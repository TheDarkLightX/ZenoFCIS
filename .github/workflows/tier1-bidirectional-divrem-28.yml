name: tier1-bidirectional-divrem-28
on:
  push:
    branches: [research/2.8-tier1-bidirectional-divrem-20261118]
    paths:
      - '.github/workflows/tier1-bidirectional-divrem-28.yml'
      - 'experiments/cranelift-tier1/reverse_order_udivrem_28.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tier1-bidirectional-divrem-28
  cancel-in-progress: true
jobs:
  reverse-order-compiler-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Preflight reversible source patch, operand order and negative semantics
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/cranelift-tier1/reverse_order_udivrem_28.py
          python3 -B experiments/cranelift-tier1/reverse_order_udivrem_28.py --mode self-test
      - name: Recover pinned unmodified and former experimental compiler
        uses: actions/download-artifact@v4
        with:
          repository: TheDarkLightX/ZenoFCIS
          run-id: 44056104464
          github-token: \${{ github.token }}
          name: tier1-post-souper-divrem-28
          path: tier1-bidirectional-state/compilers
      - name: Verify compiler source and exact baseline SHA-256
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'experiments/cranelift-tier1')
          from audit_post_souper_inprocess_28 import producer
          root = Path('tier1-bidirectional-state/compilers')
          receipt = producer(root)
          assert receipt['compiler_pins']['baseline']['sha256'] == 'b9f0d8ffcb759369ac53d8cf51729438b775f8fe2c3b85edc9532b370ac109e1'
          for mode in ('baseline', 'patched'):
              (root / mode / 'wasmtime').chmod(0o755)
          print('Pinned baseline compiler and source receipt independently checked')
          PY
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bytecodealliance/wasmtime
          ref: 8b19f199f89da864c529b3fa3ca2f7e40d5de609
          path: upstream
          persist-credentials: false
      - name: Install experimental reverse-pair source changes in disposable checkout
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/reverse_order_udivrem_28.py --mode install \
            --upstream upstream --out tier1-bidirectional-state/compilers/bidirectional-install.json
          mkdir -p tier1-bidirectional-state/compiler-source
          cp tier1-bidirectional-state/compilers/bidirectional-install.json tier1-bidirectional-state/compiler-source/install.json
          git -C upstream diff --check
          git -C upstream diff -- \
            cranelift/codegen/src/context.rs \
            cranelift/codegen/meta/src/shared/instructions.rs \
            cranelift/codegen/src/isa/x64/lower.isle \
            cranelift/interpreter/src/step.rs > tier1-bidirectional-state/compiler-source/patch.diff
          test -s tier1-bidirectional-state/compiler-source/patch.diff
      - name: Build exact modified compiler under pinned toolchain and lockfile
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustc -Vv > tier1-bidirectional-state/compiler-source/rustc-version.txt
          cargo build --locked --manifest-path upstream/Cargo.toml -p wasmtime-cli \
            --bin wasmtime --no-default-features --features run,compile,wat,objdump \
            > tier1-bidirectional-state/compiler-source/build.stdout \
            2> tier1-bidirectional-state/compiler-source/build.stderr
          mkdir -p tier1-bidirectional-state/compilers/experimental
          cp upstream/target/debug/wasmtime tier1-bidirectional-state/compilers/experimental/wasmtime
          sha256sum tier1-bidirectional-state/compilers/{baseline,experimental}/wasmtime \
            > tier1-bidirectional-state/compiler-source/compiler-digests.txt
      - name: Measure same-WAT before/after native bytes, order traces and finite value/trap oracles
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/reverse_order_udivrem_28.py \
            --mode run --root tier1-bidirectional-state/compilers \
            --out tier1-bidirectional-state/evidence
      - name: Independently replay cost, source, compiler-trace and native value receipts
        run: |
          set -euo pipefail
          python3 -B experiments/cranelift-tier1/reverse_order_udivrem_28.py \
            --mode audit --root tier1-bidirectional-state/compilers \
            --out tier1-bidirectional-state/evidence
      - name: Preserve proof-and-cost catalog, original native images, source patch and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-bidirectional-divrem-28
          path: |
            tier1-bidirectional-state/evidence/
            tier1-bidirectional-state/compiler-source/
          retention-days: 30
          if-no-files-found: warn
