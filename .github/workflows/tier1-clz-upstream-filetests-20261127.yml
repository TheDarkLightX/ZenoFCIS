name: tier1-clz-upstream-filetests-20261127
on:
  push:
    branches: [research/tier1-bitselect-x64-20261123]
    paths: ['.github/workflows/tier1-clz-upstream-filetests-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '3'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUSTUP_TOOLCHAIN: '1.98.0'
  CRANELIFT_FILETESTS_THREADS: '3'
jobs:
  upstream-filetests:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: bytecodealliance/wasmtime
          ref: b738a89287bb78e51c06ac9624014bbda3c1429f
          path: upstream
          persist-credentials: false
      - name: A/B semantic and exact-output filetests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/clz-filetests"
          mkdir -p "$out"
          rustup toolchain install 1.98.0 --profile minimal
          rustc -Vv > "$out/rustc.txt"
          git rev-parse HEAD > "$out/zenofcis.txt"
          git -C upstream rev-parse HEAD > "$out/wasmtime.txt"
          test "$(git -C upstream hash-object cranelift/codegen/src/isa/x64/lower.isle)" = 545c79528cbb10fb1280623f23f53880b9762e49
          cat > "$out/clz-i128.clif" <<'CLIF'
          test run
          set enable_llvm_abi_extensions=true
          target x86_64
          target x86_64 has_lzcnt

          function %clz128(i128) -> i128 {
          block0(v0: i128):
              v1 = clz v0
              return v1
          }
          ; run: %clz128(0) == 128
          ; run: %clz128(1) == 127
          ; run: %clz128(0x10000000000000000) == 63
          ; run: %clz128(0x80000000000000000000000000000000) == 0
          ; run: %clz128(-1) == 0
          CLIF
          export CARGO_TARGET_DIR="$RUNNER_TEMP/clz-filetests-target"
          clif="$CARGO_TARGET_DIR/debug/clif-util"
          ft="$PWD/upstream/cranelift/filetests/filetests"
          for stage in baseline xor; do
            if test "$stage" = xor; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("upstream/cranelift/codegen/src/isa/x64/lower.isle")
          old=p.read_text()
          needle="(rule 0 (do_clz ty orig_ty src)"
          rules=""";; Experimental fallback only; BSR zero destination is discarded by CMOVZ.
          (rule tier1_clz32_xor 2 (do_clz $I32 $I32 src)
                (if-let false (has_lzcnt))
                (x64_xor $I32 (bsr_or_else $I32 src (imm_i64 $I64 63)) (RegMemImm.Imm 31)))
          (rule tier1_clz64_xor 3 (do_clz $I64 $I64 src)
                (if-let false (has_lzcnt))
                (x64_xor $I64 (bsr_or_else $I64 src (imm_i64 $I64 127)) (RegMemImm.Imm 63)))

          """
          assert old.count(needle)==1
          p.write_text(old.replace(needle,rules+needle))
          PY
              git -C upstream diff -- cranelift/codegen/src/isa/x64/lower.isle > "$out/experimental.patch"
              echo "0b4ae4f1935953ca40d3eaa18e701d946ac02657755092f757025d8d8977be54  $out/experimental.patch" | sha256sum -c -
            fi
            cargo build --locked --manifest-path upstream/cranelift/Cargo.toml --bin clif-util > "$out/$stage-build.log" 2>&1
            for suite in clz-runtime i128 exact-fallback exact-lzcnt x64 runtests; do
              case "$suite" in
                clz-runtime) args=("$ft/runtests/clz.clif" "$ft/runtests/icmp-of-clz.clif");;
                i128) args=("$out/clz-i128.clif");;
                exact-fallback) args=("$ft/isa/x64/clz.clif");;
                exact-lzcnt) args=("$ft/isa/x64/clz-lzcnt.clif");;
                x64) args=("$ft/isa/x64");;
                runtests) args=("$ft/runtests");;
              esac
              set +e
              timeout 20m "$clif" test "${args[@]}" > "$out/$stage-$suite.log" 2>&1
              status=$?
              set -e
              printf '%s\n' "$status" > "$out/$stage-$suite.exit"
              echo "$stage $suite exit=$status"
              tail -40 "$out/$stage-$suite.log"
            done
          done
          # Preserve original expected output. Candidate exact-fallback and x64
          # may fail because the intended code changes; no silent blessing.
          # CI failure retains logs for explicit classification.
          for f in "$out"/*.exit; do
            test "$(cat "$f")" = 0
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier1-clz-upstream-filetests
          path: ${{ runner.temp }}/clz-filetests/
          retention-days: 30
          if-no-files-found: warn
