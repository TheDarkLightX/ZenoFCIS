name: schema-codegen-assemble

on:
  push:
    branches:
      - agent/schema-codegen-v1
    paths:
      - "crates/zeno-fcis-schema/**"
      - "crates/zeno-fcis-codegen/**"
      - "docs/SCHEMA_CODEGEN_BOUNDARY.md"
      - "docs/AGENT_HANDOFF_BOUNDARY.md"
      - ".github/workflows/schema-codegen-assemble.yml"

permissions:
  contents: write

concurrency:
  group: schema-codegen-assemble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/schema-codegen-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Integrate schema and code-generation crates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("Cargo.toml")
          text = root.read_text(encoding="utf-8")
          marker = '    "crates/zeno-fcis-codec",\n'
          additions = '    "crates/zeno-fcis-schema",\n    "crates/zeno-fcis-codegen",\n'
          if '    "crates/zeno-fcis-schema",\n' not in text:
              if marker not in text:
                  raise SystemExit("workspace codec member marker missing")
              text = text.replace(marker, marker + additions, 1)
          root.write_text(text, encoding="utf-8")

          cargo = Path("crates/zeno-fcis/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          if '\nschema = ["dep:zeno-fcis-schema"]\n' not in text:
              match = re.search(r'(std\s*=\s*\[.*?\n\])', text, re.S)
              if match is None:
                  raise SystemExit("umbrella std feature list missing")
              block = match.group(1)
              replacement = block[:-2] + '''    "zeno-fcis-schema?/std",
]
schema = ["dep:zeno-fcis-schema"]
codegen = ["schema", "dep:zeno-fcis-codegen"]'''
              text = text.replace(block, replacement, 1)
              dependencies = '''zeno-fcis-schema = { path = "../zeno-fcis-schema", default-features = false, optional = true }
zeno-fcis-codegen = { path = "../zeno-fcis-codegen", optional = true }
'''
              if "[dependencies]\n" not in text:
                  raise SystemExit("umbrella dependency table missing")
              text = text.replace("[dependencies]\n", "[dependencies]\n" + dependencies, 1)
          cargo.write_text(text, encoding="utf-8")

          lib = Path("crates/zeno-fcis/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          if "pub use zeno_fcis_schema as schema;" not in text:
              marker = "pub use zeno_fcis_shell as shell;\n"
              if marker not in text:
                  raise SystemExit("umbrella shell export missing")
              exports = '''#[cfg(feature = "schema")]
/// Closed canonical protocol schemas and value admission.
pub use zeno_fcis_schema as schema;
#[cfg(feature = "codegen")]
/// Deterministic inspectable Rust/Python schema generation.
pub use zeno_fcis_codegen as codegen;
'''
              text = text.replace(marker, marker + exports, 1)
              text += '''
#[cfg(feature = "schema")]
pub use zeno_fcis_schema::{
    EnumVariantDef, FieldDef, FieldId, Schema, SchemaError, SchemaLimits, SchemaMetrics,
    SchemaName, SumVariantDef, TypeDef, TypeId, TypeKind, ValidationLimits,
    ValidationReport, ValueValidationError, VariantId,
};
#[cfg(feature = "codegen")]
pub use zeno_fcis_codegen::{
    CodegenError, GeneratedBundle, GeneratedFile, GenerationSpec, GENERATOR_ID,
    generate as generate_schema_bundle,
};
'''
          lib.write_text(text, encoding="utf-8")

          validate = Path("crates/zeno-fcis-schema/src/validate.rs")
          text = validate.read_text(encoding="utf-8")
          text = text.replace(
              "EnumVariantDef, Schema, SumVariantDef, TypeDef, TypeId, TypeKind, ValueValidationError,",
              "EnumVariantDef, Schema, SumVariantDef, TypeId, TypeKind, ValueValidationError,",
          )
          validate.write_text(text, encoding="utf-8")

          render = Path("crates/zeno-fcis-codegen/src/render.rs")
          text = render.read_text(encoding="utf-8")
          text = text.replace(
              "CanonicalEncode, CommitmentHasher, Domain, Hash32, commitment",
              "CanonicalEncode, Domain, Hash32, commitment",
          )
          render.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/schema-codegen.yml")
          workflow.write_text('''name: schema-codegen

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  schema-codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Closed schema law suite
        run: |
          cargo +1.97.1 test -p zeno-fcis-schema --all-features --locked
          cargo +1.97.1 check -p zeno-fcis-schema --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features schema --locked --target wasm32-unknown-unknown

      - name: Deterministic generation law suite
        run: |
          cargo +1.97.1 test -p zeno-fcis-codegen --locked
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features codegen --locked
''', encoding="utf-8")
          PY
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 fmt --all

      - name: Verify full workspace and schema feature matrix
        run: |
          cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-features --locked
          cargo +1.97.1 test --workspace --doc --all-features --locked
          cargo +1.97.1 check -p zeno-fcis-schema --no-default-features --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features schema --locked --target wasm32-unknown-unknown
          cargo +1.97.1 check -p zeno-fcis --no-default-features --features codegen --locked
          RUSTDOCFLAGS='-D warnings' cargo +1.97.1 doc --workspace --all-features --locked --no-deps

      - name: Commit formatted review surface and lockfile
        run: |
          git config user.name 'ZenoFCIS schema/codegen assembler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Cargo.toml \
            Cargo.lock \
            .github/workflows/schema-codegen.yml \
            crates/zeno-fcis-schema \
            crates/zeno-fcis-codegen \
            crates/zeno-fcis/Cargo.toml \
            crates/zeno-fcis/src/lib.rs \
            docs/SCHEMA_CODEGEN_BOUNDARY.md \
            docs/AGENT_HANDOFF_BOUNDARY.md
          if git diff --cached --quiet --exit-code; then
            exit 0
          fi
          git commit -m 'feat: add closed schemas and deterministic code generation'
          git push origin HEAD:agent/schema-codegen-v1
