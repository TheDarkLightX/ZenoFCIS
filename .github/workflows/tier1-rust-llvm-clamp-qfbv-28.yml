name: tier1-rust-llvm-clamp-qfbv-28

on:
  push:
    branches:
      - research/2.8-tier1-cranelift-performance-20261102
    paths:
      - ".github/workflows/tier1-rust-llvm-clamp-qfbv-28.yml"
      - "experiments/cranelift-tier1/verify_rust_llvm_clamp_28.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier1-rust-llvm-clamp-qfbv-28
  cancel-in-progress: true

jobs:
  independently-prove-llvm-value-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact isolated ZenoFCIS branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install hash-pinned independent QF_BV solver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tier1-clif-z3"
          "$RUNNER_TEMP/tier1-clif-z3/bin/python" -m pip install \
            --only-binary=:all: --require-hashes \
            -r tools/machine_code_requirements.txt
      - name: Independently prove the exact signed-overflow/clamp graph and reject wrong alternatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tier1-rust-llvm-clif-qfbv
          {
            git rev-parse HEAD
            sha256sum experiments/cranelift-tier1/verify_rust_llvm_clamp_28.py
            "$RUNNER_TEMP/tier1-clif-z3/bin/python" -c 'import z3; print("z3", z3.get_version_string())'
          } > tier1-rust-llvm-clif-qfbv/source.txt
          "$RUNNER_TEMP/tier1-clif-z3/bin/python" -B \
            experiments/cranelift-tier1/verify_rust_llvm_clamp_28.py \
            --out tier1-rust-llvm-clif-qfbv/receipt.json
      - name: Archive independent all-input proof and counterexample receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rust-llvm-core-qfbv-28
          path: tier1-rust-llvm-clif-qfbv/
          retention-days: 30
          if-no-files-found: warn
