name: strict-canonical-patch-decoder

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: zeno-fcis-strict-patch-decoder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-canonical-patch-decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Format
        run: cargo +1.97.1 fmt --all -- --check

      - name: Compile strict decoder boundary
        run: |
          cargo +1.97.1 clippy \
            -p zeno-fcis-patch \
            -p zeno-fcis \
            --all-targets --all-features --locked -- -D warnings

      - name: Decoder laws and negative cases
        run: |
          cargo +1.97.1 test \
            -p zeno-fcis-patch \
            --all-features --locked
          cargo +1.97.1 test \
            -p zeno-fcis-patch \
            --doc --all-features --locked

      - name: no_std decoder boundary
        run: |
          cargo +1.97.1 check \
            -p zeno-fcis-patch \
            --no-default-features --locked \
            --target wasm32-unknown-unknown
          cargo +1.97.1 check \
            -p zeno-fcis \
            --no-default-features --locked \
            --target wasm32-unknown-unknown

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.97.1 doc \
            -p zeno-fcis-patch \
            -p zeno-fcis \
            --all-features --locked --no-deps

      - name: Static authority-boundary checks
        run: python3 tools/check_assurance.py
