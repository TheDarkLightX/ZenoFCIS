<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAL review desk</title>
<!-- The page of integrations/zal/review_desk.py. It shows ZAL's results and records no agreement.
     review_desk.py fills the data slot and the token slot; nothing else is loaded. -->
<style>
/* Layout: the statement lies on the left like a contract; the instruments that examine it stand on the right;
   the verdict sits above both. Three voices: serif is ZAL's own English, mono is ZAL's typed line, sans is this
   page, and a line in symbols is the page's own spelling, so it is sans with the symbols in a mathematical face.
   Under the statement sits the reading key, which explains the line being read. */
:root {
  --desk: #eceff3; --sheet: #ffffff; --sheet-2: #f5f7fa;
  --ink: #131a24; --ink-2: #44536a; --ink-3: #5c6b7f;
  --line: #d0d7e1; --line-2: #e4e9ef;
  --claim: #4a3aa8; --claim-bg: #eeebfb;          /* claims: what must hold */
  --assume: #835500; --assume-bg: #fbefd2;        /* assumptions: supplied, never checked */
  --pass: #17683f; --pass-bg: #dcf2e5;
  --fail: #a5221b; --fail-bg: #fbe2df;
  --quiet: #55647a; --quiet-bg: #e5e9ef;          /* neither: refused, unsupported, structure */
  --focus: #1b66d6; --hot: #d9d2fb;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, "Iowan Old Style", Georgia, "DejaVu Serif", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --math: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Noto Sans Math", "DejaVu Math TeX Gyre", "Apple Symbols", "Segoe UI Symbol", "DejaVu Sans", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b111a; --sheet: #121a27; --sheet-2: #182232;
    --ink: #e8edf4; --ink-2: #aab7c8; --ink-3: #8797ab;
    --line: #2b394d; --line-2: #1f2a3b;
    --claim: #b9adff; --claim-bg: #251f4f;
    --assume: #e7bb5e; --assume-bg: #382b0d;
    --pass: #66d39c; --pass-bg: #10321f;
    --fail: #ff948b; --fail-bg: #421512;
    --quiet: #a4b2c3; --quiet-bg: #222e40;
    --focus: #86b4ff; --hot: #3b3179; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b111a; --sheet: #121a27; --sheet-2: #182232;
  --ink: #e8edf4; --ink-2: #aab7c8; --ink-3: #8797ab;
  --line: #2b394d; --line-2: #1f2a3b;
  --claim: #b9adff; --claim-bg: #251f4f;
  --assume: #e7bb5e; --assume-bg: #382b0d;
  --pass: #66d39c; --pass-bg: #10321f;
  --fail: #ff948b; --fail-bg: #421512;
  --quiet: #a4b2c3; --quiet-bg: #222e40;
  --focus: #86b4ff; --hot: #3b3179; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 14px/1.5 var(--sans); }
*, *::before, *::after { box-sizing: border-box; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--mono); font-variant-ligatures: none; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-weight: 650; text-wrap: balance; }

.app { display: flex; flex-direction: column; min-height: 100%; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; font-size: 15px; white-space: nowrap; }
.brand b { font-family: var(--mono); font-weight: 700; letter-spacing: 0.02em; }
.brand span { color: var(--ink-2); }
.pick { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 340px; }
.pick label { color: var(--ink-3); font-size: 13px; }
.pick select { width: 100%; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); }
.top .mode { margin-left: auto; color: var(--ink-3); font-size: 12.5px; max-width: 52ch; }
.top #theme { margin-left: 0; }
@media (max-width: 760px) { .top .mode { display: none; } .top #theme { margin-left: auto; order: 2; } .pick { order: 3; flex: 1 1 100%; } }
.btn { padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); font-weight: 600; }
.btn.small { padding: 2px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; color: var(--claim); text-decoration: underline; text-underline-offset: 2px; }

/* verdict */
.verdict { padding-block: 12px 12px; background: var(--sheet); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; box-shadow: inset 0 3px 0 var(--quiet); }
.verdict[data-s="pass"] { box-shadow: inset 0 3px 0 var(--pass); }
.verdict[data-s="fail"] { box-shadow: inset 0 3px 0 var(--fail); }
.verdict[data-s="warn"] { box-shadow: inset 0 3px 0 var(--assume); }
.v-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.v-name { font-size: 22px; letter-spacing: -0.01em; }
.v-file { color: var(--ink-3); font-family: var(--mono); font-size: 12.5px; }
.v-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 15.5px; }
.v-facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); font-size: 13px; }
.v-facts b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.v-alerts { display: flex; flex-wrap: wrap; gap: 8px; }
.alert { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 6px; font-size: 13px; border: 1px solid transparent; text-align: left; }
.alert.warn { background: var(--assume-bg); color: var(--assume); }
.alert.bad { background: var(--fail-bg); color: var(--fail); }
.alert.ok { background: var(--pass-bg); color: var(--pass); }
.alert.info { background: var(--quiet-bg); color: var(--quiet); }
button.alert:hover { border-color: currentColor; }

.status { display: inline-block; font-family: var(--mono); font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
.status[data-s="pass"] { background: var(--pass-bg); color: var(--pass); }
.status[data-s="fail"] { background: var(--fail-bg); color: var(--fail); }
.status[data-s="quiet"] { background: var(--quiet-bg); color: var(--quiet); }

/* panes */
.panes { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.statement, .bench { min-width: 0; }
.tabs { display: flex; gap: 2px; padding-top: 8px; background: var(--desk); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; overflow-x: auto; }
.tab { padding: 8px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: none; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--sheet); border-color: var(--line); color: var(--ink); margin-bottom: -1px; padding-bottom: 9px; }
.tab .count { margin-left: 6px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.panel { padding-block: 18px 40px; background: var(--sheet); min-height: 320px; display: flex; flex-direction: column; gap: 26px; }
.statement { background: var(--sheet); }
.doc { padding-block: 18px 40px; container-type: inline-size; }
.panel .doc { padding-block: 0; }
@media (min-width: 1060px) {
  .app { height: 100vh; height: 100dvh; }                   /* the two panes scroll on their own; the verdict stays put */
  .panes { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); overflow: hidden; }
  .statement.pane { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--line); padding: 0; }
  .statement.pane .doc { flex: 1; min-height: 0; overflow: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) 22px; scroll-padding-block: 12px; }
  .statement.pane .key { flex: none; max-height: 42%; }
  .statement.pane .key[data-for="line"] { height: clamp(220px, 42%, 400px); }   /* steady while the reader moves from line to line */
  .statement.pane .key[data-hidden="true"] { height: auto; }
  .bench { display: flex; flex-direction: column; min-height: 0; background: var(--desk); }
  .tabs { position: static; padding-left: 14px; }
  .panel { flex: 1; overflow: auto; padding-left: 22px; }
  .tab[data-tab="statement"], .only-narrow { display: none; }
}
@media (max-width: 1059.98px) {
  .statement.pane { display: none; }
}

/* statement */
.doc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.doc-head h2 { font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto; }
.seg button { border: 0; background: var(--sheet); padding: 3px 10px; font-size: 12.5px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.preface { color: var(--ink-2); font-size: 13px; margin-bottom: 8px; max-width: 70ch; }
.sec { margin-top: 20px; }
.preamble { padding: 10px 2px 4px; display: flex; flex-direction: column; gap: 8px; }
.preamble .en { max-width: 70ch; }
.preamble .sy { line-height: 1.6; }
.sec-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.sec-h h3 { font-size: 13px; letter-spacing: 0.03em; }
.sec-h span { color: var(--ink-3); font-size: 12.5px; }
.sec[data-kind="claims"] .sec-h h3 { color: var(--claim); }
.sec[data-kind="assumptions"] .sec-h h3 { color: var(--assume); }
.clause { border-left: 4px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
.clause:hover, .clause.open, .clause.at { background: var(--sheet-2); }
.clause.at { box-shadow: inset 0 0 0 1px var(--line); }
.clause[data-now="yes"] { background: var(--sheet-2); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.cl-head { display: grid; grid-template-columns: minmax(0, 1fr) 164px; gap: 3px 16px; padding: 9px 8px 9px 11px; border: 0; width: 100%; text-align: left; background: none; align-items: start; }
.cl-main { display: contents; }
.cl-id { grid-column: 1; grid-row: 1; }
.cl-head .en { grid-column: 1; grid-row: 2; }
.cl-margin { grid-column: 2; grid-row: 1 / span 2; }
.cl-head .fm { grid-column: 1 / -1; grid-row: 3; }
.cl-head .sy { grid-column: 1 / -1; grid-row: 4; }
.cl-head.stacked { grid-template-columns: minmax(0, 1fr); }
.cl-head.stacked .cl-margin { grid-column: 1; grid-row: 5; padding-top: 2px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.clause.voc { border-bottom: 0; border-left-color: transparent; }
.clause.voc .cl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; padding-block: 2px; }
.clause.voc .cl-margin { padding-top: 0; }
.clause[data-cov="held"] { border-left-color: var(--pass); }
.clause[data-cov="structure"] { border-left-color: var(--quiet); }
.clause[data-cov="free"] { border-left-color: var(--fail); }
.clause[data-cov="teeth"] { border-left-color: var(--claim); }
.clause[data-cov="blunt"], .clause[data-cov="assume"] { border-left-color: var(--assume); }
.cl-margin { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); padding-top: 19px; min-width: 0; }
.cl-margin .bad { color: var(--fail); font-weight: 600; }
.cl-margin .warn { color: var(--assume); font-weight: 600; }
@container (max-width: 560px) {
  .cl-head { grid-template-columns: minmax(0, 1fr); }
  .cl-margin { grid-column: 1; grid-row: 5; padding-top: 2px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
}
.rail-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: -6px 0 4px; }
.rail-key span { display: inline-flex; align-items: center; gap: 6px; }
.rail-key i { width: 4px; height: 14px; border-radius: 1px; display: inline-block; }
.cl-id { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.sec[data-kind="claims"] .cl-id { color: var(--claim); }
.sec[data-kind="assumptions"] .cl-id { color: var(--assume); }
.en { font-family: var(--serif); font-size: 16px; line-height: 1.5; max-width: 68ch; }
.sy { display: block; font-size: 12.5px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.cl-more { padding: 0 8px 11px 11px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.now { font-weight: 600; padding: 1px 7px; border-radius: 4px; }
.now.yes { background: var(--ink); color: var(--sheet); }
.now.holds { background: var(--pass-bg); color: var(--pass); }
.now.fails { background: var(--fail-bg); color: var(--fail); }
.now.no { padding: 0; font-weight: 500; color: var(--ink-3); }

/* a line in symbols: words of the logic are upright and strong, declared names are italic, labels and numbers are plain */
.fm { display: block; font: 15px/1.7 var(--sans); color: var(--ink); overflow-wrap: anywhere; }
.fm-l { display: block; }
.fm-l.cont { padding-left: 1.3em; text-indent: -1.3em; }           /* a long line breaks before its main connective */
.g { border-radius: 3px; cursor: help; }
.g.o { font-family: var(--math); font-size: 1.1em; line-height: 1; }
.g.o[data-k="add"], .g.o[data-k="sub"] { margin-inline: 0.16em; }     /* the ladder writes sums without spaces; this only sets them apart */
.g.w { font-weight: 600; }
.g.nm { font-style: italic; }
.g.main { margin-right: 0.3em; }
.g.hot, .krow.hot, .kchip.hot { background: var(--hot); box-shadow: 0 0 0 2px var(--hot); }
.fm-note { font-size: 12.5px; color: var(--ink-3); margin-left: 12px; white-space: nowrap; }
.fm-more { display: none; color: var(--ink-3); }                    /* what a rule leaves unchanged: shown for the line being read */
.fm-fold { font-size: 12px; color: var(--ink-3); margin-left: 8px; white-space: nowrap; border-bottom: 1px dashed var(--ink-3); }
.clause:hover .fm-more, .clause:focus-within .fm-more, .clause.at .fm-more, .clause.open .fm-more { display: inline; }
.clause:hover .fm-fold, .clause:focus-within .fm-fold, .clause.at .fm-fold, .clause.open .fm-fold { display: none; }
.truth .tv { white-space: normal; padding: 1px 4px; }
.truth .tv[data-v="false"] { text-decoration: none; }
.truth .g.t { color: var(--pass); }
.truth .g.f { color: var(--ink-3); }
.where { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* the reading key */
.key { container-type: inline-size; display: flex; flex-direction: column; min-height: 0; background: var(--sheet-2); border-top: 1px solid var(--line); }
.key.inline { border: 1px solid var(--line-2); border-radius: 8px; }
.key-h { display: flex; align-items: baseline; gap: 10px; padding: 8px 14px 6px max(16px, env(safe-area-inset-left, 0px)); }
.key.inline .key-h { padding-left: 12px; }
.key-h h3 { font-size: 13px; letter-spacing: 0.03em; white-space: nowrap; }
.key-h .for { flex: 1; min-width: 0; color: var(--ink-2); font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key-b { overflow: auto; min-height: 0; padding: 0 14px 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.key.inline .key-b { padding-left: 12px; }
.kkind { font-family: var(--serif); font-size: 14.5px; line-height: 1.45; color: var(--ink); max-width: 78ch; }
.ksaid { font-size: 15px; }
.krows { display: grid; grid-template-columns: max-content fit-content(12.5em) minmax(0, 1fr) max-content; column-gap: 14px; }
.krow { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: baseline; padding: 3px 6px; border-top: 1px solid var(--line-2); border-radius: 4px; }
.ks { font: 600 15px var(--sans); color: var(--ink); overflow-wrap: anywhere; }
.ks.o { font: 400 20px/1 var(--math); }
.ks.nm { font-style: italic; font-weight: 400; }
.kr { font-family: var(--serif); font-size: 14.5px; color: var(--ink); }
.ka { display: block; font-size: 13.5px; color: var(--ink-2); }                /* another reading of the same symbol */
.kn { font: 600 12.5px var(--sans); color: var(--ink-2); }                      /* the operator's name in ZAL's registry */
.km { font-family: var(--serif); font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.krow.desk .km { font-family: var(--sans); font-size: 13px; }
.who, .kt { font: 12px var(--sans); color: var(--ink-3); white-space: nowrap; }
.kt code { font-size: 12px; }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kchip { display: inline-flex; align-items: baseline; gap: 7px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); font-size: 13px; color: var(--ink-2); }
.kchip .ks { font-size: 13.5px; }
.kchip .ks.o { font-size: 17px; }
.kchip.known { border-style: dashed; }
.kchip[aria-expanded="true"] { border-color: var(--ink-3); border-style: solid; }
@container (max-width: 560px) {
  .krows { grid-template-columns: max-content minmax(0, 1fr) max-content; }
  .krow .km { grid-column: 1 / -1; grid-row: 2; }
  .krow .btn { grid-column: 3; grid-row: 1; }
}
.cl-more .reading { font-family: var(--serif); font-size: 15px; color: var(--ink); }
.marks { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; vertical-align: middle; max-width: 100%; }
.m { width: 9px; height: 9px; display: inline-block; border: 1.5px solid var(--ink-3); border-radius: 1px; }
.m.claim { background: var(--pass); border-color: var(--pass); }
.m.hit { background: var(--claim); border-color: var(--claim); }
.m.structure { background: var(--quiet); border-color: var(--quiet); opacity: 0.55; }
.m.unnoticed { border-color: var(--fail); }
.m.vacuous { border-color: var(--assume); transform: rotate(45deg) scale(0.86); }
.m.no-change, .m.refused { border-style: dotted; }

/* bench blocks */
.block { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.block h3 { font-size: 16px; }
.block > .lede { color: var(--ink-2); max-width: 72ch; margin-top: -6px; }
.quote { font-family: var(--serif); font-size: 15.5px; line-height: 1.5; padding: 10px 14px; background: var(--sheet-2); border-left: 3px solid var(--line); border-radius: 0 6px 6px 0; max-width: 78ch; }
.checks { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0; border-top: 1px solid var(--line-2); max-width: 720px; }
.checks > div { padding: 6px 4px; border-bottom: 1px solid var(--line-2); }
.checks .k { font-family: var(--mono); font-size: 12px; color: var(--ink-3); display: block; }
.checks h4 { grid-column: 1 / -1; margin: 0; padding: 10px 4px 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line-2); }
.adv { padding: 10px 14px; border-radius: 6px; background: var(--assume-bg); color: var(--ink); max-width: 78ch; }
.adv + .adv { margin-top: 8px; }
.adv .kind { font-family: var(--mono); font-size: 12px; color: var(--assume); font-weight: 600; }
.adv .means { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.story { margin: 0; padding: 0; list-style: none; counter-reset: s; max-width: 78ch; }
.story li { counter-increment: s; position: relative; padding: 0 0 12px 34px; font-family: var(--serif); font-size: 16px; }
.story li::before { content: counter(s); position: absolute; left: 0; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: var(--quiet-bg); color: var(--quiet); font: 600 12px/22px var(--sans); text-align: center; }
.story li:last-child::before { background: var(--fail-bg); color: var(--fail); }
.story li + li::after { content: ""; position: absolute; left: 10.5px; top: -12px; height: 12px; border-left: 1.5px solid var(--line); }
.scroll-x { overflow-x: auto; max-width: 100%; }
table.matrix { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.matrix th, .matrix td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: middle; }
.matrix th:first-child, .matrix td:first-child { min-width: 150px; }
.matrix tr.row td:first-child { padding-left: 20px; }
.matrix td.res { white-space: nowrap; padding-right: 18px; }
.matrix .res .sub { display: block; margin-left: 17px; font: 500 11.5px var(--mono); color: var(--ink-3); }
.matrix .fill { width: 100%; padding: 0; }
@media (min-width: 620px) { .matrix tr.row td:first-child { white-space: nowrap; } }

  if (LIVE) setInterval(async () => {                         /* notice when the file on disk moves on */
    try { const r = await fetch("/api/changed", { headers: { "X-ZAL-Review-Desk": TOKEN } }), d = await r.json();
      if (!d.changed || S.stale) return;
      if (!DESK.bundles.length) location.reload(); else { S.stale = true; renderVerdict(); }
    } catch (e) { /* the server has stopped; the page keeps what it has */ }
  }, 2000);
}
boot();
</script>
