<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
         viewBox="0 0 1600 1000" role="img" aria-label="One interface. Closed boundaries.">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.62" stop-color="#08111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.06" r="0.78">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#39506a"
            stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000611"
                    flood-opacity="0.62"/>
    </filter>
  </defs>
  <style>
    .brand { font-family: Inter, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 5px; fill: #dce8f6; }
    .release { font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 2px; fill: #83f5d0; }
    .eyebrow { font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 3px; fill: #5eead4; }
    .title { font-family: 'Inter Display', Inter, sans-serif; font-size: 52px; font-weight: 600; fill: #f4f8fd; }
    .subtitle { font-family: Inter, sans-serif; font-size: 22px; font-weight: 400; fill: #9db0c8; }
    .terminal { font-family: 'DejaVu Sans Mono', monospace; font-size: 20px; font-weight: 400; fill: #dce7f4; }
    .prompt { font-family: 'DejaVu Sans Mono', monospace; font-size: 20px; font-weight: 600; fill: #6ee7c7; }
    .terminal-title { font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; fill: #70849e; letter-spacing: 1px; }
    .badge { font-family: Inter, sans-serif; font-size: 16px; font-weight: 500; fill: #b9c9dc; }
    .footer { font-family: Inter, sans-serif; font-size: 15px; font-weight: 400; fill: #64778f; }
    .node-id { font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; fill: #7de4cb; letter-spacing: 2px; }
    .node-title { font-family: 'DejaVu Sans Mono', monospace; font-size: 25px; font-weight: 600; fill: #ecf7ff; }
    .metric-label { font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 2px; fill: #72d9ca; }
    .metric-value { font-family: 'Inter Display', Inter, sans-serif; font-size: 48px; font-weight: 600; fill: #f2f8ff; }
    .hash { font-family: 'DejaVu Sans Mono', monospace; font-size: 17px; font-weight: 400; fill: #c5d5e8; }
    .slot-detail { font-family: Inter, sans-serif; font-size: 14px; font-weight: 400; fill: #8fa5bc; }
  </style>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="0" y="0" width="9" height="1000" fill="#5eead4"/>

  <text x="128" y="72" class="brand">ZENOFCIS</text>
  <text x="1457" y="72" text-anchor="end" class="release">1.0.0-RC.3</text>
  <text x="128" y="132" class="eyebrow">AUTHORING CLI</text>
  <text x="128" y="197" class="title">One interface. Closed boundaries.</text>
  <text x="128" y="238" class="subtitle">Check, generate, explain, graph, and prove bounded ZenoFCIS projects.</text>

  <g filter="url(#shadow)">
    <rect x="128" y="282" width="1344" height="610" rx="24" fill="#080e18"
          stroke="#26364c" stroke-width="2"/>
    <rect x="128" y="282" width="1344" height="70" rx="24" fill="#0d1624"/>
    <rect x="128" y="328" width="1344" height="24" fill="#0d1624"/>
    <circle cx="170" cy="317" r="8" fill="#ff6b6b"/>
    <circle cx="198" cy="317" r="8" fill="#f6c85f"/>
    <circle cx="226" cy="317" r="8" fill="#58d68d"/>
    <text x="800" y="323" text-anchor="middle" class="terminal-title">DETERMINISTIC CLI RENDER</text>
  </g>
  <text x="164" y="382" class="prompt">$ zeno-fcis --help</text>
  <text x="164" y="413" class="terminal">Deterministic authoring, composition, and formal-tool workflows for ZenoFCIS</text><text x="164" y="438" class="terminal"></text><text x="164" y="463" class="terminal">Usage: zeno-fcis &lt;COMMAND&gt;</text><text x="164" y="488" class="terminal"></text><text x="164" y="513" class="terminal">Commands:</text><text x="164" y="538" class="terminal">  new             Create a bounded project without overwriting a nonempty directory</text><text x="164" y="563" class="terminal">  check           Parse and elaborate a .zeno project with accumulated diagnostics</text><text x="164" y="588" class="terminal">  generate        Generate deterministic Rust and manifest artifacts, or check for drift</text><text x="164" y="613" class="terminal">  graph           Render a deterministic composition graph as DOT, Mermaid, or JSON</text><text x="164" y="638" class="terminal">  explain         Explain all diagnostics or one stable diagnostic code</text><text x="164" y="663" class="terminal">  prove           Run an exact, separately configured CVC5, Z3, or Lean backend</text><text x="164" y="688" class="terminal">  counterexample  Request and replay a bounded SMT counterexample</text><text x="164" y="713" class="terminal">  doctor          Check separately configured formal tools and their exact identities</text><text x="164" y="738" class="terminal">  backend         List, inspect, inventory, or verify closed formal backend configurations</text><text x="164" y="763" class="terminal"></text><text x="164" y="788" class="terminal">Options:</text><text x="164" y="813" class="terminal">  -h, --help     Print help</text><text x="164" y="838" class="terminal">  -V, --version  Print version</text>

  <rect x="128" y="925" width="195" height="38" rx="19" fill="#0d1728" stroke="#263751"/><text x="143" y="951" class="badge">Versioned .zeno</text><rect x="337" y="925" width="250" height="38" rx="19" fill="#0d1728" stroke="#263751"/><text x="352" y="951" class="badge">Deterministic output</text><rect x="601" y="925" width="151" height="38" rx="19" fill="#0d1728" stroke="#263751"/><text x="616" y="951" class="badge">Fail closed</text>
  <text x="1472" y="951" text-anchor="end" class="footer">Executable output · deterministic renderer</text>
</svg>
