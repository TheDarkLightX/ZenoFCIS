[package]
name = "zeno-fcis-site-account-lockout"
description = "The account-lockout example's unchanged authority in the browser, over an in-memory shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The template as `zeno-fcis new` shipped it, without its SQLite shell.
account-lockout = { path = "../../apps/account-lockout", default-features = false }
zeno-fcis-site-common = { path = "../../common" }

[lints]
workspace = true
