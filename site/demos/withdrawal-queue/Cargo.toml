[package]
name = "zeno-fcis-site-withdrawal-queue"
description = "The withdrawal-queue example's unchanged authority in the browser, over an in-memory shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
