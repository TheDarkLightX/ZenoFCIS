[package]
name = "zeno-fcis-site-agent-treasury-guard"
description = "The agent-treasury-guard example's unchanged authority in the browser, over an in-memory shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
