[package]
name = "tier1-wasmtime-inprocess-28"
version = "0.0.0"
edition = "2021"
publish = false

# Avoid accidentally inheriting the large ZenoFCIS workspace.
[workspace]

[dependencies]
# Required exact repository checkout: upstream @ b1f81d2ad4fc64fbe0e70a7cc5fccac1a7864c49
# Deserialization and execution only; do not compile Wasm inside the timed region.
# The pinned CLI producer enables component-model-async/concurrency support by
# default; its precompiled artifacts retain that tunable even for core Wasm.
# Match the producer's runtime capability rather than bypassing AOT admission.
wasmtime = { path = "../../../upstream/crates/wasmtime", default-features = false, features = ["runtime", "std", "component-model-async"] }
